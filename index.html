    const migrated = migrateState(input);
    const privilegedKeys = ["users", "currentUser", "roleCodes", "primaryRoleCode", "isAdmin"];
    if (privilegedKeys.some((key) => Object.prototype.hasOwnProperty.call(migrated, key))) {
      return { valid: false, state: fallback, reason: "PRIVILEGED_FIELD_INJECTION" };
    }
    const normalized = deepMerge(fallback, migrated);
    if (!USERS[normalized.currentUsername]) return { valid: false, state: fallback, reason: "INVALID_IDENTITY" };
    if (!Array.isArray(normalized.requests) || !Array.isArray(normalized.tasks) || !Array.isArray(normalized.audit)) return { valid: false, state: fallback, reason: "INVALID_COLLECTIONS" };
    if (!Number.isInteger(normalized.revision) || normalized.revision < 0) return { valid: false, state: fallback, reason: "INVALID_REVISION" };
    const requestIds = new Set();
    for (const request of normalized.requests) {
      if (!request || typeof request.requestId !== "string" || requestIds.has(request.requestId) || !MODULE_CODES.includes(request.moduleCode)) {
        return { valid: false, state: fallback, reason: "INVALID_REQUEST" };
      }
      requestIds.add(request.requestId);
      if (!userByEmpId(request.requesterEmpId)) return { valid: false, state: fallback, reason: "INVALID_REQUEST_OWNER" };
      if (request.statusCode === "FULFILMENT") request.statusCode = "FULFILLMENT";
    }
    normalized.schemaVersion = SCHEMA_VERSION;
    normalized.auth.maxAttempts = Number(resolveConfig(normalized, "AUTH_MAX_FAILED", null, null)) || 3;
    return { valid: true, state: normalized, reason: null };
  }

  function migrateState(input) {
    const state = deepClone(input);
    const version = Number(state.schemaVersion) || 1;
    if (version < 6) {
      state.loggedIn = false;
      state.currentUsername = USERS[state.currentUsername] ? state.currentUsername : "employee";
      state.revision = Number(state.revision) || 0;
    }
    if (version < 7 && Array.isArray(state.requests)) {
      state.requests.forEach((request) => {
        if (request.statusCode === "FULFILMENT") request.statusCode = "FULFILLMENT";
      });
    }
    if (version < 8) {
      for (const key of ["authorizationCache", "accessCache", "scopeCache", "permissionCache", "roleGrants"]) delete state[key];
      state.rolePolicy = normalizeRolePolicy(state.rolePolicy);
      state.authorization = {
        modelVersion: 2,
        migratedFromSchema: version,
        normalizedAt: DEMO_NOW
      };
    } else {
      state.rolePolicy = normalizeRolePolicy(state.rolePolicy);
      state.authorization = {
        modelVersion: 2,
        migratedFromSchema: state.authorization?.migratedFromSchema ?? null,
        normalizedAt: state.authorization?.normalizedAt || DEMO_NOW
      };
    }
    state.schemaVersion = SCHEMA_VERSION;
    return state;
  }

  function normalizeRolePolicy() {
    // Authorization policy is executable configuration. Rebuild it from the
    // frozen contract so stale or injected cached grants can never survive a
    // schema migration.
    return deepClone(ROUTE_POLICY);
  }

  function deepMerge(base, override) {
    if (Array.isArray(base)) return Array.isArray(override) ? deepClone(override) : deepClone(base);
    if (!base || typeof base !== "object") return override === undefined ? base : deepClone(override);
    const result = {};
    const keys = new Set([...Object.keys(base), ...Object.keys(override && typeof override === "object" ? override : {})]);
    for (const key of keys) {
      if (["__proto__", "prototype", "constructor"].includes(key)) continue;
      if (override && Object.prototype.hasOwnProperty.call(override, key)) {
        result[key] = Object.prototype.hasOwnProperty.call(base, key) ? deepMerge(base[key], override[key]) : deepClone(override[key]);
      } else result[key] = deepClone(base[key]);
    }
    return result;
  }

  class StateStore {
    constructor(storage, options) {
      this.storage = storage || null;
      this.storageKey = options?.storageKey || STORAGE_KEY;
      this.legacyStorageKeys = options?.legacyStorageKeys || LEGACY_STORAGE_KEYS;
      this.state = seedState();
      this.listeners = new Set();
      this.lastError = null;
      this.channel = null;
      if (options?.sync !== false && typeof BroadcastChannel !== "undefined") {
        this.channel = new BroadcastChannel(`${this.storageKey}-sync`);
        this.channel.addEventListener("message", (event) => this.receiveExternal(event.data));
      }
      if (options?.autoLoad !== false) this.load();
    }

    load() {
      if (!this.storage) return this.state;
      try {
        let sourceKey = this.storageKey;
        let raw = this.storage.getItem(sourceKey);
        if (!raw) {
          sourceKey = this.legacyStorageKeys.find((key) => this.storage.getItem(key)) || this.storageKey;
          raw = this.storage.getItem(sourceKey);
        }
        if (!raw) {
          this.state = seedState();
          return this.state;
        }
        const parsed = JSON.parse(raw);
        const result = validateState(parsed);
        this.state = result.state;
        if (!result.valid) {
          this.lastError = `STATE_RESET_REQUIRED:${result.reason}`;
          this.persist(this.state, null, true);
        } else if (sourceKey !== this.storageKey) {
          this.persist(this.state, null, true);
          this.storage.removeItem(sourceKey);
        }
      } catch (error) {
        this.lastError = error instanceof SyntaxError
          ? "CORRUPT_STORAGE:JSON_PARSE_FAILED"
          : `STORAGE_LOAD_FAILED:${error?.message || "UNKNOWN"}`;
        this.state = seedState();
        try {
          this.persist(this.state, null, true);
        } catch {
          this.lastError += ":RESET_PERSIST_FAILED";
        }
      }
      return this.state;
    }

    getState() {
      return this.state;
    }

    setState(next, expectedRevision) {
      const result = validateState(next);
      if (!result.valid) throw new Error(`STATE_VALIDATION_FAILED:${result.reason}`);
      if (expectedRevision !== undefined && expectedRevision !== this.state.revision) throw new Error("STALE_REVISION");
      const previous = this.state;
      this.state = result.state;
      try {
        this.persist(this.state, expectedRevision, false);
      } catch (error) {
        this.state = previous;
        this.lastError = error.message || "STORAGE_WRITE_FAILED";
        throw error;
      }
      this.emit();
      return this.state;
    }

    persist(value, expectedRevision, repair) {
      if (!this.storage) return;
      if (!repair && expectedRevision !== undefined) {
        const raw = this.storage.getItem(this.storageKey);
        if (raw) {
          const current = JSON.parse(raw);
          if (Number(current.revision) !== Number(expectedRevision)) throw new Error("STALE_REVISION");
        }
      }
      this.storage.setItem(this.storageKey, JSON.stringify(value));
      if (this.channel) this.channel.postMessage({ revision: value.revision, state: value });
    }

    reset() {
      const next = resetDemoState(this.state);
      next.revision = this.state.revision + 1;
      this.setState(next, this.state.revision);
      return this.state;
    }

    subscribe(listener) {
      this.listeners.add(listener);
      return () => this.listeners.delete(listener);
    }

    emit() {
      this.listeners.forEach((listener) => listener(this.state));
    }

    receiveExternal(payload) {
      if (!payload || !payload.state || Number(payload.revision) <= Number(this.state.revision)) return;
      const result = validateState(payload.state);
      if (result.valid) {
        this.state = result.state;
        this.emit();
      }
    }

    destroy() {
      if (this.channel) this.channel.close();
    }
  }

  function resetDemoState() {
    return seedState();
  }

  function currentUser(state) {
    return userByUsername(state?.currentUsername) || null;
  }

  function coherentScope(routeScope, moduleScope) {
    if (!routeScope || !moduleScope || routeScope === "N" || moduleScope === "N") return "N";
    if (routeScope === moduleScope) return routeScope;
    if (routeScope === "R" || moduleScope === "R") return "R";
    if (routeScope === "G" || moduleScope === "G") return "G";
    if (routeScope === "F" && moduleScope === "F") return "F";
    if (routeScope === "A") return "A";
    if (routeScope === "M") return moduleScope;
    if (moduleScope === "M") return routeScope;
    return moduleScope;
  }

  function actionsForRole(roleCode) {
    return Object.entries(ACTION_POLICY)
      .filter(([, roleCodes]) => roleCodes.includes(roleCode))
      .map(([action]) => action);
  }

  function routeGrant(state, user, routeName, roleCode, context) {
    const policy = state?.rolePolicy?.[routeName] || ROUTE_POLICY[routeName];
    if (!policy) return null;
    const moduleCode = context?.moduleCode || policy.moduleCode || null;
    let scopeCode = policy.scopes?.[roleCode] || "N";
    if (moduleCode && !policy.moduleCode && MODULE_ROUTES[moduleCode]) {
      const moduleRoute = MODULE_ROUTES[moduleCode];
      const modulePolicy = state?.rolePolicy?.[moduleRoute] || ROUTE_POLICY[moduleRoute];
      scopeCode = coherentScope(scopeCode, modulePolicy?.scopes?.[roleCode] || "N");
    }
    if (scopeCode === "N") return null;
    return Object.freeze({
      sourceRoleCode: roleCode,
      routeName,
      screenPage: policy.page,
      moduleCode,
      scopeCode,
      mode: ["R", "G"].includes(scopeCode) ? "READ_ONLY" : "WRITE",
      permittedActions: Object.freeze(actionsForRole(roleCode)),
      reasonCode: `ROLE_${roleCode}_SCOPE_${scopeCode}`
    });
  }

  function grantMatchesRecord(state, user, grant, request) {
    if (!grant || !request || (grant.moduleCode && grant.moduleCode !== request.moduleCode)) return false;
    if (["F", "G", "R"].includes(grant.scopeCode)) return true;
    if (grant.scopeCode === "O") return request.requesterEmpId === user.empId;
    if (grant.scopeCode === "T") return isReportee(state, user.empId, request.requesterEmpId);
    if (grant.scopeCode === "D") {
      const departmentId = request.departmentIdSnapshot ?? userByEmpId(request.requesterEmpId)?.departmentId;
      return Number(departmentId) === Number(user.departmentId);
    }
    if (grant.scopeCode === "M") return (MODULE_OWNER_ROLES[request.moduleCode] || []).includes(grant.sourceRoleCode);
    if (grant.scopeCode === "A") {
      const taskRow = activeTaskForRequest(state, request.requestId);
      return PolicyEngine.canActOnTask(state, user, taskRow, "VIEW");
    }
    return false;
  }

  function grantAllowsRecordAction(state, user, grant, request, action, context) {
    if (!grantMatchesRecord(state, user, grant, request) || grant.mode !== "WRITE") return false;
    if (["COMMENT", "ATTACH"].includes(action)) {
      if (context?.visibilityCode === "INTERNAL") {
        return grant.permittedActions.includes(action) && ["M", "F"].includes(grant.scopeCode)
          && ((MODULE_OWNER_ROLES[request.moduleCode] || []).includes(grant.sourceRoleCode) || grant.sourceRoleCode === "SYS");
      }
      return grant.permittedActions.includes(action);
    }
    if (action === "EDIT_REQUEST") {
      return grant.sourceRoleCode === "EMP" && grant.scopeCode === "O"
        && request.requesterEmpId === user.empId && ["DRAFT", "SENT_BACK"].includes(request.statusCode);
    }
    if (["SUBMIT_REQUEST", "SUBMIT"].includes(action)) {
      return grant.sourceRoleCode === "EMP" && grant.scopeCode === "O" && request.requesterEmpId === user.empId;
    }
    if (["CANCEL", "RESUBMIT"].includes(action)) {
      return grant.sourceRoleCode === "EMP" && grant.scopeCode === "O"
        && request.requesterEmpId === user.empId && !TERMINAL.has(request.statusCode);
    }
    if (["ITSM_REOPEN", "ITSM_RATE"].includes(action)) {
      return request.moduleCode === "ITSM" && grant.sourceRoleCode === "EMP"
        && grant.scopeCode === "O" && request.requesterEmpId === user.empId;
    }
    if (["APPROVE", "REJECT", "SEND_BACK", "CLAIM", "ASSIGN"].includes(action)) {
      const approvalGrant = PolicyEngine.getRouteGrants(state, user, "approvals", { moduleCode: request.moduleCode })
        .find((item) => item.sourceRoleCode === grant.sourceRoleCode && ["A", "F"].includes(item.scopeCode));
      return Boolean(approvalGrant && PolicyEngine.canActOnTask(state, user, context?.task || activeTaskForRequest(state, request.requestId), action));
    }
    if (["RESOLVE", "START_FULFILLMENT", "CLOSE_FULFILLMENT"].includes(action)) {
      return ["M", "F"].includes(grant.scopeCode)
        && (MODULE_OWNER_ROLES[request.moduleCode] || []).includes(grant.sourceRoleCode)
        && (action === "START_FULFILLMENT"
          || PolicyEngine.canActOnTask(state, user, context?.task || activeTaskForRequest(state, request.requestId), action));
    }
    const managementAction = {
      ADJUST_LEAVE: "MANAGE_LEAVE",
      MANAGE_ITSM: "MANAGE_ITSM",
      MANAGE_ASSET: "MANAGE_ASSET",
      MANAGE_EXPENSE: "MANAGE_EXPENSE"
    }[action];
    if (managementAction) return grant.permittedActions.includes(managementAction) && ["M", "F"].includes(grant.scopeCode);
    return grant.permittedActions.includes(action);
  }

  const PolicyEngine = Object.freeze({
    getRouteGrants(state, user, routeName, context) {
      const policy = state?.rolePolicy?.[routeName] || ROUTE_POLICY[routeName];
      if (!policy || !user) return [];
      const moduleCode = context?.moduleCode || policy.moduleCode;
      if (moduleCode && !this.isModuleLive(state, moduleCode)) return [];
      return [...new Set(user.roleCodes || [])]
        .map((roleCode) => routeGrant(state, user, routeName, roleCode, context))
        .filter(Boolean);
    },

    canAccessRoute(state, user, routeName, context) {
      return this.getRouteGrants(state, user, routeName, context).length > 0;
    },

    getDataScope(state, user, routeName, context) {
      const grants = this.getRouteGrants(state, user, routeName, context);
      const displayGrant = grants.find((grant) => grant.sourceRoleCode === user?.primaryRoleCode) || grants[0];
      return displayGrant?.scopeCode || "N";
    },

    isReadOnly(state, user, routeName, context) {
      const grants = this.getRouteGrants(state, user, routeName, context);
      return !grants.length || grants.every((grant) => grant.mode === "READ_ONLY");
    },

    isModuleLive(state, moduleCode) {
      const module = state?.modules?.[moduleCode];
      return Boolean(module && module.installed && module.licensed && module.enabled);
    },

    moduleStatus(state, moduleCode) {
      const module = state?.modules?.[moduleCode];
      if (!module) return { live: false, reason: "NOT_INSTALLED" };
      if (!module.installed) return { live: false, reason: "NOT_INSTALLED" };
      if (!module.licensed) return { live: false, reason: "NOT_LICENSED" };
      if (!module.enabled) return { live: false, reason: "DISABLED" };
      return { live: true, reason: null };
    },

    evaluateRecordAccess(state, user, context) {
      const request = context?.request;
      const routeName = context?.routeName || "request";
      if (!state || !user || !request) {
        return { allowed: false, writable: false, grants: [], selectedGrant: null, reasonCode: "MISSING_CONTEXT" };
      }
      const grants = this.getRouteGrants(state, user, routeName, { moduleCode: request.moduleCode });
      const applicable = grants.filter((grant) => grantMatchesRecord(state, user, grant, request));
      if (!context?.action) {
        const selectedGrant = applicable[0] || null;
        return {
          allowed: Boolean(selectedGrant),
          writable: applicable.some((grant) => grant.mode === "WRITE"),
          grants,
          selectedGrant,
          reasonCode: selectedGrant ? selectedGrant.reasonCode : "NO_APPLICABLE_GRANT"
        };
      }
      const selectedGrant = applicable.find((grant) => grantAllowsRecordAction(state, user, grant, request, context.action, context)) || null;
      const readOnly = applicable.length > 0 && applicable.every((grant) => grant.mode === "READ_ONLY");
      return {
        allowed: Boolean(selectedGrant),
        writable: Boolean(selectedGrant),
        grants,
        selectedGrant,
        reasonCode: selectedGrant ? `ACTION_${context.action}_${selectedGrant.reasonCode}` : (readOnly ? "READ_ONLY_GRANT" : "NO_COHERENT_GRANT")
      };
    },

    authorizeRouteTarget(state, user, routeName, requestId) {
      if (routeName !== "request") {
        const allowed = this.canAccessRoute(state, user, routeName);
        return { allowed, reasonCode: allowed ? "ROUTE_GRANTED" : "ROUTE_DENIED" };
      }
      return this.evaluateRecordAccess(state, user, { routeName, request: requestById(state, requestId) });
    },

    authorizeMutation(state, user, action, context) {
      if (!state?.loggedIn || !user) return { allowed: false, writable: false, grants: [], selectedGrant: null, reasonCode: "NOT_AUTHENTICATED" };
      if (context?.request) return this.evaluateRecordAccess(state, user, { ...context, action });
      if (action === "CREATE_REQUEST") {
        const grants = this.getRouteGrants(state, user, "wizard", { moduleCode: context?.moduleCode });
        const selectedGrant = grants.find((grant) => grant.mode === "WRITE" && grant.permittedActions.includes("CREATE_REQUEST")) || null;
        return { allowed: Boolean(selectedGrant), writable: Boolean(selectedGrant), grants, selectedGrant, reasonCode: selectedGrant ? selectedGrant.reasonCode : "NO_COHERENT_GRANT" };
      }
      if (action === "EXPORT") {
        const grants = this.getRouteGrants(state, user, context?.routeName || "reports", { moduleCode: context?.moduleCode });
        const selectedGrant = grants.find((grant) => grant.permittedActions.includes("EXPORT")) || null;
        return { allowed: Boolean(selectedGrant), writable: false, grants, selectedGrant, reasonCode: selectedGrant ? selectedGrant.reasonCode : "NO_EXPORT_GRANT" };
      }
      if (["TOGGLE_MODULE", "CONFIGURE", "RESET_DEMO"].includes(action)) {
        const routeName = context?.routeName || (action === "TOGGLE_MODULE" ? "modules" : "config");
        const grants = this.getRouteGrants(state, user, routeName);
        const selectedGrant = grants.find((grant) => grant.sourceRoleCode === "SYS" && grant.scopeCode === "F") || null;
        return { allowed: Boolean(selectedGrant), writable: Boolean(selectedGrant), grants, selectedGrant, reasonCode: selectedGrant ? selectedGrant.reasonCode : "SYS_FULL_REQUIRED" };
      }
      if (action === "MANAGE_USER") {
        const grants = this.getRouteGrants(state, user, "users");
        const selectedGrant = grants.find((grant) => grant.mode === "WRITE" && grant.permittedActions.includes("MANAGE_USER")) || null;
        return { allowed: Boolean(selectedGrant), writable: Boolean(selectedGrant), grants, selectedGrant, reasonCode: selectedGrant ? selectedGrant.reasonCode : "NO_COHERENT_GRANT" };
      }
      const moduleAction = {
        ADJUST_LEAVE: { routeName: "leave", permittedAction: "MANAGE_LEAVE" },
        MANAGE_ITSM: { routeName: "helpdesk", permittedAction: "MANAGE_ITSM" },
        MANAGE_ASSET: { routeName: "assets", permittedAction: "MANAGE_ASSET" },
        MANAGE_EXPENSE: { routeName: "expenses", permittedAction: "MANAGE_EXPENSE" }
      }[action];
      if (moduleAction) {
        const grants = this.getRouteGrants(state, user, moduleAction.routeName);
        const selectedGrant = grants.find((grant) => ["M", "F"].includes(grant.scopeCode)
          && grant.mode === "WRITE" && grant.permittedActions.includes(moduleAction.permittedAction)) || null;
        return { allowed: Boolean(selectedGrant), writable: Boolean(selectedGrant), grants, selectedGrant, reasonCode: selectedGrant ? selectedGrant.reasonCode : "MODULE_OWNER_REQUIRED" };
      }
      if (["NOTIFICATION_READ", "NOTIFICATION_READ_ALL"].includes(action)) {
        const grants = this.getRouteGrants(state, user, "notifications");
        const owns = action === "NOTIFICATION_READ_ALL"
          || context?.notification?.recipientUserId === user.userId;
        const selectedGrant = owns ? grants.find((grant) => ["O", "F"].includes(grant.scopeCode)) || null : null;
        return { allowed: Boolean(selectedGrant), writable: Boolean(selectedGrant), grants, selectedGrant, reasonCode: selectedGrant ? selectedGrant.reasonCode : "NOT_NOTIFICATION_OWNER" };
      }
      if (action === "EDIT_TIMESHEET") {
        const grants = this.getRouteGrants(state, user, "timesheets");
        const owns = Number(context?.empId) === Number(user.empId);
        const selectedGrant = grants.find((grant) => (owns && grant.sourceRoleCode === "EMP" && grant.scopeCode === "O") || grant.scopeCode === "F") || null;
        const unlocked = context?.timesheet && !context.timesheet.locked;
        return { allowed: Boolean(selectedGrant && unlocked), writable: Boolean(selectedGrant && unlocked), grants, selectedGrant: unlocked ? selectedGrant : null, reasonCode: !unlocked ? "TIMESHEET_LOCKED" : (selectedGrant?.reasonCode || "NOT_TIMESHEET_OWNER") };
      }
      if (action === "ACK_ASSET") {
        const grants = this.getRouteGrants(state, user, "assets");
        const owns = context?.allocation?.empId === user.empId;
        const selectedGrant = owns ? grants.find((grant) => grant.sourceRoleCode === "EMP" && grant.scopeCode === "O") || null : null;
        return { allowed: Boolean(selectedGrant), writable: Boolean(selectedGrant), grants, selectedGrant, reasonCode: selectedGrant ? selectedGrant.reasonCode : "NOT_ASSET_HOLDER" };
      }
      if (["TOGGLE_OOO", "CREATE_DELEGATION"].includes(action)) {
        const grants = this.getRouteGrants(state, user, "delegation");
        const selectedGrant = grants.find((grant) => ["O", "F"].includes(grant.scopeCode) && grant.mode === "WRITE") || null;
        return { allowed: Boolean(selectedGrant), writable: Boolean(selectedGrant), grants, selectedGrant, reasonCode: selectedGrant ? selectedGrant.reasonCode : "DELEGATION_WRITE_DENIED" };
      }
      if (["UPDATE_PREFERENCE", "UPDATE_PROFILE"].includes(action)) {
        const grants = this.getRouteGrants(state, user, "profile");
        const selectedGrant = grants.find((grant) => ["O", "F"].includes(grant.scopeCode) && grant.mode === "WRITE") || null;
        return { allowed: Boolean(selectedGrant), writable: Boolean(selectedGrant), grants, selectedGrant, reasonCode: selectedGrant ? selectedGrant.reasonCode : "PROFILE_WRITE_DENIED" };
      }
      if (action === "AI_QUERY") {
        const grants = this.getRouteGrants(state, user, "ai");
        const selectedGrant = Boolean(resolveConfig(state, "AI_ASSISTANT_ENABLED", user.empId, user.departmentId)) ? grants[0] || null : null;
        return { allowed: Boolean(selectedGrant), writable: false, grants, selectedGrant, reasonCode: selectedGrant ? selectedGrant.reasonCode : "AI_UNAVAILABLE" };
      }
      if (action === "CANCEL_DELEGATION") {
        const grants = this.getRouteGrants(state, user, "delegation");
        const owns = context?.delegation?.fromEmpId === user.empId;
        const selectedGrant = grants.find((grant) => (owns && grant.scopeCode === "O") || grant.scopeCode === "F") || null;
        return { allowed: Boolean(selectedGrant), writable: Boolean(selectedGrant), grants, selectedGrant, reasonCode: selectedGrant ? selectedGrant.reasonCode : "NOT_DELEGATION_OWNER" };
      }
      return { allowed: false, writable: false, grants: [], selectedGrant: null, reasonCode: "UNKNOWN_ACTION" };
    },

    canPerformAction(state, user, action, context) {
      return this.authorizeMutation(state, user, action, context).allowed;
    },

    canViewRequest(state, user, request, routeName = "request") {
      return this.evaluateRecordAccess(state, user, { routeName, request }).allowed;
    },

    canViewInternalComment(state, user, request) {
      return this.getRouteGrants(state, user, "request", { moduleCode: request?.moduleCode })
        .some((grant) => ["M", "F"].includes(grant.scopeCode)
          && ((MODULE_OWNER_ROLES[request?.moduleCode] || []).includes(grant.sourceRoleCode) || grant.sourceRoleCode === "SYS"));
    },

    canActOnTask(state, user, taskRow, action) {
      if (!state || !user || !taskRow || taskRow.statusCode !== "ACTIVE") return false;
      const request = requestById(state, taskRow.requestId);
      if (!request) return false;
      const taskGrant = this.getRouteGrants(state, user, "approvals", { moduleCode: request.moduleCode })
        .find((grant) => ["A", "F"].includes(grant.scopeCode) && grant.mode === "WRITE");
      if (!taskGrant) return false;
      if (taskRow.actualOwnerEmpId === user.empId) return true;
      if (taskRow.businessAdminEmpIds?.includes(user.empId) && taskGrant.sourceRoleCode === "SYS") return true;
      return activeDelegation(state, taskRow.actualOwnerEmpId, user.empId, taskRow, dateOnly(state)) !== null;
    },

    canViewPerson(state, user, person) {
      if (!user || !person) return false;
      const grants = this.getRouteGrants(state, user, "directory");
      return grants.some((grant) => {
        if (["F", "G", "R", "M"].includes(grant.scopeCode)) return true;
        if (grant.scopeCode === "T") return isReportee(state, user.empId, person.empId);
        if (grant.scopeCode === "D") return person.departmentId === user.departmentId;
        return grant.scopeCode === "O" && person.empId === user.empId;
      });
    }
  });

  function isReportee(state, managerEmpId, employeeEmpId) {
    let cursor = userByEmpId(employeeEmpId);
    const seen = new Set();
    while (cursor?.managerEmpId && !seen.has(cursor.empId)) {
      if (cursor.managerEmpId === managerEmpId) return true;
      seen.add(cursor.empId);
      cursor = userByEmpId(cursor.managerEmpId);
    }
    return false;
  }

  function activeDelegation(state, fromEmpId, toEmpId, taskRow, today) {
    return (state.delegations || []).find((item) => item.statusCode === "ACTIVE"
      && item.fromEmpId === fromEmpId && item.toEmpId === toEmpId
      && item.startDate <= today && item.endDate >= today
      && (!item.moduleCode || item.moduleCode === requestById(state, taskRow.requestId)?.moduleCode)) || null;
  }

  function activeTaskForRequest(state, requestId) {
    return (state.tasks || []).find((item) => item.requestId === requestId && item.statusCode === "ACTIVE") || null;
  }

  function requestById(state, requestId) {
    return (state.requests || []).find((item) => item.requestId === requestId) || null;
  }

  function resolveConfig(state, key, empId, departmentId) {
    const candidates = Object.values(state?.config || {}).filter((item) => item.key === key);
    const employee = candidates.find((item) => item.scopeCode === "EMPLOYEE" && Number(item.scopeId) === Number(empId));
    if (employee) return employee.value;
    const department = candidates.find((item) => item.scopeCode === "DEPARTMENT" && Number(item.scopeId) === Number(departmentId));
    if (department) return department.value;
    return candidates.find((item) => item.scopeCode === "SYSTEM")?.value;
  }

  const Selectors = Object.freeze({
    requests(state, user, filters) {
      const result = (state.requests || []).filter((request) => PolicyEngine.canViewRequest(state, user, request));
      const moduleCode = filters?.moduleCode || "";
      const statusCode = filters?.statusCode || "";
      const search = String(filters?.search || "").trim().toLowerCase();
      return result.filter((request) => (!moduleCode || request.moduleCode === moduleCode)
        && (!statusCode || request.statusCode === statusCode)
        && (!search || `${request.requestNumber} ${request.title} ${request.summary}`.toLowerCase().includes(search)));
    },

    request(state, user, requestId) {
      const request = requestById(state, requestId);
      return PolicyEngine.canViewRequest(state, user, request) ? request : null;
    },

    tasks(state, user) {
      return (state.tasks || []).filter((taskRow) => {
        const request = requestById(state, taskRow.requestId);
        const readOnlyInbox = PolicyEngine.getRouteGrants(state, user, "approvals", { moduleCode: request?.moduleCode })
          .some((grant) => grant.mode === "READ_ONLY");
        return request && PolicyEngine.canViewRequest(state, user, request)
          && (PolicyEngine.canActOnTask(state, user, taskRow, "VIEW") || readOnlyInbox);
      });
    },

    actionableTasks(state, user) {
      return (state.tasks || []).filter((taskRow) => PolicyEngine.canActOnTask(state, user, taskRow, "VIEW"));
    },

    notifications(state, user) {
      return (state.notifications || []).filter((item) => {
        if (item.recipientUserId !== user.userId) return false;
        if (!item.requestId) return true;
        return PolicyEngine.canViewRequest(state, user, requestById(state, item.requestId));
      }).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    },

    audit(state, user) {
      const scope = PolicyEngine.getDataScope(state, user, "audit");
      if (scope === "N") return [];
      if (["F", "R", "G"].includes(scope)) return state.audit || [];
      const visibleIds = new Set(this.requests(state, user).map((request) => request.requestId));
      return (state.audit || []).filter((item) => item.actorUserId === user.userId || visibleIds.has(item.objectId));
    },

    people(state, user) {
      return Object.values(USERS).filter((person) => PolicyEngine.canViewPerson(state, user, person));
    },

    assets(state, user) {
      const allocations = state.assets?.allocations || [];
      const grants = PolicyEngine.getRouteGrants(state, user, "assets");
      const visible = allocations.filter((item) => grants.some((grant) => {
        if (["M", "R", "G", "F"].includes(grant.scopeCode)) return true;
        if (grant.scopeCode === "O") return item.empId === user.empId;
        if (grant.scopeCode === "T") return isReportee(state, user.empId, item.empId);
        if (grant.scopeCode === "D") return userByEmpId(item.empId)?.departmentId === user.departmentId;
        return false;
      }));
      return visible.map((allocationRow) => ({
        allocation: allocationRow,
        asset: state.assets.inventory.find((item) => item.assetId === allocationRow.assetId)
      })).filter((item) => item.asset);
    },

    leaveBalances(state, user, targetEmpId) {
      const empId = targetEmpId || user.empId;
      const grants = PolicyEngine.getRouteGrants(state, user, "leave");
      const canView = grants.some((grant) => {
        if (["M", "R", "G", "F"].includes(grant.scopeCode)) return true;
        if (grant.scopeCode === "O") return empId === user.empId;
        if (grant.scopeCode === "T") return isReportee(state, user.empId, empId);
        if (grant.scopeCode === "D") return userByEmpId(empId)?.departmentId === user.departmentId;
        return false;
      });
      if (!canView) return [];
      return Object.values(state.leave?.balances || {}).filter((item) => item.empId === empId);
    },

    timesheet(state, user, empId, periodId) {
      const target = Number(empId || user.empId);
      const grants = PolicyEngine.getRouteGrants(state, user, "timesheets");
      const canView = grants.some((grant) => {
        if (["M", "R", "G", "F"].includes(grant.scopeCode)) return true;
        if (grant.scopeCode === "O") return target === user.empId;
        if (grant.scopeCode === "T") return isReportee(state, user.empId, target);
        if (grant.scopeCode === "D") return userByEmpId(target)?.departmentId === user.departmentId;
        return false;
      });
      return canView ? state.timesheets?.[`${target}:${periodId || "2026-W31"}`] || null : null;
    },

    delegations(state, user) {
      if (user.roleCodes.includes("SYS")) return state.delegations || [];
      return (state.delegations || []).filter((item) => item.fromEmpId === user.empId || item.toEmpId === user.empId);
    },

    search(state, user, query) {
      const value = String(query || "").trim().toLowerCase();
      if (value.length < 2) return [];
      const results = [];
      this.requests(state, user, { search: value }).slice(0, 6).forEach((request) => results.push({ type: "REQUEST", id: request.requestId, title: request.title, meta: request.requestNumber, route: "request" }));
      if (PolicyEngine.canAccessRoute(state, user, "catalog")) {
        REQUEST_TYPES.filter((item) => PolicyEngine.isModuleLive(state, item.moduleCode)
          && PolicyEngine.canPerformAction(state, user, "CREATE_REQUEST", { moduleCode: item.moduleCode })
          && `${item.title} ${item.description}`.toLowerCase().includes(value))
          .slice(0, 4).forEach((item) => results.push({ type: "SERVICE", id: `${item.moduleCode}:${item.code}`, title: item.title, meta: MODULE_NAMES[item.moduleCode], route: "wizard", moduleCode: item.moduleCode, requestTypeCode: item.code }));
      }
      if (PolicyEngine.canAccessRoute(state, user, "directory")) {
        this.people(state, user).filter((person) => `${person.displayName} ${ROLE_LABELS[person.primaryRoleCode]}`.toLowerCase().includes(value))
          .slice(0, 4).forEach((person) => results.push({ type: "PERSON", id: String(person.empId), title: person.displayName, meta: ROLE_LABELS[person.primaryRoleCode], route: "directory" }));
      }
      return results;
    },

    reports(state, user, filters) {
      const rows = this.requests(state, user, filters);
      return {
        rows,
        total: rows.length,
        closed: rows.filter((request) => request.statusCode === "CLOSED").length,
        awaiting: rows.filter((request) => ["SUBMITTED", "IN_REVIEW", "FULFILLMENT"].includes(request.statusCode)).length,
        sentBack: rows.filter((request) => request.statusCode === "SENT_BACK").length,
        byModule: Object.fromEntries(MODULE_CODES.map((code) => [code, rows.filter((request) => request.moduleCode === code).length]))
      };
    },

    exportRequests(state, user, filters) {
      if (!PolicyEngine.authorizeMutation(state, user, "EXPORT", { routeName: "reports", moduleCode: filters?.moduleCode }).allowed) return [];
      return this.requests(state, user, filters);
    }
  });

  function logDenied(state, user, action, objectType, objectId, reason) {
    state.audit.unshift(auditEvent(uid("AUD"), user?.userId || null, user?.roleCodes || [], action, objectType, objectId, null, null, "DENIED", reason, null, uid("CORR"), isoNow(state)));
  }

  function appendHistory(request, actionCode, actorEmpId, note, state, onBehalfOfEmpId) {
    request.history = request.history || [];
    request.history.unshift({ historyId: uid("HIST"), actionCode, actorEmpId, onBehalfOfEmpId: onBehalfOfEmpId || null, note: note || "", createdAt: isoNow(state) });
  }

  function notify(state, recipientEmpId, request, typeCode, title, message) {
    const recipient = userByEmpId(recipientEmpId);
    if (!recipient) return;
    state.notifications.unshift(notification(uid("NOT"), recipient.userId, request.requestId, typeCode, title, message, "request"));
  }

  class MutationTransaction {
    constructor(store) {
      this.store = store;
    }

    run(options) {
      const current = this.store.getState();
      const expectedRevision = current.revision;
      const draft = deepClone(current);
      const user = options.user || currentUser(draft);
      const correlationId = options.correlationId || uid("CORR");
      if (typeof options.authorize === "function" && !options.authorize(draft, user)) {
        logDenied(draft, user, options.eventType || "DENIED_ACTION", options.objectType || "UNKNOWN", options.objectId || null, options.deniedReason || "Authorization failed");
        draft.revision = expectedRevision + 1;
        this.store.setState(draft, expectedRevision);
        throw new Error("AUTHORIZATION_DENIED");
      }
      const oldValue = options.snapshot ? deepClone(options.snapshot(draft)) : null;
      let result;
      try {
        result = options.mutate(draft, user);
        if (typeof options.validate === "function") options.validate(draft, result, user);
      } catch (error) {
        throw error;
      }
      const newValue = options.snapshot ? deepClone(options.snapshot(draft)) : null;
      draft.audit.unshift(auditEvent(uid("AUD"), user?.userId || null, user?.roleCodes || [], options.eventType || "MUTATION", options.objectType || "STATE", options.objectId || null, oldValue, newValue, "SUCCESS", options.reason || null, options.onBehalfOfEmpId || null, correlationId, isoNow(draft)));
      draft.revision = expectedRevision + 1;
      this.store.setState(draft, expectedRevision);
      return result;
    }
  }

  function createNumber(state, moduleCode) {
    const module = state.modules[moduleCode];
    if (!module) throw new Error("UNKNOWN_MODULE");
    const period = isoNow(state).slice(2, 7).replace("-", "");
    const key = `${moduleCode}:${period}`;
    state.numberSeries[key] = Number(state.numberSeries[key] || 0) + 1;
    return `FD/${module.prefix}/${period}/${String(state.numberSeries[key]).padStart(5, "0")}`;
  }

  function routeForRequest(state, request) {
    const matching = (state.workflowRules || []).filter((rule) => rule.active && rule.moduleCode === request.moduleCode).sort((a, b) => a.priority - b.priority)[0];
    if (!matching) throw new Error("NO_WORKFLOW_RULE");
    return deepClone(matching);
  }

  function resolveOwnerEmpId(state, request, step) {
    if (step.ownerType === "MANAGER") {
      let owner = userByEmpId(request.requesterEmpId)?.managerEmpId;
      if (owner === request.requesterEmpId) owner = null;
      if (!owner || !userByEmpId(owner)?.active) {
        const departmentHead = Object.values(USERS).find((item) => item.primaryRoleCode === "HOD" && item.departmentId === userByEmpId(request.requesterEmpId)?.departmentId);
        owner = departmentHead?.empId || USERS.sysadmin.empId;
      }
      return owner;
    }
    const role = MODULE_WORKFLOW_OWNER_ROLE[request.moduleCode];
    return Object.values(USERS).find((item) => item.roleCodes.includes(role))?.empId || USERS.sysadmin.empId;
  }

  function createTaskForStep(state, request, step, index) {
    const ownerEmpId = resolveOwnerEmpId(state, request, step);
    const taskId = uid("TASK");
    const dueAt = new Date(new Date(isoNow(state)).getTime() + Number(step.slaHours || 16) * 3600000).toISOString();
    const row = task(taskId, request.requestId, step.taskType, [ownerEmpId], ownerEmpId, "ACTIVE", dueAt, step.code);
    row.stepIndex = index;
    state.tasks.push(row);
    request.taskId = taskId;
    request.ownerEmpId = ownerEmpId;
    request.currentStepCode = step.code;
    request.dueAt = dueAt;
    notify(state, ownerEmpId, request, step.taskType === "ACTION" ? "ACTION_ASSIGNED" : "APPROVAL_REQUIRED", step.taskType === "ACTION" ? "Action assigned" : "Approval required", `${request.title} requires your ${step.taskType === "ACTION" ? "action" : "decision"}.`);
    return row;
  }

  const WorkflowEngine = Object.freeze({
    submit(state, request, actor, idempotencyKey) {
      if (!request || !["DRAFT", "SENT_BACK"].includes(request.statusCode)) throw new Error("INVALID_TRANSITION");
      if (request.requesterEmpId !== actor.empId) throw new Error("NOT_REQUESTER");
      ensureIdempotency(state, idempotencyKey);
      const moduleService = ModuleServices[request.moduleCode];
      moduleService.validateForSubmit(state, request, actor);
      if (!request.requestNumber) request.requestNumber = createNumber(state, request.moduleCode);
      request.statusCode = "SUBMITTED";
      request.submittedAt = isoNow(state);
      request.ownerEmpId = null;
      request.taskId = null;
      request.currentStepCode = "SUBMITTED";
      request.revision += 1;
      appendHistory(request, "SUBMIT", actor.empId, "Request submitted", state);
      moduleService.onSubmit(state, request, actor);
      notify(state, request.requesterEmpId, request, "SUBMITTED", "Request submitted", `${request.requestNumber} was submitted successfully.`);
      this.start(state, request, actor, `${idempotencyKey}:START`);
      return request;
    },

    start(state, request, actor, idempotencyKey) {
      if (!request || request.statusCode !== "SUBMITTED" || request.taskId) throw new Error("INVALID_TRANSITION");
      ensureIdempotency(state, idempotencyKey);
      const workflowRule = routeForRequest(state, request);
      request.workflowRuleId = workflowRule.ruleId;
      request.workflowRuleVersion = workflowRule.version;
      request.workflowSteps = workflowRule.steps;
      request.currentStepIndex = 0;
      const step = workflowRule.steps[0];
      request.statusCode = step.taskType === "ACTION" ? "FULFILLMENT" : "IN_REVIEW";
      createTaskForStep(state, request, step, 0);
      appendHistory(request, "START_WORKFLOW", actor.empId, `${step.taskType} task created`, state);
      return request;
    },

    decision(state, request, taskRow, actor, action, reason, idempotencyKey) {
      if (!request || request.statusCode !== "IN_REVIEW" || !taskRow || taskRow.taskType !== "APPROVAL") throw new Error("INVALID_TRANSITION");
      if (!PolicyEngine.canActOnTask(state, actor, taskRow, action)) throw new Error("NOT_TASK_OWNER");
      if (["REJECT", "SEND_BACK"].includes(action) && !String(reason || "").trim()) throw new Error("REASON_REQUIRED");
      ensureIdempotency(state, idempotencyKey);
      const delegate = taskRow.actualOwnerEmpId === actor.empId ? null : activeDelegation(state, taskRow.actualOwnerEmpId, actor.empId, taskRow, dateOnly(state));
      taskRow.statusCode = "COMPLETED";
      taskRow.completedAt = isoNow(state);
      taskRow.outcomeCode = action;
      taskRow.revision += 1;
      request.taskId = null;
      if (action === "REJECT") {
        request.statusCode = "REJECTED";
        request.ownerEmpId = null;
        request.currentStepCode = "COMPLETE";
        ModuleServices[request.moduleCode].onReject(state, request, actor);
      } else if (action === "SEND_BACK") {
        request.statusCode = "SENT_BACK";
        request.ownerEmpId = request.requesterEmpId;
        request.currentStepCode = "REQUESTER_CORRECTION";
        ModuleServices[request.moduleCode].onSendBack(state, request, actor);
      } else if (action === "APPROVE") {
        const nextIndex = Number(request.currentStepIndex || 0) + 1;
        const nextStep = request.workflowSteps?.[nextIndex];
        if (nextStep) {
          request.currentStepIndex = nextIndex;
          request.statusCode = "IN_REVIEW";
          createTaskForStep(state, request, nextStep, nextIndex);
        } else {
          request.statusCode = "APPROVED";
          request.ownerEmpId = null;
          request.currentStepCode = "APPROVED";
          ModuleServices[request.moduleCode].onFinalApproval(state, request, actor);
        }
      } else {
        throw new Error("UNKNOWN_DECISION");
      }
      request.revision += 1;
      appendHistory(request, action, actor.empId, reason || "", state, delegate ? taskRow.actualOwnerEmpId : null);
      notify(state, request.requesterEmpId, request, action, `Request ${action.toLowerCase().replace("_", " ")}`, reason || `${request.requestNumber} was updated.`);
      return request;
    },

    cancel(state, request, actor, reason, idempotencyKey) {
      if (!request || !["DRAFT", "SUBMITTED", "IN_REVIEW", "SENT_BACK"].includes(request.statusCode)) throw new Error("INVALID_TRANSITION");
      if (request.requesterEmpId !== actor.empId && !actor.roleCodes.includes("SYS")) throw new Error("NOT_REQUESTER");
      ensureIdempotency(state, idempotencyKey);
      const taskRow = activeTaskForRequest(state, request.requestId);
      if (taskRow) {
        taskRow.statusCode = "CANCELLED";
        taskRow.completedAt = isoNow(state);
        taskRow.outcomeCode = "CANCEL";
      }
      request.statusCode = "CANCELLED";
      request.ownerEmpId = null;
      request.taskId = null;
      request.currentStepCode = "COMPLETE";
      request.closedAt = isoNow(state);
      ModuleServices[request.moduleCode].onCancel(state, request, actor);
      appendHistory(request, "CANCEL", actor.empId, reason || "Cancelled by requester", state);
      return request;
    },

    startFulfillment(state, request, actor, idempotencyKey) {
      if (!request || request.statusCode !== "APPROVED") throw new Error("INVALID_TRANSITION");
      ensureIdempotency(state, idempotencyKey);
      const ownerRoles = MODULE_OWNER_ROLES[request.moduleCode] || [];
      if (!actor.roleCodes.some((role) => ownerRoles.includes(role)) && !actor.roleCodes.includes("SYS")) throw new Error("NOT_MODULE_OWNER");
      request.statusCode = "FULFILLMENT";
      const step = { code: `${request.moduleCode}_FULFILLMENT`, ownerType: "MODULE_OWNER", taskType: "ACTION", slaHours: 24 };
      createTaskForStep(state, request, step, 0);
      appendHistory(request, "START_FULFILLMENT", actor.empId, "Fulfillment started", state);
      return request;
    },

    closeFulfillment(state, request, taskRow, actor, outcome, idempotencyKey) {
      if (!request || request.statusCode !== "FULFILLMENT" || !taskRow || taskRow.taskType !== "ACTION") throw new Error("INVALID_TRANSITION");
      if (!PolicyEngine.canActOnTask(state, actor, taskRow, "CLOSE_FULFILLMENT")) throw new Error("NOT_TASK_OWNER");
      ensureIdempotency(state, idempotencyKey);
      taskRow.statusCode = "COMPLETED";
      taskRow.completedAt = isoNow(state);
      taskRow.outcomeCode = "CLOSE";
      request.statusCode = "CLOSED";
      request.ownerEmpId = null;
      request.taskId = null;
      request.currentStepCode = "COMPLETE";
      request.closedAt = isoNow(state);
      ModuleServices[request.moduleCode].onFulfillmentClose(state, request, actor, outcome || {});
      appendHistory(request, "CLOSE", actor.empId, outcome?.note || "Fulfillment completed", state);
      notify(state, request.requesterEmpId, request, "CLOSED", "Request closed", `${request.requestNumber} was completed.`);
      return request;
    }
  });

  function ensureIdempotency(state, key) {
    if (!key) throw new Error("IDEMPOTENCY_KEY_REQUIRED");
    if (state.idempotencyKeys.includes(key)) throw new Error("DUPLICATE_OPERATION");
    state.idempotencyKeys.push(key);
  }

  function workingDays(state, startDate, endDate, calendarId) {
    const start = new Date(`${startDate}T12:00:00Z`);
    const end = new Date(`${endDate}T12:00:00Z`);
    if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || end < start) return 0;
    const holidays = new Set((state.holidays || []).filter((item) => item.calendarId === (calendarId || 1)).map((item) => item.date));
    let count = 0;
    for (let cursor = new Date(start); cursor <= end; cursor.setUTCDate(cursor.getUTCDate() + 1)) {
      const date = cursor.toISOString().slice(0, 10);
      if ((state.workweek || [1, 2, 3, 4, 5]).includes(cursor.getUTCDay()) && !holidays.has(date)) count += 1;
    }
    return count;
  }

  function recomputeBalance(balanceRow) {
    balanceRow.available = Number(balanceRow.entitlement) - Number(balanceRow.used) - Number(balanceRow.pending);
    if (balanceRow.available < 0) throw new Error("INSUFFICIENT_LEAVE_BALANCE");
  }

  const LeaveService = Object.freeze({
    validateForSubmit(state, request, actor) {
      const details = request.details || {};
      if (!details.leaveTypeCode || !details.startDate || !details.endDate || !String(details.reason || "").trim()) throw new Error("LEAVE_REQUIRED_FIELDS");
      if (details.endDate < details.startDate) throw new Error("LEAVE_DATE_ORDER");
      if (details.dayOption !== "FULL" && details.startDate !== details.endDate) throw new Error("HALF_DAY_SINGLE_DATE");
      if (details.dayOption !== "FULL" && !["AM", "PM"].includes(details.session)) throw new Error("HALF_DAY_SESSION_REQUIRED");
      const calculated = details.dayOption === "FULL" ? workingDays(state, details.startDate, details.endDate, actor.calendarId) : 0.5;
      if (calculated <= 0) throw new Error("NO_WORKING_DAYS");
      details.workingDays = calculated;
      const overlapping = state.requests.some((other) => other.requestId !== request.requestId && other.moduleCode === "LEAVE" && other.requesterEmpId === actor.empId
        && !["REJECTED", "CANCELLED", "CLOSED"].includes(other.statusCode)
        && other.details?.startDate <= details.endDate && other.details?.endDate >= details.startDate);
      if (overlapping) throw new Error("LEAVE_OVERLAP");
      const threshold = Number(resolveConfig(state, "LEAVE_SICK_ATTACHMENT_DAYS", actor.empId, actor.departmentId));
      if (details.leaveTypeCode === "SICK" && calculated > threshold && !(details.attachmentIds || []).length) throw new Error("LEAVE_ATTACHMENT_REQUIRED");
      const key = `${actor.empId}:2026:${details.leaveTypeCode}`;
      const balanceRow = state.leave.balances[key];
      if (!balanceRow || balanceRow.available < calculated) throw new Error("INSUFFICIENT_LEAVE_BALANCE");
    },
    onSubmit(state, request) {
      const key = `${request.requesterEmpId}:2026:${request.details.leaveTypeCode}`;
      const row = state.leave.balances[key];
      row.pending += request.details.workingDays;
      recomputeBalance(row);
      state.leave.ledger.unshift({ ledgerId: uid("LED"), empId: request.requesterEmpId, year: 2026, leaveTypeCode: request.details.leaveTypeCode, delta: -request.details.workingDays, kind: "PENDING_RESERVATION", effectiveDate: dateOnly(state), reason: "Pending leave request", requestId: request.requestId });
    },
    onFinalApproval(state, request) {
      const key = `${request.requesterEmpId}:2026:${request.details.leaveTypeCode}`;
      const row = state.leave.balances[key];
      row.pending -= request.details.workingDays;
      row.used += request.details.workingDays;
      recomputeBalance(row);
      state.leave.ledger = state.leave.ledger.filter((item) => !(item.requestId === request.requestId && item.kind === "PENDING_RESERVATION"));
      state.leave.ledger.unshift({ ledgerId: uid("LED"), empId: request.requesterEmpId, year: 2026, leaveTypeCode: request.details.leaveTypeCode, delta: -request.details.workingDays, kind: "APPROVED_LEAVE", effectiveDate: dateOnly(state), reason: "Approved leave", requestId: request.requestId });
      request.statusCode = "CLOSED";
      request.currentStepCode = "COMPLETE";
      request.closedAt = isoNow(state);
    },
    onReject(state, request) { this.releasePending(state, request); },
    onCancel(state, request) { this.releasePending(state, request); },
    onSendBack() {},
    onFulfillmentClose() {},
    releasePending(state, request) {
      const key = `${request.requesterEmpId}:2026:${request.details.leaveTypeCode}`;
      const row = state.leave.balances[key];
      if (row) {
        row.pending = Math.max(0, row.pending - Number(request.details.workingDays || 0));
        recomputeBalance(row);
      }
      state.leave.ledger = state.leave.ledger.filter((item) => !(item.requestId === request.requestId && item.kind === "PENDING_RESERVATION"));
    },
    adjustBalance(state, empId, leaveTypeCode, delta, reason, actor) {
      if (!actor.roleCodes.some((role) => ["HR", "SYS"].includes(role))) throw new Error("AUTHORIZATION_DENIED");
      if (!String(reason || "").trim() || !Number.isFinite(Number(delta)) || Number(delta) === 0) throw new Error("ADJUSTMENT_FIELDS_REQUIRED");
      const key = `${empId}:2026:${leaveTypeCode}`;
      const row = state.leave.balances[key] || balance(empId, 2026, leaveTypeCode, 0, 0, 0);
      row.entitlement += Number(delta);
      recomputeBalance(row);
      state.leave.balances[key] = row;
      state.leave.ledger.unshift({ ledgerId: uid("LED"), empId, year: 2026, leaveTypeCode, delta: Number(delta), kind: "HR_ADJUSTMENT", effectiveDate: dateOnly(state), reason, requestId: null });
      return row;
    }
  });

  const ITSMService = Object.freeze({
    validateForSubmit(state, request) {
      const details = request.details || {};
      if (!details.categoryCode || !details.subcategoryCode || !details.impactCode || !details.urgencyCode || !details.summary || !details.description) throw new Error("ITSM_REQUIRED_FIELDS");
      details.priorityCode = priorityFromMatrix(details.impactCode, details.urgencyCode);
      request.priorityCode = details.priorityCode;
    },
    onSubmit() {},
    onFinalApproval() { throw new Error("ITSM_HAS_NO_APPROVAL"); },
    onReject() {},
    onCancel() {},
    onSendBack() {},
    onFulfillmentClose(state, request, actor, outcome) {
      request.details.resolutionCode = outcome.resolutionCode || "RESOLVED";
      request.details.resolutionText = outcome.resolutionText || outcome.note || "Issue resolved";
      request.details.resolvedAt = isoNow(state);
    },
    addWorklog(state, request, actor, note, visibility, minutes) {
      if (!actor.roleCodes.some((role) => ["IT", "SYS"].includes(role))) throw new Error("AUTHORIZATION_DENIED");
      if (!String(note || "").trim() || Number(minutes) <= 0) throw new Error("WORKLOG_FIELDS_REQUIRED");
      request.details.worklogs = request.details.worklogs || [];
      request.details.worklogs.unshift({ worklogId: uid("WL"), actorEmpId: actor.empId, note, visibility: visibility === "INTERNAL" ? "INTERNAL" : "PUBLIC", minutes: Number(minutes), createdAt: isoNow(state) });
    },
    reopen(state, request, actor, reason) {
      if (request.requesterEmpId !== actor.empId || request.statusCode !== "CLOSED") throw new Error("REOPEN_DENIED");
      if (!String(reason || "").trim()) throw new Error("REASON_REQUIRED");
      request.statusCode = "FULFILLMENT";
      request.closedAt = null;
      request.details.reopenCount = Number(request.details.reopenCount || 0) + 1;
      createTaskForStep(state, request, { code: "IT_ACTION", ownerType: "MODULE_OWNER", taskType: "ACTION", slaHours: 16 }, 0);
    },
    rate(state, request, actor, rating) {
      if (request.requesterEmpId !== actor.empId || request.statusCode !== "CLOSED") throw new Error("RATING_DENIED");
      if (request.details.rating) throw new Error("ALREADY_RATED");
      if (![1, 2, 3, 4, 5].includes(Number(rating))) throw new Error("INVALID_RATING");
      request.details.rating = Number(rating);
    }
  });

  function priorityFromMatrix(impact, urgency) {
    const score = { INDIVIDUAL: 1, TEAM: 2, DEPARTMENT: 3, ORGANIZATION: 4 }[impact] || 1;
    const urgencyScore = { LOW: 1, NORMAL: 2, HIGH: 3, CRITICAL: 4 }[urgency] || 2;
    const total = score + urgencyScore;
    return total >= 7 ? "CRITICAL" : total >= 5 ? "HIGH" : total >= 3 ? "MEDIUM" : "LOW";
  }

  const TimesheetService = Object.freeze({
    validateForSubmit(state, request, actor) {
      const sheet = state.timesheets[`${actor.empId}:${request.details.periodId || "2026-W31"}`];
      if (!sheet || sheet.locked) throw new Error("TIMESHEET_LOCKED_OR_MISSING");
      validateTimesheetLines(sheet);
      const total = sheet.lines.reduce((sum, line) => sum + Number(line.hours), 0);
      if (total <= 0 || total > 80) throw new Error("TIMESHEET_TOTAL_INVALID");
      request.details.timesheetId = sheet.timesheetId;
      request.details.totalHours = total;
    },
    onSubmit(state, request) {
      const sheet = state.timesheets[`${request.requesterEmpId}:${request.details.periodId || "2026-W31"}`];
      sheet.statusCode = "SUBMITTED";
      sheet.requestId = request.requestId;
      sheet.submittedAt = isoNow(state);
      sheet.locked = true;
    },
    onFinalApproval(state, request) {
      const sheet = Object.values(state.timesheets).find((item) => item.timesheetId === request.details.timesheetId);
      if (sheet) {
        sheet.statusCode = "APPROVED";
        sheet.locked = true;
      }
      request.statusCode = "CLOSED";
      request.currentStepCode = "COMPLETE";
      request.closedAt = isoNow(state);
    },
    onReject() {},
    onCancel(state, request) {
      const sheet = Object.values(state.timesheets).find((item) => item.timesheetId === request.details.timesheetId);
      if (sheet) { sheet.statusCode = "DRAFT"; sheet.locked = false; sheet.requestId = null; }
    },
    onSendBack(state, request) {
      const sheet = Object.values(state.timesheets).find((item) => item.timesheetId === request.details.timesheetId);
      if (sheet) { sheet.statusCode = "SENT_BACK"; sheet.locked = false; }
    },
    onFulfillmentClose() {},
    expectedHours(state, sheet, empId) {
      const user = userByEmpId(empId);
      let expected = workingDays(state, sheet.weekStart, sheet.weekEnd, user?.calendarId || 1) * 8;
      const approvedLeave = state.requests.filter((request) => request.moduleCode === "LEAVE" && request.requesterEmpId === empId && request.statusCode === "CLOSED"
        && request.details?.startDate <= sheet.weekEnd && request.details?.endDate >= sheet.weekStart)
        .reduce((sum, request) => sum + Number(request.details.workingDays || 0) * 8, 0);
      expected = Math.max(0, expected - approvedLeave);
      return expected;
    }
  });

  function validateTimesheetLines(sheet) {
    const seen = new Set();
    const daily = {};
    for (const line of sheet.lines || []) {
      if (!line.projectCode || !line.taskTypeCode || !line.date || !Number.isFinite(Number(line.hours)) || Number(line.hours) <= 0) throw new Error("TIMESHEET_LINE_INVALID");
      const key = `${line.projectCode}:${line.taskTypeCode}:${line.date}`;
      if (seen.has(key)) throw new Error("TIMESHEET_DUPLICATE_LINE");
      seen.add(key);
      daily[line.date] = Number(daily[line.date] || 0) + Number(line.hours);
      if (daily[line.date] > 24) throw new Error("TIMESHEET_DAY_LIMIT");
    }
  }

  const AssetService = Object.freeze({
    validateForSubmit(state, request, actor) {
      const details = request.details || {};
      if (!["NEW", "REPLACE", "REPAIR", "RETURN"].includes(details.requestKind)) throw new Error("ASSET_KIND_REQUIRED");
      if (!details.assetTypeCode || !details.purpose) throw new Error("ASSET_REQUIRED_FIELDS");
      if (["REPLACE", "REPAIR", "RETURN"].includes(details.requestKind)) {
        const owned = Selectors.assets(state, actor).some((item) => item.asset.assetId === details.existingAssetId && item.allocation.statusCode === "ACTIVE");
        if (!owned) throw new Error("ASSET_NOT_OWNED");
      }
    },
    onSubmit() {},
    onFinalApproval() {},
    onReject() {},
    onCancel() {},
    onSendBack() {},
    onFulfillmentClose() {},
    issue(state, request, actor, assetId, conditionCode, proofAttachmentId) {
      if (!actor.roleCodes.some((role) => ["AST", "SYS"].includes(role))) throw new Error("AUTHORIZATION_DENIED");
      const asset = state.assets.inventory.find((item) => item.assetId === assetId);
      if (!asset || asset.statusCode !== "AVAILABLE") throw new Error("ASSET_UNAVAILABLE");
      asset.statusCode = "ASSIGNED";
      asset.conditionCode = conditionCode || "GOOD";
      state.assets.allocations.push({ allocationId: uid("ALLOC"), assetId, empId: request.requesterEmpId, issuedDate: dateOnly(state), statusCode: "ACTIVE", acknowledgedAt: null, returnedDate: null, issueCondition: conditionCode || "GOOD", returnCondition: null, proofAttachmentId: proofAttachmentId || null });
      request.details.issuedAssetId = assetId;
    },
    acknowledge(state, assetId, actor) {
      const allocationRow = state.assets.allocations.find((item) => item.assetId === assetId && item.empId === actor.empId && item.statusCode === "ACTIVE");
      if (!allocationRow || allocationRow.acknowledgedAt) throw new Error("ACKNOWLEDGMENT_DENIED");
      allocationRow.acknowledgedAt = isoNow(state);
      allocationRow.acknowledgedByEmpId = actor.empId;
    },
    completeReturn(state, request, actor, conditionCode) {
      if (!actor.roleCodes.some((role) => ["AST", "SYS"].includes(role))) throw new Error("AUTHORIZATION_DENIED");
      const assetId = request.details.existingAssetId;
      const allocationRow = state.assets.allocations.find((item) => item.assetId === assetId && item.empId === request.requesterEmpId && item.statusCode === "ACTIVE");
      const asset = state.assets.inventory.find((item) => item.assetId === assetId);
      if (!allocationRow || !asset) throw new Error("RETURN_ALLOCATION_MISSING");
      allocationRow.statusCode = "RETURNED";
      allocationRow.returnedDate = dateOnly(state);
      allocationRow.returnCondition = conditionCode;
      asset.statusCode = conditionCode === "DAMAGED" ? "REPAIR" : "AVAILABLE";
      asset.conditionCode = conditionCode;
    }
  });

  const ExpenseService = Object.freeze({
    validateForSubmit(state, request, actor) {
      const details = request.details || {};
      if (!Array.isArray(details.lines) || !details.lines.length || !details.costCenterCode) throw new Error("EXPENSE_REQUIRED_FIELDS");
      const currency = resolveConfig(state, "DEFAULT_CURRENCY", actor.empId, actor.departmentId);
      request.currencyCode = currency;
      const threshold = Number(resolveConfig(state, "EXPENSE_RECEIPT_THRESHOLD", actor.empId, actor.departmentId));
      let total = 0;
      for (const line of details.lines) {
        if (!line.categoryCode || !line.billDate || !line.merchant || Number(line.amount) <= 0 || Number(line.tax || 0) < 0) throw new Error("EXPENSE_LINE_INVALID");
        if (Number(line.amount) + Number(line.tax || 0) > threshold && !line.receiptId) throw new Error(`RECEIPT_REQUIRED:${line.lineId}`);
        const duplicate = state.requests.some((other) => other.requestId !== request.requestId && other.moduleCode === "EXPENSE"
          && (other.details?.lines || []).some((existing) => existing.merchant === line.merchant && existing.billNumber && line.billNumber
            && existing.billNumber === line.billNumber && existing.billDate === line.billDate));
        if (duplicate) throw new Error("DUPLICATE_EXPENSE_BILL");
        total += Number(line.amount) + Number(line.tax || 0);
      }
      request.amount = Number(total.toFixed(2));
    },
    onSubmit() {},
    onFinalApproval() {},
    onReject() {},
    onCancel() {},
    onSendBack() {},
    onFulfillmentClose(state, request, actor, outcome) {
      const paidAmount = Number(outcome.paidAmount);
      if (!outcome.paymentReference || !Number.isFinite(paidAmount) || paidAmount <= 0 || paidAmount > Number(request.amount)) throw new Error("SETTLEMENT_INVALID");
      if (request.details.settlement) throw new Error("DUPLICATE_SETTLEMENT");
      request.details.settlement = { statusCode: "PAID", paidAmount, paidDate: outcome.paidDate || dateOnly(state), paymentReference: outcome.paymentReference, settledByEmpId: actor.empId };
    },
    recalculate(lines) {
      return Number((lines || []).reduce((sum, line) => sum + Number(line.amount || 0) + Number(line.tax || 0), 0).toFixed(2));
    },
    financeReview(request, actor, approvedAmount, reason) {
      if (!actor.roleCodes.some((role) => ["FIN", "SYS"].includes(role))) throw new Error("AUTHORIZATION_DENIED");
      const value = Number(approvedAmount);
      if (!Number.isFinite(value) || value < 0 || value > Number(request.amount)) throw new Error("APPROVED_AMOUNT_INVALID");
      if (value < Number(request.amount) && !String(reason || "").trim()) throw new Error("REDUCTION_REASON_REQUIRED");
      request.details.approvedAmount = value;
      request.details.financeReason = reason || "";
    }
  });

  const ModuleServices = Object.freeze({
    LEAVE: LeaveService,
    ITSM: ITSMService,
    TIMESHEET: TimesheetService,
    ASSET: AssetService,
    EXPENSE: ExpenseService
  });

  function createDraft(state, actor, input) {
    if (!PolicyEngine.canPerformAction(state, actor, "CREATE_REQUEST", { moduleCode: input.moduleCode })) throw new Error("AUTHORIZATION_DENIED");
    const request = seedRequest({
      requestId: uid("REQ"),
      moduleCode: input.moduleCode,
      requestTypeCode: input.requestTypeCode,
      requesterEmpId: input.requesterEmpId || actor.empId,
      raisedByEmpId: actor.empId,
      title: input.title || REQUEST_TYPES.find((item) => item.moduleCode === input.moduleCode && item.code === input.requestTypeCode)?.title || "New request",
      summary: input.summary || "",
      statusCode: "DRAFT",
      ownerEmpId: actor.empId,
      details: deepClone(input.details || {}),
      amount: input.amount ?? null,
      currencyCode: input.moduleCode === "EXPENSE" ? resolveConfig(state, "DEFAULT_CURRENCY", actor.empId, actor.departmentId) : null,
      fromDate: input.fromDate || null,
      toDate: input.toDate || null,
      createdAt: isoNow(state),
      history: []
    });
    appendHistory(request, "SAVE_DRAFT", actor.empId, "Draft created", state);
    state.requests.unshift(request);
    return request;
  }

  function validateAttachment(input) {
    const fileName = String(input?.fileName || "").trim();
    const mimeType = String(input?.mimeType || "").toLowerCase();
    const sizeBytes = Number(input?.sizeBytes);
    if (!fileName || fileName.length > 120 || !/^[a-zA-Z0-9][a-zA-Z0-9._ -]*$/.test(fileName)) return { valid: false, reason: "INVALID_FILENAME" };
    if (/\.(exe|js|html?|svg|bat|cmd|ps1|msi|scr)(\.|$)/i.test(fileName) || /\.[^.]+\.[^.]+$/.test(fileName) && /\.(exe|js|html?|bat|cmd|ps1)$/i.test(fileName)) return { valid: false, reason: "PROHIBITED_EXTENSION" };
    const extension = fileName.includes(".") ? fileName.split(".").pop().toLowerCase() : "";
    const allowed = { pdf: "application/pdf", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", txt: "text/plain", csv: "text/csv" };
    if (!allowed[extension] || allowed[extension] !== mimeType) return { valid: false, reason: "MIME_EXTENSION_MISMATCH" };
    if (!Number.isFinite(sizeBytes) || sizeBytes <= 0 || sizeBytes > 10 * 1024 * 1024) return { valid: false, reason: "INVALID_SIZE" };
    return { valid: true, extension };
  }

  function csvSafe(value) {
    let text = String(value ?? "");
    if (/^[=+\-@]/.test(text)) text = `'${text}`;
    return `"${text.replace(/"/g, '""')}"`;
  }

  function authenticate(state, username, password) {
    const account = USERS[username];
    if (!account) return { ok: false, reason: "UNKNOWN_USER" };
    if (state.auth.locked[username]) return { ok: false, reason: "ACCOUNT_LOCKED" };
    if (password !== DEMO_PASSWORD) {
      state.auth.attempts[username] = Number(state.auth.attempts[username] || 0) + 1;
      if (state.auth.attempts[username] >= Number(state.auth.maxAttempts || 3)) state.auth.locked[username] = true;
      state.audit.unshift(auditEvent(uid("AUD"), account.userId, account.roleCodes, "LOGIN_FAILURE", "SESSION", username, null, null, "DENIED", "Invalid prototype credential", null, uid("CORR"), isoNow(state)));
      return { ok: false, reason: state.auth.locked[username] ? "ACCOUNT_LOCKED" : "INVALID_CREDENTIAL" };
    }
    state.auth.attempts[username] = 0;
    state.auth.lastLoginAt[username] = isoNow(state);
    state.currentUsername = username;
    state.loggedIn = true;
    state.audit.unshift(auditEvent(uid("AUD"), account.userId, account.roleCodes, "LOGIN_SUCCESS", "SESSION", username, null, { loggedIn: true }, "SUCCESS", "Prototype login", null, uid("CORR"), isoNow(state)));
    return { ok: true, user: account };
  }

  function switchUser(state, username, actor) {
    const next = USERS[username];
    if (!next) throw new Error("UNKNOWN_USER");
    state.currentUsername = username;
    state.loggedIn = true;
    state.audit.unshift(auditEvent(uid("AUD"), actor?.userId || null, actor?.roleCodes || [], "DEMO_USER_SWITCH", "SESSION", username, { fromUserId: actor?.userId || null }, { toUserId: next.userId }, "SUCCESS", "Prototype-only user switch", null, uid("CORR"), isoNow(state)));
    return next;
  }

  function createDelegation(state, actor, input) {
    const toUser = userByEmpId(input.toEmpId);
    if (!toUser?.active || input.toEmpId === actor.empId) throw new Error("DELEGATE_INELIGIBLE");
    if (!input.startDate || !input.endDate || input.endDate < input.startDate) throw new Error("DELEGATION_DATE_INVALID");
    const overlapping = state.delegations.some((item) => item.fromEmpId === actor.empId && item.statusCode === "ACTIVE"
      && item.startDate <= input.endDate && item.endDate >= input.startDate && (!item.moduleCode || !input.moduleCode || item.moduleCode === input.moduleCode));
    if (overlapping) throw new Error("DELEGATION_OVERLAP");
    const circular = state.delegations.some((item) => item.fromEmpId === input.toEmpId && item.toEmpId === actor.empId && item.statusCode === "ACTIVE"
      && item.startDate <= input.endDate && item.endDate >= input.startDate);
    if (circular) throw new Error("DELEGATION_CYCLE");
    const row = { delegationId: uid("DEL"), fromEmpId: actor.empId, toEmpId: Number(input.toEmpId), moduleCode: input.moduleCode || null, scopeCode: input.scopeCode || "ALL_TASKS", startDate: input.startDate, endDate: input.endDate, reason: input.reason, statusCode: "ACTIVE", createdAt: isoNow(state) };
    state.delegations.unshift(row);
    return row;
  }

  function moduleImpact(state, moduleCode) {
    const module = state.modules[moduleCode];
    const inFlight = state.requests.filter((request) => request.moduleCode === moduleCode && !TERMINAL.has(request.statusCode)).length;
    const historical = state.requests.filter((request) => request.moduleCode === moduleCode).length;
    const dependent = Object.values(state.modules).filter((item) => item.dependencies?.includes(moduleCode) && item.enabled).map((item) => item.code);
    return { moduleCode, live: PolicyEngine.isModuleLive(state, moduleCode), inFlight, historical, dependent, fallback: moduleCode === "ASSET" && state.modules.ITSM.enabled ? "ITSM keeps a free-text asset reference." : "History remains available; new entry points close." };
  }

  function aiReply(state, user, prompt) {
    const text = String(prompt || "").trim();
    const lower = text.toLowerCase();
    const forbidden = /\b(approve|reject|pay|payment|settle|settlement|issue asset)\b/i.test(lower);
    let response;
    let tools = [];
    if (forbidden) {
      response = "I cannot approve, reject, pay, settle, or issue assets. Those actions require the authorized human task owner.";
    } else if (/\bleave\b/.test(lower) && !PolicyEngine.isModuleLive(state, "LEAVE")) {
      response = "Leave Management is currently unavailable. Its data tool is detached while the module is disabled.";
    } else if (/\b(pending|approval|task)\b/.test(lower)) {
      const tasks = Selectors.actionableTasks(state, user);
      tools = ["read_actionable_tasks"];
      response = `You have ${tasks.length} actionable task${tasks.length === 1 ? "" : "s"} in your authorized scope.`;
    } else if (/\b(request|status|open)\b/.test(lower)) {
      const requests = Selectors.requests(state, user);
      tools = ["read_scoped_requests"];
      response = `I found ${requests.length} request${requests.length === 1 ? "" : "s"} in your permitted scope.`;
    } else if (/\bdraft\b/.test(lower)) {
      response = "I can prepare a draft only after you confirm the module and request type. Draft creation never submits or approves it.";
      tools = ["offer_create_draft"];
    } else {
      response = "I can explain policies, summarize your authorized requests, find services, or prepare a confirmed draft. I cannot make approval or financial decisions.";
    }
    state.aiChats.push({ chatId: uid("AI"), userId: user.userId, prompt: text, response, tools, scope: PolicyEngine.getDataScope(state, user, "ai"), createdAt: isoNow(state) });
    return { response, tools };
  }

  return Object.freeze({
    SCHEMA_VERSION,
    STORAGE_KEY,
    LEGACY_STORAGE_KEYS,
    DEMO_PASSWORD,
    DEMO_NOW,
    TERMINAL,
    MODULE_CODES,
    MODULE_NAMES,
    MODULE_ROUTES,
    MODULE_OWNER_ROLES,
    ROLE_CODES,
    ROLE_LABELS,
    USERS,
    ROUTE_POLICY,
    ACTION_POLICY,
    REQUEST_TYPES,
    StateStore,
    PolicyEngine,
    WorkflowEngine,
    MutationTransaction,
    Selectors,
    ModuleServices,
    seedState,
    resetDemoState,
    seedRequest,
    validateState,
    migrateState,
    deepMerge,
    deepClone,
    currentUser,
    userByUsername,
    userByEmpId,
    userByUserId,
    displayName,
    requestById,
    activeTaskForRequest,
    resolveConfig,
    workingDays,
    validateTimesheetLines,
    priorityFromMatrix,
    createNumber,
    createDraft,
    createDelegation,
    validateAttachment,
    csvSafe,
    authenticate,
    switchUser,
    moduleImpact,
    aiReply,
    uid,
    isoNow,
    dateOnly,
    auditEvent,
    logDenied
  });
});
