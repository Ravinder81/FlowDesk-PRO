  function icon(name, size) {
    return `<svg width="${Number(size || 18)}" height="${Number(size || 18)}" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.modules}</svg>`;
  }

  function state() { return store.getState(); }
  function user() { return C.currentUser(state()); }
  function esc(value) { return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[char])); }
  function attr(value) { return esc(value); }
  function initials(value) { return String(value || "?").split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase(); }
  function labelStatus(value) { return String(value || "").replaceAll("_", " "); }
  function moduleName(code) { return C.MODULE_NAMES[code] || code; }
  function ownerName(empId) { return empId ? C.displayName(empId) : "Unassigned"; }
  function formatDate(value) {
    if (!value) return "Not provided";
    const date = new Date(value.length === 10 ? `${value}T12:00:00Z` : value);
    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  }
  function money(value, currency) {
    if (value === null || value === undefined || value === "") return "—";
    try { return new Intl.NumberFormat("en-US", { style: "currency", currency: currency || "USD" }).format(Number(value)); }
    catch (_) { return `${currency || "USD"} ${Number(value).toFixed(2)}`; }
  }
  function pill(status) { return `<span class="pill ${String(status).toLowerCase()}">${esc(labelStatus(status))}</span>`; }
  function modulePill(code) { return `<span class="module-pill">${esc(moduleName(code).replace(" Management", ""))}</span>`; }

  function freshWizard() {
    return { step: 1, moduleCode: "LEAVE", requestTypeCode: "ANNUAL", details: {}, attachments: [], expenseLines: [], editRequestId: null, error: "" };
  }

  function routeInfo() {
    const hash = location.hash.replace(/^#\/?/, "") || "dashboard";
    const [name, queryString = ""] = hash.split("?");
    return { name, params: new URLSearchParams(queryString) };
  }

  function navigate(name, params) {
    DialogManager.close();
    runtime.sidebarOpen = false;
    const query = params ? `?${new URLSearchParams(params).toString()}` : "";
    const target = `#/${name}${query}`;
    if (location.hash === target) render();
    else location.hash = target;
  }

  function toast(message, type) {
    const node = document.createElement("div");
    node.className = `toast ${type || ""}`;
    node.setAttribute("role", type === "error" ? "alert" : "status");
    node.innerHTML = `<strong aria-hidden="true">${type === "success" ? "✓" : type === "error" ? "!" : "i"}</strong><span>${esc(message)}</span>`;
    toastRoot.appendChild(node);
    window.setTimeout(() => node.remove(), 3600);
  }

  function commitDirect(mutator) {
    const current = state();
    const next = C.deepClone(current);
    mutator(next);
    next.revision = current.revision + 1;
    store.setState(next, current.revision);
    return next;
  }

  function runMutation(options, successMessage) {
    try {
      const result = transactions.run(options);
      render();
      if (successMessage) toast(successMessage, "success");
      return result;
    } catch (error) {
      const message = humanError(error);
      toast(message, "error");
      return null;
    }
  }

  function humanError(error) {
    const code = String(error?.message || error || "UNKNOWN");
    const known = {
      AUTHORIZATION_DENIED: "Your current role, scope, or task ownership does not permit that action.",
      NOT_TASK_OWNER: "Only the active task owner or a valid delegate can complete this action.",
      INVALID_TRANSITION: "That transition is not available from the request's current state.",
      REASON_REQUIRED: "Enter a reason before continuing.",
      DUPLICATE_OPERATION: "This operation was already completed. The latest state has been kept.",
      STALE_REVISION: "Another tab changed this record first. The latest state has been reloaded.",
      LEAVE_REQUIRED_FIELDS: "Complete the required leave fields.",
      LEAVE_DATE_ORDER: "Leave end date cannot be before the start date.",
      HALF_DAY_SINGLE_DATE: "Half-day leave must start and end on the same date.",
      HALF_DAY_SESSION_REQUIRED: "Choose a morning or afternoon session for half-day leave.",
      NO_WORKING_DAYS: "The selected leave period has no working days.",
      LEAVE_OVERLAP: "This leave overlaps an existing active request.",
      LEAVE_ATTACHMENT_REQUIRED: "Medical evidence is required for this sick-leave duration.",
      INSUFFICIENT_LEAVE_BALANCE: "The selected leave exceeds the available balance.",
      ITSM_REQUIRED_FIELDS: "Complete category, subcategory, impact, urgency, summary and description.",
      TIMESHEET_LOCKED_OR_MISSING: "This timesheet period is locked or unavailable.",
      TIMESHEET_LINE_INVALID: "Each timesheet line needs a permitted project, task, date and positive hours.",
      TIMESHEET_DUPLICATE_LINE: "Duplicate project/task/date lines are not allowed.",
      TIMESHEET_DAY_LIMIT: "Daily timesheet hours cannot exceed 24.",
      TIMESHEET_TOTAL_INVALID: "Timesheet total must be greater than zero and no more than 80 hours.",
      ASSET_KIND_REQUIRED: "Choose New, Replace, Repair or Return.",
      ASSET_REQUIRED_FIELDS: "Choose an asset type and enter a business purpose.",
      ASSET_NOT_OWNED: "Only an asset allocated to the requester can be repaired, replaced or returned.",
      ASSET_UNAVAILABLE: "That asset is no longer available.",
      EXPENSE_REQUIRED_FIELDS: "Add at least one expense line and choose a cost center.",
      EXPENSE_LINE_INVALID: "Every expense line needs category, bill date, merchant and a positive amount.",
      DUPLICATE_EXPENSE_BILL: "A matching merchant, bill number and bill date already exists.",
      APPROVED_AMOUNT_INVALID: "Approved amount must be between zero and the claimed amount.",
      REDUCTION_REASON_REQUIRED: "A reduction reason is required.",
      SETTLEMENT_INVALID: "Enter a valid payment reference and paid amount.",
      DUPLICATE_SETTLEMENT: "This claim has already been settled.",
      ACCOUNT_LOCKED: "This demo account is locked. A System Administrator reset is required.",
      INVALID_CREDENTIAL: "Incorrect prototype password.",
      STORAGE_WRITE_FAILED: "The browser could not save the change. No logical commit was reported."
    };
    if (code.startsWith("RECEIPT_REQUIRED")) return "A receipt is required for the highlighted expense line.";
    return known[code] || code.replaceAll("_", " ").toLowerCase().replace(/^./, (char) => char.toUpperCase());
  }

  function pageHead(routeName, actions) {
    const copy = PAGE_COPY[routeName] || ["FlowDesk PRO", "Page 10000", "Safe application response"];
    return `<div class="page-head"><div><div class="breadcrumb">FlowDesk PRO / ${esc(copy[1])}</div><h1 tabindex="-1">${esc(copy[0])}</h1><div class="subtle">${esc(copy[2])}</div></div>${actions ? `<div class="page-actions">${actions}</div>` : ""}</div>`;
  }

  function readOnlyBanner(routeName) {
    return C.PolicyEngine.isReadOnly(state(), user(), routeName)
      ? '<div class="notice-bar read-only-banner"><b aria-hidden="true">i</b><span>This page is read-only for your current role and scope. Mutation controls are intentionally unavailable.</span></div>'
      : "";
  }

  const NAV_GROUPS = [
    { label: "Workspace", items: [["dashboard", "Dashboard"], ["catalog", "Service Catalog"], ["requests", "My Requests"], ["approvals", "Approval Inbox"]] },
    { label: "Modules", items: [["leave", "Leave"], ["helpdesk", "IT Helpdesk"], ["timesheets", "Timesheets"], ["assets", "Assets"], ["expenses", "Expenses"]] },
    { label: "Insights", items: [["reports", "Reports & Analytics"], ["ai", "AI Assistant"], ["directory", "Employee Directory"], ["notifications", "Notifications"], ["knowledge", "Policy & Knowledge"], ["delegation", "Delegation & OOO"], ["calendar", "Calendar & Holidays"]] },
    { label: "Administration", items: [["admin", "Admin Console"], ["workflow", "Workflow Rules"], ["lookups", "Lookup Management"], ["roles", "Role Management"], ["users", "User Management"], ["audit", "Audit Trail"], ["modules", "Module Manager"], ["config", "Configuration"]] }
  ];

  function renderNav() {
    const routeName = routeInfo().name;
    return NAV_GROUPS.map((group) => {
      const items = group.items.filter(([name]) => C.PolicyEngine.canAccessRoute(state(), user(), name));
      if (!items.length) return "";
      const expanded = runtime.navGroups[group.label] !== false;
      return `<section class="nav-group"><button class="nav-group-toggle" data-action="toggle-nav-group" data-group="${attr(group.label)}" aria-expanded="${expanded}"><span>${esc(group.label)}</span>${icon("chevron", 15)}</button><div class="nav-group-items" ${expanded ? "" : "hidden"}>${items.map(([name, label]) => `<button class="nav-link" data-action="nav" data-route="${attr(name)}" ${routeName === name ? 'aria-current="page"' : ""}><span class="nav-icon">${icon(name)}</span><span>${esc(label)}</span>${name === "approvals" && C.Selectors.actionableTasks(state(), user()).length ? `<span class="nav-count">${C.Selectors.actionableTasks(state(), user()).length}</span>` : ""}</button>`).join("")}</div></section>`;
    }).join("");
  }

  function renderMobileNav() {
    const items = [["dashboard", "Home"], ["requests", "Requests"], ["catalog", "Catalog"], ["approvals", "Tasks"], ["profile", "Profile"]]
      .filter(([name]) => C.PolicyEngine.canAccessRoute(state(), user(), name));
    const current = routeInfo().name;
    return `<nav class="mobile-nav" aria-label="Mobile navigation">${items.map(([name, label]) => `<button data-action="nav" data-route="${name}" class="${current === name ? "active" : ""}" ${current === name ? 'aria-current="page"' : ""}><b>${icon(name, 20)}</b><span>${label}</span></button>`).join("")}</nav>`;
  }

  function renderShell(content) {
    const currentUser = user();
    const canCreate = C.PolicyEngine.canAccessRoute(state(), currentUser, "wizard");
    const notifications = C.Selectors.notifications(state(), currentUser);
    const unread = notifications.filter((item) => !item.readAt).length;
    root.innerHTML = `<div class="app ${runtime.sidebarOpen ? "sidebar-open" : ""}" id="app"><aside class="sidebar" aria-label="Main navigation"><div class="brand"><div class="brand-mark">F</div><div class="brand-name">FlowDesk</div><div class="pro-badge">PRO</div></div><nav class="nav-scroll">${renderNav()}</nav><button class="sidebar-profile" data-action="nav" data-route="profile"><span class="avatar">${initials(currentUser.displayName)}</span><span class="profile-text"><span class="profile-name">${esc(currentUser.displayName)}</span><span class="profile-role">${esc(C.ROLE_LABELS[currentUser.primaryRoleCode])}</span></span><span aria-hidden="true">›</span></button></aside><button class="mobile-overlay" data-action="close-sidebar" aria-label="Close navigation"></button><section class="shell app-shell"><div class="prototype-banner">Working business prototype · localStorage simulation only · Oracle APEX security, transactions, files, email and workflow remain production handoff items</div><header class="topbar"><button class="mobile-brand" data-action="toggle-sidebar" aria-label="Open navigation">F</button><label class="search-box"><span>${icon("search", 16)}</span><input id="globalSearch" type="search" placeholder="Search permitted requests, people, services…" aria-label="Global search"></label><button class="icon-btn mobile-search" data-action="open-search" aria-label="Search">${icon("search", 20)}</button><div class="top-actions">${canCreate ? `<button class="btn btn-primary top-new" data-action="start-wizard">${icon("plus", 16)}<span>New Request</span></button>` : ""}<div class="notification-wrap"><button class="icon-btn" data-action="nav" data-route="notifications" aria-label="Notifications">${icon("notifications", 20)}</button>${unread ? `<span class="notification-dot">${unread}</span>` : ""}</div><button class="icon-btn profile-top" data-action="open-profile-menu" aria-label="Profile menu">${initials(currentUser.displayName)}</button></div></header><main class="content" id="content">${content}</main>${renderMobileNav()}</section></div><div class="route-announcer" aria-live="polite">${esc((PAGE_COPY[routeInfo().name] || ["Error"])[0])}</div>`;
  }

  function renderLogin() {
    const selected = state().currentUsername in C.USERS ? state().currentUsername : "employee";
    const storageNotice = store.lastError
      ? `<div class="notice-bar danger" role="alert"><b aria-hidden="true">!</b><span>Saved prototype data could not be used safely, so FlowDesk loaded a clean demo state. Use <strong>Reset Demo Data</strong> after signing in if you need another clean reset.</span></div>`
      : "";
    root.innerHTML = `<main class="login"><section class="login-card"><div class="login-brand"><div class="login-logo"><div class="brand-mark">F</div><div class="brand-name">FlowDesk</div><div class="pro-badge">PRO</div></div><div class="login-brand-copy"><h1>Every request.<br>One governed flow.</h1><p>Workflow, employee services and module operations in a connected enterprise prototype.</p></div></div><form class="login-form" id="loginForm" novalidate><h1>Sign in to the prototype</h1><p class="subtle">Choose a seeded persona to verify its exact route, scope and action policy.</p>${storageNotice}<div class="notice-bar warning"><b aria-hidden="true">!</b><span>This is not production authentication. The credential and lockout behavior exist only to demonstrate the approved contract.</span></div><div class="form-field"><label for="loginUser">Demo user</label><select class="input" id="loginUser" name="username">${Object.values(C.USERS).map((item) => `<option value="${item.username}" ${selected === item.username ? "selected" : ""}>${esc(item.displayName)} — ${esc(C.ROLE_LABELS[item.primaryRoleCode])}</option>`).join("")}</select></div><div class="form-field section-gap"><label for="loginPassword">Prototype password<span class="required-mark">*</span></label><input class="input" id="loginPassword" name="password" type="password" autocomplete="current-password" aria-describedby="loginHint loginError" required><div class="login-credential" id="loginHint">Use <strong>FlowDesk@123</strong></div><div class="field-error" id="loginError" aria-live="assertive"></div></div><button class="btn btn-primary" type="submit">Sign in</button></form></section></main>`;
    document.title = "Sign in · FlowDesk PRO";
    requestAnimationFrame(() => document.getElementById("loginPassword")?.focus());
  }

  function render() {
    const currentState = state();
    if (!currentState.loggedIn) {
      renderLogin();
      return;
    }
    const info = routeInfo();
    const routePolicy = C.ROUTE_POLICY[info.name] || currentState.rolePolicy?.[info.name];
    if (!routePolicy) {
      renderShell(renderError("NOT_FOUND", "Page not found", "The requested route is not part of the approved FlowDesk PRO page map."));
      afterRoute("Error");
      return;
    }
    if (routePolicy.moduleCode && !C.PolicyEngine.isModuleLive(currentState, routePolicy.moduleCode)) {
      renderShell(renderError("MODULE_DISABLED", `${moduleName(routePolicy.moduleCode)} is unavailable`, "New entry points are closed. Authorized historical records remain visible from My Requests and Audit Trail."));
      afterRoute("Module unavailable");
      return;
    }
    if (!C.PolicyEngine.canAccessRoute(currentState, user(), info.name)) {
      recordDeniedOnce(`route:${info.name}`);
      renderShell(renderError("PERMISSION_DENIED", "Permission denied", "Your current role has no access to this route. No technical details were exposed."));
      afterRoute("Permission denied");
      return;
    }
    const renderer = ROUTE_RENDERERS[info.name];
    let content;
    try {
      content = renderer ? renderer(info.params) : renderError("NOT_FOUND", "Page not found", "This route is not implemented.");
    } catch (error) {
      runtime.consoleErrors.push(String(error?.stack || error));
      content = renderError("SAFE_RUNTIME_ERROR", "This page could not be displayed", "The prototype stopped safely. Reset demo data or return to Dashboard.");
    }
    renderShell(content);
    afterRoute((PAGE_COPY[info.name] || ["FlowDesk PRO"])[0]);
  }

  function afterRoute(title) {
    document.title = `${title} · FlowDesk PRO`;
    requestAnimationFrame(() => {
      const heading = document.querySelector("#content h1");
      if (heading) heading.focus({ preventScroll: true });
      const messages = document.getElementById("messages");
      if (messages) messages.scrollTop = messages.scrollHeight;
    });
  }

  function recordDeniedOnce(key) {
    if (runtime.lastDeniedKey === key) return;
    runtime.lastDeniedKey = key;
    const current = state();
    const next = C.deepClone(current);
    C.logDenied(next, user(), "ACCESS_DENIED", "ROUTE", key, "Route or record scope denied");
    next.revision = current.revision + 1;
    try { store.setState(next, current.revision); } catch (_) {}
  }

  function renderError(code, title, copy) {
    return `<div class="page">${pageHead("error")}<section class="card empty"><div class="empty-icon" aria-hidden="true">!</div><div class="module-pill">${esc(code)}</div><h1 tabindex="-1">${esc(title)}</h1><p class="subtle">${esc(copy)}</p><button class="btn btn-primary" data-action="nav" data-route="dashboard">Return to Dashboard</button></section></div>`;
  }

  function statCard(iconName, value, label, tone) {
    return `<div class="card stat simple-stat ${tone || ""}"><div class="stat-icon">${icon(iconName)}</div><div class="stat-value">${esc(value)}</div><div class="stat-label">${esc(label)}</div></div>`;
  }

  function renderDashboard() {
    const report = C.Selectors.reports(state(), user(), {});
    const actionable = C.Selectors.actionableTasks(state(), user());
    const notifications = C.Selectors.notifications(state(), user());
    const atRisk = report.rows.filter((request) => request.dueAt && new Date(request.dueAt) - new Date(C.isoNow(state())) < 8 * 3600000 && !C.TERMINAL.has(request.statusCode)).length;
    const attention = actionable.map((taskRow) => C.requestById(state(), taskRow.requestId)).filter(Boolean).slice(0, 4);
    return `<div class="page"><div class="page-head dashboard-head"><div><h1 tabindex="-1">Good morning, ${esc(user().displayName.split(" ")[0])}</h1><div class="subtle">${formatDate(C.dateOnly(state()))} · ${actionable.length + notifications.filter((item) => !item.readAt).length} items need your attention</div></div><div class="page-actions"><button class="btn" data-action="dashboard-range">${icon("calendar", 16)} Last ${runtime.reportFilters.periodDays} days</button></div></div><div class="grid grid-4">${statCard("requests", report.rows.filter((request) => !C.TERMINAL.has(request.statusCode)).length, "Open in my scope")}${statCard("approvals", actionable.length, "My actionable tasks")}${statCard("warning", atRisk, "SLA at risk", "warning")}${statCard("success", report.closed, "Closed in my scope", "success")}</div><div class="dashboard-main"><section class="card table-card"><div class="table-toolbar"><h2>Awaiting Your Action</h2><button class="text-action toolbar-spacer" data-action="nav" data-route="approvals">View all ${actionable.length}</button></div><div class="attention-list">${attention.length ? attention.map((request) => `<div class="attention-row"><span class="avatar">${initials(C.displayName(request.requesterEmpId))}</span><div><strong>${esc(request.title)}</strong><div class="subtle">${esc(request.requestNumber || "Draft")} · ${esc(C.displayName(request.requesterEmpId))}</div></div><div class="attention-meta">${modulePill(request.moduleCode)}<span class="sla-state"><i></i>${request.dueAt ? `Due ${formatDate(request.dueAt)}` : "On track"}</span></div><div class="attention-actions"><button class="text-action" data-action="open-request" data-id="${attr(request.requestId)}">Review</button></div></div>`).join("") : '<div class="empty"><div class="empty-icon">✓</div><h2>All caught up</h2><p class="subtle">No active task is assigned to you.</p></div>'}</div></section><aside class="card status-card"><div class="card-head"><h2>Request Status Mix</h2></div><div class="status-ring-wrap"><svg width="150" height="150" viewBox="0 0 164 164" role="img" aria-label="Scoped request status mix"><circle cx="82" cy="82" r="60" fill="none" stroke="var(--fd-border)" stroke-width="22"></circle><circle cx="82" cy="82" r="60" fill="none" stroke="var(--fd-primary)" stroke-width="22" stroke-dasharray="${Math.min(377, report.closed * 54)} 377" transform="rotate(-90 82 82)"></circle></svg><div class="status-ring-label"><strong>${report.total}</strong><span class="subtle">requests</span></div></div><div class="status-legend">${["CLOSED", "IN_REVIEW", "SUBMITTED", "FULFILLMENT"].map((status) => `<div class="status-legend-row"><span class="legend-dot"></span>${labelStatus(status)}<strong>${report.rows.filter((item) => item.statusCode === status).length}</strong></div>`).join("")}</div><p class="chart-summary">Text values provide the same information as the visual ring.</p></aside></div></div>`;
  }

  function filteredRequests() {
    let rows = C.Selectors.requests(state(), user(), runtime.requestFilters);
    if (runtime.requestTab === "DRAFT") rows = rows.filter((item) => item.statusCode === "DRAFT");
    if (runtime.requestTab === "AWAITING") rows = rows.filter((item) => ["SUBMITTED", "IN_REVIEW", "SENT_BACK", "FULFILLMENT"].includes(item.statusCode));
    if (runtime.requestTab === "COMPLETED") rows = rows.filter((item) => C.TERMINAL.has(item.statusCode));
    return rows;
  }

  function requestTable(rows, actionMode) {
    if (!rows.length) return '<div class="empty"><div class="empty-icon">✓</div><h2>No matching requests</h2><p class="subtle">Change the filters or create a permitted request.</p></div>';
    return `<div class="table-scroll"><table class="responsive-table"><caption class="table-caption">${rows.length} authorized request records</caption><thead><tr><th scope="col">Request</th><th scope="col">Module</th><th scope="col">Requester</th><th scope="col">Owner</th><th scope="col">Status</th><th scope="col">Action</th></tr></thead><tbody>${rows.map((request) => {
      const taskRow = C.activeTaskForRequest(state(), request.requestId);
      const canAct = actionMode && taskRow && C.PolicyEngine.canActOnTask(state(), user(), taskRow, "VIEW");
      return `<tr><td data-label="Request"><strong>${esc(request.title)}</strong><small>${esc(request.requestNumber || "Draft · not numbered")}</small></td><td data-label="Module">${modulePill(request.moduleCode)}</td><td data-label="Requester">${esc(C.displayName(request.requesterEmpId))}</td><td data-label="Owner">${esc(ownerName(request.ownerEmpId))}</td><td data-label="Status">${pill(request.statusCode)}</td><td data-label="Action" class="request-action-cell"><button class="btn btn-sm ${canAct ? "btn-primary" : ""}" data-action="open-request" data-id="${attr(request.requestId)}">${canAct ? "Review task" : "View request"}</button></td></tr>`;
    }).join("")}</tbody></table></div>`;
  }

  function renderRequests() {
    const allRows = C.Selectors.requests(state(), user());
    const rows = filteredRequests();
    const canCreate = C.PolicyEngine.canAccessRoute(state(), user(), "wizard");
    const actions = `<button class="btn" data-action="export" data-kind="requests">Export scoped CSV</button>${canCreate ? '<button class="btn btn-primary" data-action="start-wizard">＋ New Request</button>' : ""}`;
    const tabs = [["ALL", "All"], ["DRAFT", "Drafts"], ["AWAITING", "Awaiting"], ["COMPLETED", "Completed"]];
    return `<div class="page">${pageHead("requests", actions)}${readOnlyBanner("requests")}<div class="request-tabs">${tabs.map(([code, label]) => `<button class="request-tab ${runtime.requestTab === code ? "active" : ""}" data-action="request-tab" data-tab="${code}">${label} ${code === "ALL" ? allRows.length : ""}</button>`).join("")}</div><section class="card table-card request-table-card"><div class="table-toolbar"><input class="filter" id="requestSearch" type="search" value="${attr(runtime.requestFilters.search)}" placeholder="Search request number or title" aria-label="Search requests"><select class="filter" id="requestModuleFilter" aria-label="Filter by module"><option value="">All modules</option>${C.MODULE_CODES.map((code) => `<option value="${code}" ${runtime.requestFilters.moduleCode === code ? "selected" : ""}>${esc(moduleName(code))}</option>`).join("")}</select><select class="filter" id="requestStatusFilter" aria-label="Filter by status"><option value="">All statuses</option>${["DRAFT", "SUBMITTED", "IN_REVIEW", "SENT_BACK", "APPROVED", "FULFILLMENT", "CLOSED", "REJECTED", "CANCELLED"].map((status) => `<option value="${status}" ${runtime.requestFilters.statusCode === status ? "selected" : ""}>${esc(labelStatus(status))}</option>`).join("")}</select><span class="subtle toolbar-spacer">${rows.length} shown</span></div>${requestTable(rows, false)}</section></div>`;
  }

  function startWizard(moduleCode, requestTypeCode, editRequestId) {
    runtime.wizard = freshWizard();
    runtime.wizard.moduleCode = moduleCode || "LEAVE";
    runtime.wizard.requestTypeCode = requestTypeCode || C.REQUEST_TYPES.find((item) => item.moduleCode === runtime.wizard.moduleCode)?.code || "";
    runtime.wizard.editRequestId = editRequestId || null;
    if (editRequestId) {
      const request = C.Selectors.request(state(), user(), editRequestId);
      if (!request || !C.PolicyEngine.canPerformAction(state(), user(), "EDIT_REQUEST", { request })) return toast("This request is not editable.", "error");
      runtime.wizard.moduleCode = request.moduleCode;
      runtime.wizard.requestTypeCode = request.requestTypeCode;
      runtime.wizard.details = C.deepClone(request.details || {});
      runtime.wizard.expenseLines = C.deepClone(request.details?.lines || []);
    }
    navigate("wizard");
  }

  function renderWizard() {
    const wizard = runtime.wizard;
    if (!C.PolicyEngine.canPerformAction(state(), user(), "CREATE_REQUEST", { moduleCode: wizard.moduleCode })) return renderError("PERMISSION_DENIED", "Request creation denied", "This role cannot create requests.");
    const steps = ["Service", "Details", "Evidence", "Route preview", "Review"];
    const actions = wizard.step > 1 ? '<button class="btn" data-action="wizard-back">Back</button>' : "";
    return `<div class="page">${pageHead("wizard", actions)}<div class="wizard-steps" aria-label="Request wizard progress">${steps.map((label, index) => `<button class="wizard-step ${wizard.step === index + 1 ? "active" : wizard.step > index + 1 ? "done" : ""}" type="button" ${wizard.step >= index + 1 ? `data-action="wizard-go" data-step="${index + 1}"` : "disabled"} aria-current="${wizard.step === index + 1 ? "step" : "false"}">${index + 1}. ${label}</button>`).join("")}</div>${wizard.error ? `<div class="error-summary" role="alert">${esc(wizard.error)}</div>` : ""}<form class="card" id="wizardForm" novalidate>${renderWizardStep(wizard)}<footer class="modal-foot">${wizard.step > 1 ? '<button class="btn" type="button" data-action="wizard-back">Back</button>' : ""}<button class="btn" type="button" data-action="save-wizard-draft">Save Draft</button>${wizard.step < 5 ? '<button class="btn btn-primary" type="button" data-action="wizard-next">Continue</button>' : '<button class="btn btn-primary" type="submit">Confirm & Submit</button>'}</footer></form></div>`;
  }

  function renderWizardStep(wizard) {
    if (wizard.step === 1) {
      const liveTypes = C.REQUEST_TYPES.filter((item) => item.active && C.PolicyEngine.isModuleLive(state(), item.moduleCode));
      return `<div class="modal-body"><h2>Choose service and request type</h2><p class="subtle">Only live modules and action-permitted request types are listed.</p><div class="form-grid section-gap"><div class="form-field"><label for="wizardModule">Module<span class="required-mark">*</span></label><select class="input" id="wizardModule" name="moduleCode">${C.MODULE_CODES.filter((code) => C.PolicyEngine.isModuleLive(state(), code)).map((code) => `<option value="${code}" ${wizard.moduleCode === code ? "selected" : ""}>${esc(moduleName(code))}</option>`).join("")}</select></div><div class="form-field"><label for="wizardType">Request type<span class="required-mark">*</span></label><select class="input" id="wizardType" name="requestTypeCode">${liveTypes.filter((item) => item.moduleCode === wizard.moduleCode).map((item) => `<option value="${item.code}" ${wizard.requestTypeCode === item.code ? "selected" : ""}>${esc(item.title)}</option>`).join("")}</select></div></div><div class="notice-bar section-gap"><b>i</b><span>${esc(liveTypes.find((item) => item.moduleCode === wizard.moduleCode && item.code === wizard.requestTypeCode)?.description || "Choose a request type.")}</span></div></div>`;
    }
    if (wizard.step === 2) return `<div class="modal-body"><h2>Required business details</h2><p class="subtle">The form changes by module. Unrelated fields are intentionally omitted.</p><div class="form-grid section-gap">${moduleFields(wizard)}</div></div>`;
    if (wizard.step === 3) {
      return `<div class="modal-body"><h2>Evidence and attachments</h2><p class="subtle">The prototype records safe metadata only; it does not upload file content.</p><div class="form-grid section-gap"><div class="form-field"><label for="wizardFileName">File name</label><input class="input" id="wizardFileName" name="fileName" placeholder="e.g. medical-note.pdf"></div><div class="form-field"><label for="wizardMime">MIME type</label><select class="input" id="wizardMime" name="mimeType"><option value="">No file</option><option value="application/pdf">application/pdf</option><option value="image/jpeg">image/jpeg</option><option value="image/png">image/png</option><option value="text/plain">text/plain</option></select></div><div class="form-field"><label for="wizardSize">Simulated size (bytes)</label><input class="input" id="wizardSize" name="sizeBytes" type="number" min="1" max="10485760" value="120000"></div></div>${wizard.attachments.length ? `<div class="attachment-list section-gap">${wizard.attachments.map((item) => `<div class="attachment-item">${icon("requests", 16)}<strong>${esc(item.fileName)}</strong><span class="subtle">${esc(item.mimeType)} · ${item.sizeBytes} bytes</span></div>`).join("")}</div>` : '<div class="notice-bar section-gap"><b>i</b><span>No attachment metadata added yet. Module policy is checked again on submit.</span></div>'}</div>`;
    }
    if (wizard.step === 4) {
      const rule = state().workflowRules.filter((item) => item.active && item.moduleCode === wizard.moduleCode).sort((a, b) => a.priority - b.priority)[0];
      return `<div class="modal-body"><h2>Policy and route preview</h2><p class="subtle">This preview shows approver types and SLA only; it does not expose executable policy internals.</p><div class="notice-bar section-gap"><b>✓</b><span>Module is installed, licensed and enabled. Submit will run blocking validation again.</span></div><ol class="policy-result">${(rule?.steps || []).map((step) => `<li><strong>${esc(labelStatus(step.code))}</strong> · ${esc(step.taskType)} task · ${Number(step.slaHours)} hour SLA</li>`).join("")}</ol><div class="native-handoff card section-gap"><h3>Oracle APEX 26.1 handoff</h3><p class="subtle">Production creates native Workflow/Human Task instances. This browser prototype simulates task IDs, owners and decisions only.</p></div></div>`;
    }
    const review = wizardReview(wizard);
    return `<div class="modal-body"><h2>Review before submission</h2><p class="subtle">Confirm the generated header snapshot and business details.</p><div class="review-grid section-gap">${Object.entries(review).map(([label, value]) => `<div class="review-item"><div class="field-label">${esc(label)}</div><div class="field-value">${esc(value)}</div></div>`).join("")}</div><div class="notice-bar warning section-gap"><b>!</b><span>Submit creates a governed request and task. Save Draft creates no workflow task.</span></div></div>`;
  }

  function moduleFields(wizard) {
    const d = wizard.details || {};
    const required = '<span class="required-mark">*</span>';
    if (wizard.moduleCode === "LEAVE") {
      return `<div class="form-field"><label for="leaveType">Leave type${required}</label><select class="input" id="leaveType" name="leaveTypeCode">${lookupOptions("LEAVE_TYPE", d.leaveTypeCode || "ANNUAL")}</select></div><div class="form-field"><label for="dayOption">Day option${required}</label><select class="input" id="dayOption" name="dayOption"><option value="FULL" ${d.dayOption !== "HALF" ? "selected" : ""}>Full day</option><option value="HALF" ${d.dayOption === "HALF" ? "selected" : ""}>Half day</option></select></div><div class="form-field"><label for="startDate">Start date${required}</label><input class="input" id="startDate" name="startDate" type="date" value="${attr(d.startDate || "2026-07-30")}" required></div><div class="form-field"><label for="endDate">End date${required}</label><input class="input" id="endDate" name="endDate" type="date" value="${attr(d.endDate || "2026-07-31")}" required></div><div class="form-field"><label for="leaveSession">Half-day session</label><select class="input" id="leaveSession" name="session"><option value="">Not applicable</option><option value="AM" ${d.session === "AM" ? "selected" : ""}>Morning</option><option value="PM" ${d.session === "PM" ? "selected" : ""}>Afternoon</option></select></div><div class="form-field"><label for="handover">Handover contact</label><input class="input" id="handover" name="handover" value="${attr(d.handover || "")}"></div><div class="form-field full"><label for="requestReason">Reason${required}</label><textarea class="input" id="requestReason" name="reason" required>${esc(d.reason || "")}</textarea></div>`;
    }
    if (wizard.moduleCode === "ITSM") {
      return `<div class="form-field"><label for="itCategory">Category${required}</label><select class="input" id="itCategory" name="categoryCode">${lookupOptions("IT_CATEGORY", d.categoryCode || "ACCESS")}</select></div><div class="form-field"><label for="itSubcategory">Subcategory${required}</label><select class="input" id="itSubcategory" name="subcategoryCode">${lookupOptions("IT_SUBCATEGORY", d.subcategoryCode || "VPN", d.categoryCode || "ACCESS")}</select></div><div class="form-field"><label for="impactCode">Impact${required}</label><select class="input" id="impactCode" name="impactCode">${["INDIVIDUAL", "TEAM", "DEPARTMENT", "ORGANIZATION"].map((value) => `<option ${d.impactCode === value ? "selected" : ""}>${value}</option>`).join("")}</select></div><div class="form-field"><label for="urgencyCode">Urgency${required}</label><select class="input" id="urgencyCode" name="urgencyCode">${["LOW", "NORMAL", "HIGH", "CRITICAL"].map((value) => `<option ${d.urgencyCode === value ? "selected" : ""}>${value}</option>`).join("")}</select></div><div class="form-field full"><label for="itSummary">Issue summary${required}</label><input class="input" id="itSummary" name="summary" value="${attr(d.summary || "")}" required maxlength="100"></div><div class="form-field"><label for="assetRef">Asset reference</label><input class="input" id="assetRef" name="assetRef" value="${attr(d.assetRef || "")}" placeholder="${C.PolicyEngine.isModuleLive(state(), "ASSET") ? "Choose or enter asset ID" : "Free-text asset reference"}"></div><div class="form-field full"><label for="itDescription">Description${required}</label><textarea class="input" id="itDescription" name="description" required>${esc(d.description || "")}</textarea></div>`;
    }
    if (wizard.moduleCode === "TIMESHEET") {
      const sheet = C.Selectors.timesheet(state(), user(), user().empId, "2026-W31");
      const total = (sheet?.lines || []).reduce((sum, line) => sum + Number(line.hours || 0), 0);
      return `<div class="receipt-note">Weekly line entry is maintained on Page 10. This request will submit period 2026-W31 with ${total} current hours.</div><input type="hidden" name="periodId" value="2026-W31"><div class="form-field full"><label for="tsReason">Submission note</label><textarea class="input" id="tsReason" name="reason">${esc(d.reason || "")}</textarea></div>`;
    }
    if (wizard.moduleCode === "ASSET") {
      const owned = C.Selectors.assets(state(), user());
      return `<div class="form-field"><label for="assetKind">Request kind${required}</label><select class="input" id="assetKind" name="requestKind">${["NEW", "REPLACE", "REPAIR", "RETURN"].map((value) => `<option ${d.requestKind === value ? "selected" : ""}>${value}</option>`).join("")}</select></div><div class="form-field"><label for="assetType">Asset type${required}</label><select class="input" id="assetType" name="assetTypeCode">${lookupOptions("ASSET_TYPE", d.assetTypeCode || "LAPTOP")}</select></div><div class="form-field"><label for="existingAsset">Existing asset</label><select class="input" id="existingAsset" name="existingAssetId"><option value="">Not applicable</option>${owned.map((item) => `<option value="${attr(item.asset.assetId)}" ${d.existingAssetId === item.asset.assetId ? "selected" : ""}>${esc(item.asset.assetId)} · ${esc(item.asset.name)}</option>`).join("")}</select></div><div class="form-field"><label for="requiredDate">Required by</label><input class="input" id="requiredDate" name="requiredDate" type="date" value="${attr(d.requiredDate || "2026-08-05")}"></div><div class="form-field full"><label for="assetPurpose">Business purpose${required}</label><textarea class="input" id="assetPurpose" name="purpose" required>${esc(d.purpose || "")}</textarea></div>`;
    }
    const currency = C.resolveConfig(state(), "DEFAULT_CURRENCY", user().empId, user().departmentId);
    const lines = wizard.expenseLines || [];
    return `<div class="form-field"><label for="costCenterCode">Cost center${required}</label><select class="input" id="costCenterCode" name="costCenterCode">${state().costCenters.filter((item) => item.active && item.departmentIds.includes(user().departmentId)).map((item) => `<option value="${attr(item.code)}" ${d.costCenterCode === item.code ? "selected" : ""}>${esc(item.code)} · ${esc(item.name)}</option>`).join("")}</select></div><div class="form-field"><label>Installation currency</label><input class="input" value="${attr(currency)}" readonly aria-readonly="true"></div><div class="form-field"><label for="projectCode">Project</label><select class="input" id="projectCode" name="projectCode">${state().projects.filter((item) => item.active && item.memberEmpIds.includes(user().empId)).map((item) => `<option value="${attr(item.code)}" ${d.projectCode === item.code ? "selected" : ""}>${esc(item.name)}</option>`).join("")}</select></div><div class="form-field full"><div class="inline-wrap"><h3>Expense lines</h3><button class="btn btn-sm toolbar-spacer" type="button" data-action="open-modal" data-modal="57">Add line</button></div>${lines.length ? `<div class="stack-sm">${lines.map((line, index) => `<div class="review-item"><div class="inline-wrap"><strong>${esc(line.categoryCode)} · ${money(Number(line.amount) + Number(line.tax || 0), currency)}</strong><button class="btn btn-sm toolbar-spacer" type="button" data-action="remove-expense-line" data-index="${index}">Remove</button></div><div class="subtle">${esc(line.merchant)} · ${esc(line.billNumber || "No bill number")} · ${formatDate(line.billDate)}</div></div>`).join("")}</div>` : '<div class="field-error">Add at least one itemized line.</div>'}</div>`;
  }

  function lookupOptions(typeCode, selected, parentCode) {
    return state().lookups.filter((item) => item.active && item.typeCode === typeCode && (!parentCode || item.parentCode === parentCode))
      .sort((a, b) => a.sortOrder - b.sortOrder).map((item) => `<option value="${attr(item.code)}" ${selected === item.code ? "selected" : ""}>${esc(item.label)}</option>`).join("");
  }

  function collectWizard() {
    const form = document.getElementById("wizardForm");
    if (!form) return;
    const data = Object.fromEntries(new FormData(form).entries());
    if (runtime.wizard.step === 1) {
      runtime.wizard.moduleCode = data.moduleCode;
      runtime.wizard.requestTypeCode = data.requestTypeCode;
    }
    if (runtime.wizard.step === 2) {
      runtime.wizard.details = Object.assign({}, runtime.wizard.details, data);
      if (runtime.wizard.moduleCode === "EXPENSE") runtime.wizard.details.lines = C.deepClone(runtime.wizard.expenseLines);
      if (runtime.wizard.moduleCode === "LEAVE") runtime.wizard.details.attachmentIds = runtime.wizard.attachments.map((item) => item.attachmentId);
    }
    if (runtime.wizard.step === 3 && data.fileName) {
      const result = C.validateAttachment(data);
      if (!result.valid) throw new Error(result.reason);
      runtime.wizard.attachments.push({ attachmentId: C.uid("ATT"), fileName: data.fileName, mimeType: data.mimeType, sizeBytes: Number(data.sizeBytes), extension: result.extension });
      runtime.wizard.details.attachmentIds = runtime.wizard.attachments.map((item) => item.attachmentId);
    }
  }

  function wizardReview(wizard) {
    const type = C.REQUEST_TYPES.find((item) => item.moduleCode === wizard.moduleCode && item.code === wizard.requestTypeCode);
    const details = wizard.details || {};
    let title = type?.title || "New request";
    let summary = details.reason || details.description || details.summary || "Ready for submission";
    if (wizard.moduleCode === "LEAVE") title = `${state().lookups.find((item) => item.code === details.leaveTypeCode)?.label || "Leave"} · ${formatDate(details.startDate)} to ${formatDate(details.endDate)}`;
    if (wizard.moduleCode === "ITSM") title = details.summary || "IT support request";
    if (wizard.moduleCode === "EXPENSE") title = `${type?.title || "Expense claim"} · ${money(C.ModuleServices.EXPENSE.recalculate(wizard.expenseLines), C.resolveConfig(state(), "DEFAULT_CURRENCY", user().empId, user().departmentId))}`;
    return { Module: moduleName(wizard.moduleCode), "Request type": type?.title || wizard.requestTypeCode, Requester: user().displayName, Title: title, Summary: summary, Evidence: `${wizard.attachments.length} attachment metadata record(s)` };
  }

  function buildWizardInput() {
    const wizard = runtime.wizard;
    const review = wizardReview(wizard);
    const details = C.deepClone(wizard.details);
    if (wizard.moduleCode === "EXPENSE") details.lines = C.deepClone(wizard.expenseLines);
    if (wizard.moduleCode === "LEAVE") details.attachmentIds = wizard.attachments.map((item) => item.attachmentId);
    return { moduleCode: wizard.moduleCode, requestTypeCode: wizard.requestTypeCode, title: review.Title, summary: review.Summary, details, amount: wizard.moduleCode === "EXPENSE" ? C.ModuleServices.EXPENSE.recalculate(wizard.expenseLines) : null, fromDate: details.startDate || null, toDate: details.endDate || null };
  }

  function saveWizard(submit) {
    try { collectWizard(); } catch (error) { runtime.wizard.error = humanError(error); render(); return; }
    const input = buildWizardInput();
    let requestId = runtime.wizard.editRequestId;
    const result = runMutation({
      eventType: submit ? "SUBMIT" : "SAVE_DRAFT",
      objectType: "REQUEST",
      objectId: requestId || "NEW",
      authorize: (draft, actor) => {
        if (!requestId) return C.PolicyEngine.canPerformAction(draft, actor, "CREATE_REQUEST", { moduleCode: input.moduleCode });
        const request = C.requestById(draft, requestId);
        return C.PolicyEngine.canPerformAction(draft, actor, submit ? "SUBMIT_REQUEST" : "EDIT_REQUEST", { request });
      },
      snapshot: (draft) => requestId ? C.requestById(draft, requestId) : null,
      mutate: (draft, actor) => {
        let request = requestId ? C.requestById(draft, requestId) : C.createDraft(draft, actor, input);
        if (!request) throw new Error("REQUEST_NOT_FOUND");
        if (requestId) {
          request.details = input.details;
          request.title = input.title;
          request.summary = input.summary;
          request.amount = input.amount;
        }
        runtime.wizard.attachments.forEach((item) => {
          if (!draft.attachments.some((existing) => existing.attachmentId === item.attachmentId)) {
            draft.attachments.push(Object.assign({}, item, { requestId: request.requestId, uploaderUserId: actor.userId, createdAt: C.isoNow(draft), contentStored: false }));
          }
        });
        if (submit) C.WorkflowEngine.submit(draft, request, actor, C.uid("IDEM"));
        requestId = request.requestId;
        return request;
      }
    }, submit ? "Request submitted and routed." : "Draft saved.");
    if (result) {
      runtime.wizard = freshWizard();
      navigate("request", { id: requestId });
    }
  }

  function renderCatalog() {
    const types = C.REQUEST_TYPES.filter((item) => item.active && C.PolicyEngine.isModuleLive(state(), item.moduleCode));
    return `<div class="page">${pageHead("catalog", '<button class="btn btn-primary" data-action="start-wizard">＋ New Request</button>')}<div class="notice-bar"><b>i</b><span>Cards come from the live request-type registry. Disabled, unlicensed or unauthorized modules are removed.</span></div><div class="catalog-grid">${types.map((item) => `<article class="service-card"><div class="service-icon">${icon(C.MODULE_ROUTES[item.moduleCode])}</div><div class="service-title">${esc(item.title)}</div><div class="service-copy">${esc(item.description)}</div><div class="stack-sm section-gap"><span class="subtle">SLA: ${esc(item.sla)}</span><span class="subtle">Evidence: ${esc(item.requiredDocuments.join(", ") || "None required")}</span></div><div class="service-foot">${modulePill(item.moduleCode)}<button class="btn btn-sm btn-soft" data-action="start-wizard" data-module="${item.moduleCode}" data-type="${item.code}">Request →</button></div></article>`).join("")}</div></div>`;
  }

  function renderApprovals() {
    const visibleTasks = C.Selectors.tasks(state(), user());
    const rows = visibleTasks.map((taskRow) => ({ task: taskRow, request: C.requestById(state(), taskRow.requestId) })).filter((item) => item.request);
    if (runtime.inboxView === "board") {
      const columns = [["SUBMITTED", []], ["IN_REVIEW", rows.filter((item) => item.request.statusCode === "IN_REVIEW")], ["APPROVED", []], ["FULFILLMENT", rows.filter((item) => item.request.statusCode === "FULFILLMENT")]];
      return `<div class="page">${pageHead("approvals", inboxToggle())}${readOnlyBanner("approvals")}<div class="board">${columns.map(([status, items]) => `<section class="board-col"><div class="board-title"><span>${labelStatus(status)}</span><span>${items.length}</span></div>${items.length ? items.map(({ request, task }) => `<article class="board-card"><strong>${esc(request.title)}</strong><div class="subtle">${esc(request.requestNumber)} · ${esc(task.taskType)}</div><button class="btn btn-sm btn-soft" data-action="open-request" data-id="${request.requestId}">${C.PolicyEngine.canActOnTask(state(), user(), task, "VIEW") ? "Open task" : "View read-only"}</button></article>`).join("") : '<div class="subtle">No active task</div>'}</section>`).join("")}</div></div>`;
    }
    return `<div class="page">${pageHead("approvals", inboxToggle())}${readOnlyBanner("approvals")}<section class="card table-card"><div class="table-toolbar"><span class="subtle">${rows.length} visible active tasks; action still requires actual ownership.</span></div>${requestTable(rows.map((item) => item.request), true)}</section></div>`;
  }

  function inboxToggle() {
    return `<div class="segmented"><button class="${runtime.inboxView === "table" ? "active" : ""}" data-action="inbox-view" data-view="table">Table</button><button class="${runtime.inboxView === "board" ? "active" : ""}" data-action="inbox-view" data-view="board">Board</button></div>`;
  }

  function requestActions(request, taskRow) {
    const actions = ['<button class="btn" data-action="nav" data-route="requests">← Back</button>'];
    const actor = user();
    if (C.PolicyEngine.canPerformAction(state(), actor, "EDIT_REQUEST", { request })) actions.push(`<button class="btn" data-action="edit-request" data-id="${request.requestId}">Edit</button>`);
    if (C.PolicyEngine.canPerformAction(state(), actor, "CANCEL", { request })) actions.push(`<button class="btn btn-danger" data-action="request-decision" data-id="${request.requestId}" data-decision="CANCEL">Cancel</button>`);
    if (taskRow && taskRow.taskType === "APPROVAL" && C.PolicyEngine.canPerformAction(state(), actor, "APPROVE", { request, task: taskRow })) {
      actions.push(`<button class="btn" data-action="open-modal" data-modal="51" data-task="${taskRow.taskId}">Delegate / Reassign</button><button class="btn" data-action="request-decision" data-id="${request.requestId}" data-decision="SEND_BACK">Send Back</button><button class="btn btn-danger" data-action="request-decision" data-id="${request.requestId}" data-decision="REJECT">Reject</button><button class="btn btn-primary" data-action="request-decision" data-id="${request.requestId}" data-decision="APPROVE">Approve</button>`);
    }
    if (taskRow && taskRow.taskType === "ACTION" && C.PolicyEngine.canActOnTask(state(), actor, taskRow, "VIEW")) {
      if (request.moduleCode === "ITSM") actions.push(`<button class="btn" data-action="open-modal" data-modal="59" data-id="${request.requestId}">Assignment</button><button class="btn" data-action="add-worklog" data-id="${request.requestId}">Add worklog</button><button class="btn btn-primary" data-action="resolve-ticket" data-id="${request.requestId}">Resolve</button>`);
      if (request.moduleCode === "ASSET") actions.push(`<button class="btn btn-primary" data-action="open-modal" data-modal="58" data-id="${request.requestId}">Issue / Return</button>`);
      if (request.moduleCode === "EXPENSE") actions.push(`<button class="btn btn-primary" data-action="settle-expense" data-id="${request.requestId}">Record settlement</button>`);
    }
    if (request.statusCode === "APPROVED" && C.PolicyEngine.canPerformAction(state(), actor, "START_FULFILLMENT", { request })) actions.push(`<button class="btn btn-primary" data-action="start-fulfillment" data-id="${request.requestId}">Start fulfillment</button>`);
    if (request.moduleCode === "ITSM" && request.statusCode === "CLOSED" && C.PolicyEngine.canPerformAction(state(), actor, "ITSM_REOPEN", { request })) actions.push(`<button class="btn" data-action="reopen-ticket" data-id="${request.requestId}">Reopen</button><button class="btn" data-action="rate-ticket" data-id="${request.requestId}">Rate service</button>`);
    return actions.join("");
  }

  function renderRequestDetail(params) {
    const id = params.get("id");
    const request = C.Selectors.request(state(), user(), id);
    if (!request) {
      recordDeniedOnce(`request:${id || "missing"}`);
      return renderError("PERMISSION_DENIED", "Request unavailable", "The request does not exist or is outside your authorized scope.");
    }
    const taskRow = C.activeTaskForRequest(state(), request.requestId);
    const comments = state().comments.filter((item) => item.requestId === request.requestId && (item.visibilityCode !== "INTERNAL" || C.PolicyEngine.canViewInternalComment(state(), user(), request)));
    const attachments = state().attachments.filter((item) => item.requestId === request.requestId);
    const canCollaborate = C.PolicyEngine.canPerformAction(state(), user(), "COMMENT", { request });
    return `<div class="page">${pageHead("request", requestActions(request, taskRow))}${readOnlyBanner("request")}<div class="grid split"><div class="stack"><section class="card"><div class="card-head"><div><h2>${esc(request.title)}</h2><div class="request-number">${esc(request.requestNumber || "Draft · number allocated on submit")}</div></div>${pill(request.statusCode)}</div><div class="detail-grid">${detailItem("Requester", C.displayName(request.requesterEmpId))}${detailItem("Raised by", C.displayName(request.raisedByEmpId))}${detailItem("Module / type", `${moduleName(request.moduleCode)} · ${request.requestTypeCode}`)}${detailItem("Current owner", ownerName(request.ownerEmpId))}${detailItem("Current step", labelStatus(request.currentStepCode))}${detailItem("Task ID", request.taskId || "No active task")}${detailItem("Priority", request.priorityCode)}${detailItem("Amount", request.amount !== null ? money(request.amount, request.currencyCode) : "Not applicable")}</div><div class="section-gap"><div class="field-label">Summary</div><p>${esc(request.summary || "No summary")}</p></div></section><section class="card"><div class="card-head"><h2>Comments & attachment metadata</h2>${canCollaborate ? `<div class="btn-row"><button class="btn btn-sm" data-action="open-collaboration" data-mode="ATTACH" data-id="${request.requestId}">Add attachment</button><button class="btn btn-sm btn-soft" data-action="open-collaboration" data-mode="COMMENT" data-id="${request.requestId}">Add comment</button></div>` : ""}</div><div class="comment-list">${comments.length ? comments.map((item) => `<div class="comment-item"><div class="comment-meta"><strong>${esc(C.displayName(item.authorEmpId))}</strong><span>${formatDate(item.createdAt)}</span></div><div>${esc(item.text)}</div></div>`).join("") : '<div class="empty-inline">No visible comments.</div>'}</div><div class="attachment-list">${attachments.length ? attachments.map((item) => `<div class="attachment-item">${icon("requests", 16)}<strong>${esc(item.fileName)}</strong><span class="subtle toolbar-spacer">${esc(item.mimeType)} · ${item.sizeBytes} bytes</span></div>`).join("") : '<div class="notice-bar"><b>i</b><span>No attachment metadata. File content is never stored in this prototype.</span></div>'}</div></section></div><aside class="card"><div class="card-head"><h2>Workflow timeline</h2></div><div class="timeline">${(request.history || []).map((item) => `<div class="timeline-item"><span class="timeline-dot">✓</span><strong>${esc(labelStatus(item.actionCode))}</strong><div class="subtle">${formatDate(item.createdAt)} · ${esc(C.displayName(item.actorEmpId))}${item.onBehalfOfEmpId ? ` on behalf of ${esc(C.displayName(item.onBehalfOfEmpId))}` : ""}</div><div>${esc(item.note || "")}</div></div>`).join("") || '<div class="empty-inline">No history yet.</div>'}</div></aside></div></div>`;
  }

  function detailItem(label, value) { return `<div><div class="field-label">${esc(label)}</div><div class="field-value">${esc(value)}</div></div>`; }

  function renderLeave() {
    const balances = C.Selectors.leaveBalances(state(), user());
    const requests = C.Selectors.requests(state(), user(), { moduleCode: "LEAVE" });
    const canCreate = C.PolicyEngine.canPerformAction(state(), user(), "CREATE_REQUEST", { moduleCode: "LEAVE" });
    const canAdjust = C.PolicyEngine.canPerformAction(state(), user(), "ADJUST_LEAVE", {});

  }

  function currentTimesheet() { return C.Selectors.timesheet(state(), user(), user().empId, "2026-W31"); }

  function renderTimesheets() {
    const sheet = currentTimesheet();
    if (!sheet) return renderError("NOT_FOUND", "Timesheet unavailable", "No timesheet exists for this employee and period.");
    const total = sheet.lines.reduce((sum, line) => sum + Number(line.hours || 0), 0);
    const expected = C.ModuleServices.TIMESHEET.expectedHours(state(), sheet, user().empId);
    const billable = sheet.lines.filter((line) => line.billable).reduce((sum, line) => sum + Number(line.hours || 0), 0);
    return `<div class="page">${pageHead("timesheets", `<button class="btn" data-action="add-timesheet-line" ${sheet.locked ? "disabled" : ""}>Add line</button><button class="btn btn-primary" data-action="open-modal" data-modal="56" ${sheet.locked ? "disabled" : ""}>Submit Week</button>`)}${sheet.locked ? '<div class="notice-bar warning"><b>!</b><span>This version is locked because it is submitted or approved. Send-back creates an editable correction state.</span></div>' : ""}<div class="grid grid-4">${statCard("timesheets", `${total}h`, "Entered")}${statCard("success", `${expected}h`, "Expected")}${statCard("reports", `${billable}h`, "Billable")}${statCard("warning", `${Math.max(0, expected - total)}h`, "Missing")}</div><section class="card table-card section-gap"><div class="table-toolbar"><div><h2>${formatDate(sheet.weekStart)} – ${formatDate(sheet.weekEnd)}</h2><div class="subtle">${esc(sheet.statusCode)} · employee ${user().empId} · ${sheet.timesheetId}</div></div>${pill(sheet.statusCode)}</div><div class="table-scroll"><table><caption class="table-caption">Project, task, date and hour lines for ${esc(sheet.periodId)}</caption><thead><tr><th scope="col">Project</th><th scope="col">Task</th><th scope="col">Date</th><th scope="col">Hours</th><th scope="col">Billable</th><th scope="col">Action</th></tr></thead><tbody>${sheet.lines.map((line) => `<tr><td>${esc(line.projectCode)}</td><td>${esc(line.taskTypeCode)}</td><td>${formatDate(line.date)}</td><td><input class="input timesheet-line-hours" data-line="${line.lineId}" type="number" min=".25" max="24" step=".25" value="${line.hours}" aria-label="Hours for ${esc(line.projectCode)}" ${sheet.locked ? "disabled" : ""}></td><td>${line.billable ? "Yes" : "No"}</td><td><button class="btn btn-sm" data-action="remove-timesheet-line" data-line="${line.lineId}" ${sheet.locked ? "disabled" : ""}>Remove</button></td></tr>`).join("")}</tbody></table></div></section></div>`;
  }

  function renderAssets() {
    const allocations = C.Selectors.assets(state(), user());
    const requests = C.Selectors.requests(state(), user(), { moduleCode: "ASSET" });
    const available = state().assets.inventory.filter((item) => item.statusCode === "AVAILABLE").length;
    const hasBroadAssetGrant = C.PolicyEngine.getRouteGrants(state(), user(), "assets").some((grant) => ["M", "R", "G", "F"].includes(grant.scopeCode));

  }

  function renderExpenses() {
    const requests = C.Selectors.requests(state(), user(), { moduleCode: "EXPENSE" });
    const currency = C.resolveConfig(state(), "DEFAULT_CURRENCY", user().empId, user().departmentId);
    const total = requests.reduce((sum, item) => sum + Number(item.amount || 0), 0);
    return `<div class="page">${pageHead("expenses", C.PolicyEngine.canPerformAction(state(), user(), "CREATE_REQUEST", { moduleCode: "EXPENSE" }) ? '<button class="btn btn-primary" data-action="start-wizard" data-module="EXPENSE" data-type="REIMBURSEMENT">New Expense Claim</button>' : "")}${readOnlyBanner("expenses")}<div class="notice-bar"><b>i</b><span>Installation currency is ${esc(currency)}. Per-request currency selection and exchange-rate logic are intentionally absent.</span></div><div class="grid grid-4">${statCard("expenses", money(total, currency), "Visible claimed total")}${statCard("approvals", requests.filter((item) => item.statusCode === "IN_REVIEW").length, "In review")}${statCard("success", requests.filter((item) => item.statusCode === "FULFILLMENT").length, "Settlement queue")}${statCard("reports", requests.filter((item) => item.statusCode === "CLOSED").length, "Paid & closed")}</div><section class="card table-card section-gap"><div class="table-toolbar"><h2>Itemized expense claims</h2></div>${requestTable(requests, true)}</section></div>`;
  }

  }

    const report = C.Selectors.reports(state(), user(), runtime.reportFilters);

    return `<div class="page">${pageHead("reports", '<button class="btn" data-action="export" data-kind="analytics">Export current report</button>')}${readOnlyBanner("reports")}<div class="data-toolbar"><select class="filter" id="reportModule" aria-label="Report module"><option value="">All modules</option>${C.MODULE_CODES.map((code) => `<option value="${code}" ${runtime.reportFilters.moduleCode === code ? "selected" : ""}>${esc(moduleName(code))}</option>`).join("")}</select><select class="filter" id="reportPeriod" aria-label="Report period">${["7", "30", "90"].map((days) => `<option value="${days}" ${runtime.reportFilters.periodDays === days ? "selected" : ""}>Last ${days} days</option>`).join("")}</select></div><div class="grid grid-4">${statCard("reports", report.total, "Total authorized")}${statCard("success", report.closed, "Closed")}${statCard("approvals", report.awaiting, "Awaiting action")}${statCard("warning", report.sentBack, "Sent back")}</div><section class="card section-gap"><div class="card-head"><h2>Requests by module</h2></div><div class="stack-sm">${Object.entries(report.byModule).map(([code, count]) => `<div><div class="inline"><span>${esc(moduleName(code))}</span><strong class="toolbar-spacer">${count}</strong></div><div class="progress-track" role="img" aria-label="${esc(moduleName(code))}: ${count} requests"><div class="progress-fill" data-width="${Math.round(count / max * 100)}"></div></div></div>`).join("")}</div><p class="chart-summary">Each bar has an accessible label and exact text value.</p></section></div>`;
  }

  }

  function renderDelegation() {
    const rows = C.Selectors.delegations(state(), user());

  const DialogManager = {
    open(number, title, description, body, footer, small) {
      this.close(false);
      runtime.previousFocus = document.activeElement;
      runtime.modal = Number(number);
      const titleId = `modal-title-${number}`;
      const descriptionId = `modal-description-${number}`;
      modalRoot.innerHTML = `<div class="modal-layer" data-action="modal-backdrop"><section class="modal ${small ? "sm" : ""}" role="dialog" aria-modal="true" aria-labelledby="${titleId}" aria-describedby="${descriptionId}"><header class="modal-head"><div><span class="modal-id">Modal ${number}</span><h2 id="${titleId}">${esc(title)}</h2><p class="dialog-description" id="${descriptionId}">${esc(description)}</p></div><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">×</button></header>${body}<footer class="modal-foot">${footer}</footer></section></div>`;
      const app = document.querySelector(".app-shell");
      if (app) {
        app.setAttribute("inert", "");
        app.setAttribute("aria-hidden", "true");
      }
      requestAnimationFrame(() => {
        const preferred = modalRoot.querySelector("[data-initial-focus], input:not([type=hidden]), select, textarea, button:not([data-action=close-modal])");
        preferred?.focus();
      });
    },
    close(restore) {
      if (!runtime.modal && !modalRoot.innerHTML) return;
      const previous = runtime.previousFocus;
      runtime.modal = null;
      modalRoot.innerHTML = "";
      const app = document.querySelector(".app-shell");
      if (app) {
        app.removeAttribute("inert");
        app.removeAttribute("aria-hidden");
      }
      if (restore !== false && previous && document.contains(previous)) requestAnimationFrame(() => previous.focus());
    },
    trap(event) {
      if (!runtime.modal || event.key !== "Tab") return;
      const focusable = [...modalRoot.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')].filter((item) => item.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
  };

  function submitLogin(form) {
    const username = String(new FormData(form).get("username") || "");
