<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FlowDesk PRO finalized responsive working business prototype">
  <title>FlowDesk PRO — Final Working Prototype v2.1</title>
<style>
    :root {
      --fd-primary: #6e39cb;
      --fd-primary-hover: #5a2da8;
      --fd-primary-soft: #f0e9fe;
      --fd-primary-mid: #deccfe;
      --fd-bg: #f4f5f9;
      --fd-surface: #ffffff;
      --fd-surface-2: #f8f8fb;
      --fd-border: #e7e8eb;
      --fd-text: #3a3541;
      --fd-text-2: #534e59;
      --fd-muted: #8f8b95;
      --fd-success: #16875f;
      --fd-success-bg: #e9f7f1;
      --fd-warning: #b66c10;
      --fd-warning-bg: #fdf4e7;
      --fd-danger: #dc3535;
      --fd-danger-bg: #feecec;
      --fd-info: #245fcc;
      --fd-info-bg: #eaf2ff;
      --fd-sidebar: 240px;
      --fd-topbar: 64px;
      --fd-shadow: 0 10px 30px rgba(58, 53, 65, .12);
      --fd-shadow-sm: 0 1px 3px rgba(58, 53, 65, .08);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--fd-text);
      background: var(--fd-bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid var(--fd-primary-mid);
      outline-offset: 2px;
    }
    .hidden { display: none !important; }
    .app { width: 100%; height: 100dvh; display: grid; grid-template-columns: var(--fd-sidebar) minmax(0, 1fr); }
    .sidebar {
      position: relative;
      z-index: 40;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--fd-surface);
      border-right: 1px solid var(--fd-border);
    }
    .brand {
      min-height: var(--fd-topbar);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      border-bottom: 1px solid var(--fd-border);
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: white;
      background: var(--fd-primary);
      font-size: 15px;
      font-weight: 800;
    }
    .brand-name { font-size: 17px; font-weight: 600; letter-spacing: -.2px; }
    .pro-badge {
      padding: 2px 6px;
      color: var(--fd-primary);
      background: var(--fd-primary-soft);
      border-radius: 5px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .nav-scroll { min-height: 0; flex: 1; overflow-y: auto; padding: 12px 10px 20px; }
    .nav-section + .nav-section { margin-top: 20px; }
    .nav-label {
      margin: 0 10px 7px;
      color: var(--fd-muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .nav-label:empty { display: none; }
    .nav-link {
      width: 100%;
      height: 40px;
      margin: 2px 0;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 0;
      border-radius: 10px;
      color: var(--fd-text-2);
      background: transparent;
      font-size: 15px;
      line-height: 24px;
      text-align: left;
    }
    .nav-link:hover { color: var(--fd-primary); background: var(--fd-primary-soft); }
    .nav-link.active { color: var(--fd-primary); background: var(--fd-primary-mid); font-weight: 500; }
    .nav-icon { width: 22px; display: grid; place-items: center; color: inherit; }
    .nav-icon svg { display: block; }
    .nav-count {
      min-width: 22px;
      margin-left: auto;
      padding: 1px 7px;
      border-radius: 999px;
      color: white;
      background: var(--fd-primary);
      font-size: 11px;
      text-align: center;
    }
    .nav-off {
      margin-left: auto;
      padding: 2px 6px;
      border-radius: 5px;
      color: var(--fd-muted);
      background: var(--fd-surface-2);
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .sidebar-profile {
      margin: 10px;
      padding: 11px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--fd-primary);
    }
    .avatar {
      width: 36px;
      height: 36px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--fd-primary);
      background: var(--fd-primary-mid);
      font-size: 12px;
      font-weight: 800;
    }
    .profile-text { min-width: 0; flex: 1; }
    .profile-name, .profile-role { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile-name { color: white; font-size: 12px; font-weight: 600; }
    .profile-role { margin-top: 1px; color: rgba(255,255,255,.72); font-size: 10px; }
    .sidebar-profile .avatar { color: white; background: rgba(255,255,255,.22); }
    .shell { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .topbar {
      min-height: var(--fd-topbar);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      background: var(--fd-surface);
      border-bottom: 1px solid var(--fd-border);
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      flex: none;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--fd-text-2);
      background: transparent;
      font-size: 17px;
    }
    .icon-btn:hover { color: var(--fd-primary); background: var(--fd-primary-soft); }
    .menu-btn { display: none; }
    .search-box {
      width: min(420px, 36vw);
      height: 40px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--fd-bg);
    }
    .search-box:focus-within { border-color: var(--fd-primary); background: white; }
    .search-box span { color: var(--fd-muted); }
    .search-box input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--fd-text); background: transparent; }
    .search-box input { font-size: 15px; line-height: 24px; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .demo-select {
      height: 38px;
      max-width: 170px;
      padding: 0 31px 0 11px;
      border: 1px solid var(--fd-border);
      border-radius: 9px;
      color: var(--fd-text-2);
      background: white;
    }
    .btn {
      min-height: 40px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--fd-border);
      border-radius: 8px;
      color: var(--fd-text-2);
      background: white;
      font-size: 15px;
      line-height: 24px;
      font-weight: 500;
    }
    .btn:hover { border-color: var(--fd-primary-mid); color: var(--fd-primary); background: var(--fd-primary-soft); }
    .btn-primary { border-color: var(--fd-primary); color: white; background: var(--fd-primary); }
    .btn-primary:hover { border-color: var(--fd-primary-hover); color: white; background: var(--fd-primary-hover); }
    .btn-danger { border-color: var(--fd-danger); color: white; background: var(--fd-danger); }
    .btn-danger:hover { border-color: var(--fd-danger); color: white; background: var(--fd-danger); }
    .btn-soft { border-color: transparent; color: var(--fd-primary); background: var(--fd-primary-soft); }
    .btn-sm { min-height: 32px; padding: 4px 10px; border-radius: 8px; font-size: 13px; line-height: 20px; }
    .notification-wrap { position: relative; }
    .profile-top { width: 36px; height: 36px; border-radius: 50%; color: var(--fd-primary); background: var(--fd-primary-mid); font-size: 12px; font-weight: 600; }
    .notification-dot {
      position: absolute;
      top: 4px;
      right: 3px;
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border: 2px solid white;
      border-radius: 999px;
      color: white;
      background: var(--fd-danger);
      font-size: 8px;
      font-weight: 800;
    }
    .content { min-height: 0; flex: 1; overflow: auto; scroll-behavior: smooth; }
    .page { width: min(1440px, 100%); min-height: 100%; margin: 0 auto; padding: 24px 32px 40px; }
    .page-head {
      margin-bottom: 22px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
    }
    .breadcrumb { margin-bottom: 6px; color: var(--fd-muted); font-size: 12px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 4px; font-size: 28px; font-weight: 600; line-height: 36px; letter-spacing: -.3px; }
    h2 { margin-bottom: 4px; font-size: 16px; font-weight: 600; line-height: 24px; }
    h3 { margin-bottom: 4px; font-size: 14px; font-weight: 600; line-height: 20px; }
    .subtle { color: var(--fd-muted); }
    .page-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .grid { display: grid; gap: 18px; }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .split { grid-template-columns: minmax(0, 1.65fr) minmax(290px, .75fr); }
    .card {
      min-width: 0;
      padding: 20px 24px;
      border: 1px solid var(--fd-border);
      border-radius: 13px;
      background: var(--fd-surface);
      box-shadow: var(--fd-shadow-sm);
    }
    .card-head { margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stat { position: relative; overflow: hidden; padding: 16px; }
    .stat-icon {
      width: 38px;
      height: 38px;
      margin-bottom: 14px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--fd-primary);
      background: var(--fd-primary-soft);
      font-weight: 800;
    }
    .stat-value { font-size: 28px; font-weight: 700; line-height: 36px; letter-spacing: -.4px; }
    .stat-label { margin-top: 1px; color: var(--fd-muted); font-size: 13px; line-height: 20px; }
    .trend { margin-top: 10px; color: var(--fd-success); font-size: 11px; font-weight: 700; }
    .chart {
      height: 210px;
      display: flex;
      align-items: flex-end;
      gap: 11px;
      padding: 18px 5px 0;
      border-bottom: 1px solid var(--fd-border);
    }
    .bar-group { height: 100%; flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
    .bar { width: min(18px, 35%); min-height: 5px; border-radius: 5px 5px 0 0; background: var(--fd-primary); }
    .bar.alt { opacity: .32; }
    .chart-labels { display: flex; gap: 11px; padding: 8px 5px 0; }
    .chart-labels span { flex: 1; color: var(--fd-muted); font-size: 10px; text-align: center; }
    .activity-list { display: flex; flex-direction: column; }
    .activity {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 10px;
      padding: 12px 0;
      border-top: 1px solid var(--fd-border);
    }
    .activity:first-child { border-top: 0; padding-top: 0; }
    .activity-dot {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--fd-primary);
      background: var(--fd-primary-soft);
      font-size: 11px;
      font-weight: 800;
    }
    .activity-title { font-size: 12px; font-weight: 700; }
    .activity-copy, .activity-time { color: var(--fd-muted); font-size: 10px; }
    .table-card { padding: 0; overflow: hidden; }
    .table-toolbar { padding: 15px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--fd-border); }
    .filter {
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--fd-border);
      border-radius: 8px;
      color: var(--fd-text-2);
      background: white;
    }
    .table-scroll { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 16px; border-bottom: 1px solid var(--fd-border); text-align: left; white-space: nowrap; }
    th { color: var(--fd-muted); background: var(--fd-surface-2); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--fd-primary-soft); }
    td strong { color: var(--fd-text); font-size: 12px; }
    td small { display: block; margin-top: 2px; color: var(--fd-muted); }
    .pill {
      min-height: 24px;
      padding: 3px 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .015em;
    }
    .pill::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
    .pill.approved, .pill.closed { color: var(--fd-success); background: var(--fd-success-bg); }
    .pill.in_review, .pill.submitted, .pill.fulfilment, .pill.scheduled, .pill.active { color: var(--fd-info); background: var(--fd-info-bg); }
    .pill.sent_back, .pill.draft { color: var(--fd-warning); background: var(--fd-warning-bg); }
    .pill.rejected, .pill.cancelled { color: var(--fd-danger); background: var(--fd-danger-bg); }
    .module-pill { padding: 4px 8px; border-radius: 6px; color: var(--fd-primary); background: var(--fd-primary-soft); font-size: 10px; font-weight: 800; }
    .catalog-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .service-card {
      min-height: 170px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--fd-border);
      border-radius: 13px;
      background: white;
      box-shadow: var(--fd-shadow-sm);
    }
    .service-card:hover { border-color: var(--fd-primary-mid); transform: translateY(-1px); }
    .service-card.disabled { opacity: .56; }
    .service-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--fd-primary);
      background: var(--fd-primary-soft);
      font-size: 17px;
      font-weight: 800;
    }
    .service-title { margin-top: 14px; font-weight: 750; }
    .service-copy { margin-top: 4px; color: var(--fd-muted); font-size: 12px; }
    .service-foot { margin-top: auto; padding-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .board { display: grid; grid-template-columns: repeat(3, minmax(250px, 1fr)); gap: 15px; overflow-x: auto; }
    .board-col { min-width: 250px; padding: 12px; border-radius: 12px; background: var(--fd-surface-2); }
    .board-title { margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; }
    .board-card { margin-top: 9px; padding: 13px; border: 1px solid var(--fd-border); border-radius: 10px; background: white; box-shadow: var(--fd-shadow-sm); }
    .board-card button { margin-top: 11px; }
    .segmented { padding: 3px; display: inline-flex; border-radius: 9px; background: var(--fd-surface-2); }
    .segmented button { height: 30px; padding: 0 10px; border: 0; border-radius: 7px; color: var(--fd-muted); background: transparent; font-size: 11px; font-weight: 700; }
    .segmented button.active { color: var(--fd-primary); background: white; box-shadow: var(--fd-shadow-sm); }
    .timeline { position: relative; display: flex; flex-direction: column; }
    .timeline::before { position: absolute; top: 14px; bottom: 14px; left: 13px; width: 2px; background: var(--fd-border); content: ""; }
    .timeline-item { position: relative; padding: 0 0 22px 40px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot { position: absolute; top: 2px; left: 4px; width: 20px; height: 20px; display: grid; place-items: center; border: 3px solid white; border-radius: 50%; color: white; background: var(--fd-success); box-shadow: 0 0 0 1px var(--fd-border); font-size: 8px; }
    .timeline-item.pending .timeline-dot { background: var(--fd-muted); }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
    .field-label { color: var(--fd-muted); font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .field-value { margin-top: 4px; font-weight: 650; }
    .balance { padding: 16px; border-radius: 12px; background: var(--fd-primary-soft); }
    .balance strong { display: block; font-size: 24px; color: var(--fd-primary); }
    .week-grid { display: grid; grid-template-columns: 1.4fr repeat(5, 1fr) .8fr; }
    .week-grid > div { min-height: 48px; padding: 12px; border-right: 1px solid var(--fd-border); border-bottom: 1px solid var(--fd-border); }
    .week-grid > div:nth-child(-n+7) { background: var(--fd-surface-2); color: var(--fd-muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .week-grid input { width: 100%; border: 0; outline: 0; background: transparent; text-align: center; }
    .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }

    .cal-cell:nth-child(7n) { border-right: 0; }
    .cal-cell.muted { color: var(--fd-muted); background: var(--fd-surface-2); }
    .cal-event { margin-top: 7px; padding: 3px 5px; border-radius: 5px; color: var(--fd-primary); background: var(--fd-primary-soft); font-size: 9px; font-weight: 700; }
    .empty { padding: 46px 20px; text-align: center; }
    .empty-icon { width: 54px; height: 54px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 15px; color: var(--fd-primary); background: var(--fd-primary-soft); font-size: 22px; }
    .module-row { padding: 14px 0; display: flex; align-items: center; gap: 14px; border-top: 1px solid var(--fd-border); }
    .module-row:first-child { border-top: 0; padding-top: 0; }
    .module-meta { min-width: 0; flex: 1; }

    .switch::after { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.18); content: ""; transition: .18s; }

      width: 100%;
      height: 100dvh;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow-y: auto;
      background: var(--fd-bg);
    }
    .login-card {
      width: min(900px, 100%);
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      overflow: hidden;
      border: 1px solid var(--fd-border);
      border-radius: 16px;
      background: white;
      box-shadow: var(--fd-shadow);
    }

    .login-brand p { color: rgba(255,255,255,.78); }

    .form-field { min-width: 0; }
    .form-field.full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 6px; color: var(--fd-text-2); font-size: 12px; font-weight: 700; }
    .input, textarea.input, select.input {
      width: 100%;
      min-height: 40px;
      padding: 9px 11px;
      border: 1px solid var(--fd-border);
      border-radius: 8px;
      color: var(--fd-text);
      background: white;
    }
    textarea.input { min-height: 88px; resize: vertical; }
    .input:focus { border-color: var(--fd-primary); outline: 3px solid var(--fd-primary-soft); }
    .form-hint { margin-top: 5px; color: var(--fd-muted); font-size: 10px; }

      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 22px;
      display: grid;
      place-items: center;
      background: rgba(45, 41, 51, .46);
    }

      width: min(650px, 100%);
      max-height: min(780px, calc(100dvh - 44px));

      flex-direction: column;
      overflow: hidden;
      border-radius: 15px;
      background: white;
      box-shadow: 0 25px 70px rgba(30, 27, 34, .28);
