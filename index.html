      input.setAttribute("aria-invalid", "true");
      error.textContent = "Enter the prototype password.";
      input.focus();
      return;
    }
    const current = state();
    const next = C.deepClone(current);
    const result = C.authenticate(next, username, password);
    next.revision = current.revision + 1;
    try { store.setState(next, current.revision); } catch (storageError) { error.textContent = humanError(storageError); return; }
    if (!result.ok) {
      input.setAttribute("aria-invalid", "true");
      error.textContent = humanError(result.reason);
      input.focus();
      return;
    }
    navigate("dashboard");
    toast(`Welcome, ${result.user.displayName}.`, "success");
  }

  function submitAI(form) {
    const prompt = String(new FormData(form).get("prompt") || "").trim();
    if (!prompt) return;
    runMutation({ eventType: "AI_QUERY", objectType: "AI_CHAT", objectId: C.uid("AI"), authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "AI_QUERY", {}), mutate: (draft, actor) => C.aiReply(draft, actor, prompt), reason: "Scope-safe AI query" });
  }

  function submitDecision(form) {
    const requestId = form.dataset.id;
    const decision = form.dataset.decision;
    const reason = String(new FormData(form).get("reason") || "").trim();
    const request = C.Selectors.request(state(), user(), requestId);
    const taskRow = request ? C.activeTaskForRequest(state(), requestId) : null;
    const result = runMutation({
      eventType: decision, objectType: "REQUEST", objectId: requestId,
      authorize: (draft, actor) => {
        const req = C.requestById(draft, requestId);
        const activeTask = C.activeTaskForRequest(draft, requestId);
        return C.PolicyEngine.canPerformAction(draft, actor, decision, { request: req, task: activeTask });
      },
      snapshot: (draft) => C.requestById(draft, requestId),
      mutate: (draft, actor) => {
        const req = C.requestById(draft, requestId);
        const activeTask = C.activeTaskForRequest(draft, requestId);
        if (decision === "CANCEL") return C.WorkflowEngine.cancel(draft, req, actor, reason, C.uid("IDEM"));
        if (decision === "APPROVE" && req.moduleCode === "EXPENSE" && activeTask?.stepCode === "FINANCE_APPROVAL") {
          C.ModuleServices.EXPENSE.financeReview(req, actor, req.amount, reason);
        }
        return C.WorkflowEngine.decision(draft, req, activeTask, actor, decision, reason, C.uid("IDEM"));
      }
    }, `Request ${labelStatus(decision).toLowerCase()} completed.`);
    if (result) DialogManager.close();
  }

  function addExpenseLine(form) {
    const data = Object.fromEntries(new FormData(form).entries());
    if (!data.categoryCode || !data.merchant || !data.billDate || Number(data.amount) <= 0) return toast("Complete category, merchant, bill date and amount.", "error");
    runtime.wizard.expenseLines.push({ lineId: C.uid("EXL"), categoryCode: data.categoryCode, amount: Number(data.amount), tax: Number(data.tax || 0), billDate: data.billDate, merchant: data.merchant, billNumber: data.billNumber, receiptId: data.receiptId, remarks: data.remarks });
    DialogManager.close();
    render();
  }

  function saveComment(form) {
    const requestId = form.dataset.id;
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "COMMENT_ADD", objectType: "REQUEST", objectId: requestId, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "COMMENT", { request: C.requestById(draft, requestId), visibilityCode: data.visibilityCode }), mutate: (draft, actor) => draft.comments.unshift({ commentId: C.uid("COM"), requestId, authorEmpId: actor.empId, text: data.text.trim(), visibilityCode: data.visibilityCode, createdAt: C.isoNow(draft) }) }, "Comment added.");
    if (result !== null) DialogManager.close();
  }

  function saveAttachment(form) {
    const requestId = form.dataset.id;
    const data = Object.fromEntries(new FormData(form).entries());
    const validation = C.validateAttachment(data);
    if (!validation.valid) return toast(humanError(validation.reason), "error");
    const result = runMutation({ eventType: "ATTACHMENT_ADD", objectType: "REQUEST", objectId: requestId, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "ATTACH", { request: C.requestById(draft, requestId) }), mutate: (draft, actor) => draft.attachments.unshift({ attachmentId: C.uid("ATT"), requestId, fileName: data.fileName, extension: validation.extension, mimeType: data.mimeType, sizeBytes: Number(data.sizeBytes), visibilityCode: data.visibilityCode, uploaderUserId: actor.userId, createdAt: C.isoNow(draft), contentStored: false }) }, "Attachment metadata added.");
    if (result !== null) DialogManager.close();
  }

  function openNewDelegationDialog() {
    const candidates = Object.values(C.USERS).filter((item) => item.active && item.empId !== user().empId);
    DialogManager.open(51, "New Delegation", "User-owned, dated task coverage with overlap and cycle checks.", `<form id="newDelegationForm"><div class="modal-body"><div class="form-grid">${selectField("Delegate", "toEmpId", candidates.map((item) => item.empId))}${selectField("Module", "moduleCode", ["ALL", ...C.MODULE_CODES])}${textField("Start date", "startDate", C.dateOnly(state()), "date")}${textField("End date", "endDate", "2026-08-05", "date")}<div class="form-field full"><label for="newDelegateReason">Reason<span class="required-mark">*</span></label><textarea class="input" id="newDelegateReason" name="reason" required></textarea></div></div></div></form>`, '<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit" form="newDelegationForm">Create delegation</button>');
  }

  function saveDelegation(form) {
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "DELEGATION_CREATE", objectType: "DELEGATION", objectId: "NEW", authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "CREATE_DELEGATION", {}), mutate: (draft, actor) => C.createDelegation(draft, actor, { toEmpId: Number(data.toEmpId), moduleCode: data.moduleCode === "ALL" ? null : data.moduleCode, scopeCode: "TASK", startDate: data.startDate, endDate: data.endDate, reason: data.reason }) }, "Delegation created.");
    if (result) DialogManager.close();
  }

  function saveLeaveAdjustment(form) {
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "LEAVE_BALANCE_ADJUST", objectType: "LEAVE_BALANCE", objectId: `${data.empId}:${data.leaveTypeCode}`, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "ADJUST_LEAVE", {}), mutate: (draft, actor) => C.ModuleServices.LEAVE.adjustBalance(draft, Number(data.empId), data.leaveTypeCode, Number(data.delta), data.reason, actor) }, "Leave ledger adjustment posted.");
    if (result) DialogManager.close();
  }

  function submitTimesheet() {
    const sheet = currentTimesheet();
    const result = runMutation({ eventType: "TIMESHEET_SUBMIT", objectType: "TIMESHEET", objectId: sheet.timesheetId, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "EDIT_TIMESHEET", { empId: actor.empId, timesheet: draft.timesheets[`${actor.empId}:2026-W31`] }) && C.PolicyEngine.canPerformAction(draft, actor, "CREATE_REQUEST", { moduleCode: "TIMESHEET" }), mutate: (draft, actor) => { const request = C.createDraft(draft, actor, { moduleCode: "TIMESHEET", requestTypeCode: "WEEKLY", title: `Timesheet — ${sheet.periodId}`, summary: "Weekly timesheet submission", details: { periodId: sheet.periodId, timesheetId: sheet.timesheetId } }); C.WorkflowEngine.submit(draft, request, actor, C.uid("IDEM")); return request; } }, "Timesheet submitted and locked.");
    if (result) DialogManager.close();
  }

  function startFulfillment(requestId) {
    return runMutation({ eventType: "START_FULFILLMENT", objectType: "REQUEST", objectId: requestId, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "START_FULFILLMENT", { request: C.requestById(draft, requestId) }), mutate: (draft, actor) => C.WorkflowEngine.startFulfillment(draft, C.requestById(draft, requestId), actor, C.uid("IDEM")) }, "Fulfillment task created.");
  }

  function saveAssetFulfillment(form) {
    const requestId = form.dataset.id;
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "ASSET_FULFILLMENT", objectType: "REQUEST", objectId: requestId, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "MANAGE_ASSET", { request: C.requestById(draft, requestId), task: C.activeTaskForRequest(draft, requestId) }), mutate: (draft, actor) => { const request = C.requestById(draft, requestId); if (request.details.requestKind === "RETURN") C.ModuleServices.ASSET.completeReturn(draft, request, actor, data.conditionCode); else C.ModuleServices.ASSET.issue(draft, request, actor, data.assetId, data.conditionCode, data.proofAttachmentId); return C.WorkflowEngine.closeFulfillment(draft, request, C.activeTaskForRequest(draft, requestId), actor, { note: "Asset physical action completed" }, C.uid("IDEM")); } }, "Asset allocation and request updated atomically.");
    if (result) DialogManager.close();
  }

  function saveTicketAssignment(form) {
    const requestId = form.dataset.id;
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "ITSM_ASSIGN", objectType: "REQUEST", objectId: requestId, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "MANAGE_ITSM", { request: C.requestById(draft, requestId) }), mutate: (draft) => { const request = C.requestById(draft, requestId); const taskRow = C.activeTaskForRequest(draft, requestId); request.details.supportGroup = data.supportGroup; request.priorityCode = data.priorityCode; request.ownerEmpId = Number(data.ownerEmpId); taskRow.actualOwnerEmpId = Number(data.ownerEmpId); taskRow.potentialOwnerEmpIds = [Number(data.ownerEmpId)]; } }, "Ticket assignment updated.");
    if (result !== null) DialogManager.close();
  }

  function openWorklogDialog(requestId) {
    DialogManager.open(59, "Add IT Worklog", "Internal/public note and time spent.", `<form id="worklogForm" data-id="${requestId}"><div class="modal-body"><div class="form-grid"><div class="form-field full"><label for="worklogNote">Work note<span class="required-mark">*</span></label><textarea class="input" id="worklogNote" name="note" required></textarea></div>${selectField("Visibility", "visibility", ["INTERNAL", "PUBLIC"])}${textField("Minutes", "minutes", "30", "number")}</div></div></form>`, '<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit" form="worklogForm">Add worklog</button>');
  }

  function saveWorklog(form) {
    const requestId = form.dataset.id;
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "ITSM_WORKLOG_ADD", objectType: "REQUEST", objectId: requestId, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "MANAGE_ITSM", { request: C.requestById(draft, requestId) }), mutate: (draft, actor) => C.ModuleServices.ITSM.addWorklog(draft, C.requestById(draft, requestId), actor, data.note, data.visibility, Number(data.minutes)) }, "Worklog added.");
    if (result !== null) DialogManager.close();
  }

  function openResolveDialog(requestId) {
    DialogManager.open(59, "Resolve IT Ticket", "Resolution code and explanation are required.", `<form id="resolveForm" data-id="${requestId}"><div class="modal-body"><div class="form-grid">${selectField("Resolution code", "resolutionCode", ["RESOLVED", "WORKAROUND", "DUPLICATE", "NOT_REPRODUCED"])}<div class="form-field full"><label for="resolutionText">Resolution<span class="required-mark">*</span></label><textarea class="input" id="resolutionText" name="resolutionText" required></textarea></div></div></div></form>`, '<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit" form="resolveForm">Resolve and close</button>');
  }

  function saveResolution(form) {
    const requestId = form.dataset.id;
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "ITSM_RESOLVE", objectType: "REQUEST", objectId: requestId, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "RESOLVE", { request: C.requestById(draft, requestId), task: C.activeTaskForRequest(draft, requestId) }), mutate: (draft, actor) => C.WorkflowEngine.closeFulfillment(draft, C.requestById(draft, requestId), C.activeTaskForRequest(draft, requestId), actor, { resolutionCode: data.resolutionCode, resolutionText: data.resolutionText, note: data.resolutionText }, C.uid("IDEM")) }, "Ticket resolved and requester notified.");
    if (result) DialogManager.close();
  }

  function openReopenDialog(requestId) {
    DialogManager.open(59, "Reopen IT Ticket", "Reopen is available to the requester within policy.", `<form id="reopenForm" data-id="${requestId}"><div class="modal-body"><div class="form-field"><label for="reopenReason">Reason<span class="required-mark">*</span></label><textarea class="input" id="reopenReason" name="reason" required></textarea></div></div></form>`, '<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit" form="reopenForm">Reopen ticket</button>', true);
  }

  function saveReopen(form) {
    const requestId = form.dataset.id;
    const reason = String(new FormData(form).get("reason") || "");
    const result = runMutation({ eventType: "ITSM_REOPEN", objectType: "REQUEST", objectId: requestId, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "ITSM_REOPEN", { request: C.requestById(draft, requestId) }), mutate: (draft, actor) => C.ModuleServices.ITSM.reopen(draft, C.requestById(draft, requestId), actor, reason) }, "Ticket reopened.");
    if (result !== null) DialogManager.close();
  }

  function openRatingDialog(requestId) {
    DialogManager.open(59, "Rate IT Service", "Requester feedback can be recorded once.", `<form id="ratingForm" data-id="${requestId}"><div class="modal-body">${selectField("Rating", "rating", ["5", "4", "3", "2", "1"])}</div></form>`, '<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit" form="ratingForm">Save rating</button>', true);
  }

  function saveRating(form) {
    const requestId = form.dataset.id;
    const rating = Number(new FormData(form).get("rating"));
    const result = runMutation({ eventType: "ITSM_RATE", objectType: "REQUEST", objectId: requestId, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "ITSM_RATE", { request: C.requestById(draft, requestId) }), mutate: (draft, actor) => C.ModuleServices.ITSM.rate(draft, C.requestById(draft, requestId), actor, rating) }, "Service rating saved.");
    if (result !== null) DialogManager.close();
  }

  function openSettlementDialog(requestId) {
    const request = C.Selectors.request(state(), user(), requestId);
    DialogManager.open(57, "Expense Settlement", `${request.requestNumber} · Finance-only payment record`, `<form id="settlementForm" data-id="${requestId}"><div class="modal-body"><div class="form-grid">${textField("Paid amount", "paidAmount", request.amount, "number")}${textField("Paid date", "paidDate", C.dateOnly(state()), "date")}${textField("Payment reference", "paymentReference", "")}</div></div></form>`, '<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit" form="settlementForm">Record payment & close</button>');
  }

  function saveSettlement(form) {
    const requestId = form.dataset.id;
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "EXPENSE_SETTLE", objectType: "REQUEST", objectId: requestId, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "MANAGE_EXPENSE", { request: C.requestById(draft, requestId), task: C.activeTaskForRequest(draft, requestId) }), mutate: (draft, actor) => C.WorkflowEngine.closeFulfillment(draft, C.requestById(draft, requestId), C.activeTaskForRequest(draft, requestId), actor, { paidAmount: Number(data.paidAmount), paidDate: data.paidDate, paymentReference: data.paymentReference, note: `Settlement ${data.paymentReference}` }, C.uid("IDEM")) }, "Expense settled and closed.");
    if (result) DialogManager.close();
  }

  function saveConfig(form) {
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "CONFIG_UPDATE", objectType: "CONFIG", objectId: data.key, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "CONFIGURE", {}), snapshot: (draft) => draft.config[data.key], mutate: (draft) => { const current = draft.config[data.key]; let value = data.value; if (data.dataType === "NUMBER") value = Number(value); if (data.dataType === "BOOLEAN") value = /^(true|y|1)$/i.test(value); draft.config[data.key] = { key: data.key, dataType: data.dataType, value, scopeCode: data.scopeCode, scopeId: data.scopeId || null, moduleCode: data.moduleCode === "PLATFORM" ? null : data.moduleCode, description: data.description || current.description, protected: current.protected }; } }, "Configuration updated and live behavior refreshed.");
    if (result !== null) DialogManager.close();
  }

  function saveLookup(form) {
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "LOOKUP_CREATE", objectType: "LOOKUP", objectId: `${data.typeCode}:${data.code}`, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "CONFIGURE", {}), mutate: (draft) => { if (draft.lookups.some((item) => item.typeCode === data.typeCode && item.code === data.code)) throw new Error("LOOKUP_DUPLICATE"); draft.lookups.push({ lookupId: `${data.typeCode}:${data.code}`, typeCode: data.typeCode, code: data.code, label: data.label, moduleCode: data.moduleCode, parentCode: data.parentCode || null, sortOrder: Number(data.sortOrder), active: true, system: false }); } }, "Lookup added and forms refreshed.");
    if (result !== null) DialogManager.close();
  }

  function saveRoleMatrix(form) {
    const data = Object.fromEntries(new FormData(form).entries());
    if (data.roleCode === "SYS" && data.scopeCode !== "F") return toast("SYS full-administration safeguard cannot be removed.", "error");
    if (["LEAD", "AUD"].includes(data.roleCode) && !["N", "R", "G"].includes(data.scopeCode)) return toast("LEAD/AUD remain read-only by protected action policy.", "error");
    const result = runMutation({ eventType: "ROLE_ROUTE_UPDATE", objectType: "ROLE_POLICY", objectId: `${data.roleCode}:${data.routeName}`, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "CONFIGURE", {}), mutate: (draft) => { draft.rolePolicy[data.routeName].scopes[data.roleCode] = data.scopeCode; } }, "Route matrix updated.");
    if (result !== null) DialogManager.close();
  }

  function saveWorkflowRule(form) {
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "WORKFLOW_RULE_CREATE", objectType: "WORKFLOW_RULE", objectId: data.name, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "CONFIGURE", {}), mutate: (draft) => draft.workflowRules.push({ ruleId: C.uid("RULE"), moduleCode: data.moduleCode, name: data.name, priority: Number(data.priority), version: Number(data.version), effectiveFrom: C.dateOnly(draft), active: true, conditions: [], steps: [{ code: data.stepCode, ownerType: data.taskType === "ACTION" ? "MODULE_OWNER" : "MANAGER", taskType: data.taskType, slaHours: 16 }] }) }, "Versioned workflow rule saved.");
    if (result !== null) DialogManager.close();
  }

  function saveArticle(form) {
    const data = Object.fromEntries(new FormData(form).entries());
    const result = runMutation({ eventType: "KNOWLEDGE_CREATE", objectType: "ARTICLE", objectId: data.title, authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "CONFIGURE", {}), mutate: (draft) => draft.knowledge.push({ articleId: C.uid("KB"), title: data.title, summary: data.summary, moduleCode: data.moduleCode === "PLATFORM" ? null : data.moduleCode, audienceRoles: data.audienceRoles.split(",").map((item) => item.trim()).filter((item) => C.ROLE_CODES.includes(item)), version: Number(data.version), statusCode: data.statusCode, body: data.body }) }, "Policy article saved.");
    if (result !== null) DialogManager.close();
  }

  function saveProfile() {
    const form = document.getElementById("profileForm");
    if (!form) return;
    const displayName = String(new FormData(form).get("displayName") || "").trim();
    if (!displayName) return toast("Display name is required.", "error");
    runMutation({ eventType: "PROFILE_UPDATE", objectType: "EMPLOYEE", objectId: String(user().empId), authorize: (draft, actor) => C.PolicyEngine.canPerformAction(draft, actor, "UPDATE_PROFILE", {}), mutate: (draft, actor) => { draft.profileOverrides[String(actor.empId)] = Object.assign({}, draft.profileOverrides[String(actor.empId)] || {}, { displayName }); } }, "Display preference saved without changing identity links.");
  }

  function logout() {
    DialogManager.close(false);
    commitDirect((draft) => { draft.loggedIn = false; });
    location.hash = "#/login";
    render();
  }

  function confirmReset() {
    if (!C.PolicyEngine.canPerformAction(state(), user(), "RESET_DEMO", {})) return toast("Only System Administrator can reset demo data.", "error");
    DialogManager.open(27, "Reset all prototype data?", "This explicit prototype-only action erases browser audit and business state.", '<div class="modal-body"><div class="notice-bar danger"><b>!</b><span>This cannot be undone in the browser. Production audit is never reset by a business UI.</span></div></div>', '<button class="btn" data-action="close-modal" data-initial-focus>Cancel</button><button class="btn btn-danger" data-action="execute-reset">Reset prototype</button>', true);
  }

  document.addEventListener("click", (event) => {
    const target = event.target.closest('[data-action="execute-reset"]');
    if (!target) return;
    try {
      if (!C.PolicyEngine.canPerformAction(state(), user(), "RESET_DEMO", {})) throw new Error("AUTHORIZATION_DENIED");
      store.reset();
      DialogManager.close(false);
      location.hash = "#/login";
      render();
      toast("Prototype reset to deterministic seed.", "success");
    } catch (error) { toast(humanError(error), "error"); }
  });

  document.addEventListener("keydown", (event) => {
    DialogManager.trap(event);
    if (event.key === "Escape" && runtime.modal) { event.preventDefault(); DialogManager.close(); return; }
    if (event.key === "Enter" && event.target.id === "globalSearch") { event.preventDefault(); searchDialog(event.target.value); }
  });

  window.addEventListener("hashchange", render);
  window.addEventListener("error", (event) => runtime.consoleErrors.push(String(event.error?.stack || event.message)));
  window.addEventListener("unhandledrejection", (event) => runtime.consoleErrors.push(String(event.reason?.stack || event.reason)));
  store.subscribe(() => {});

  window.FlowDeskTest = Object.freeze({
    Core: C,
    store,
    runtime,
    render,
    navigate,
    reset() {
      window.localStorage.removeItem(C.STORAGE_KEY);
      store.state = C.seedState();
      render();
    },
    login(username, password) {
      const current = state();
      const next = C.deepClone(current);
      const result = C.authenticate(next, username, password);
      next.revision = current.revision + 1;
      store.setState(next, current.revision);
      render();
      return result;
    },
    openModal,
    closeModal: () => DialogManager.close(),
    consoleErrors: runtime.consoleErrors
  });

  render();
})();

  </script>
</body>
</html>
