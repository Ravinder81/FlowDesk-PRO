<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FlowDesk PRO complete responsive working prototype">
  <title>FlowDesk PRO — Complete Working Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fd-primary: #6e39cb;
      --fd-primary-hover: #5a2da8;
      --fd-primary-soft: #f0e9fe;
      --fd-primary-mid: #deccfe;
      --fd-bg: #f4f5f9;
      --fd-surface: #ffffff;
      --fd-surface-2: #f8f8fb;
      --fd-border: #e7e8eb;
      --fd-text: #3a3541;
      --fd-text-2: #534e59;
      --fd-muted: #8f8b95;
      --fd-success: #16875f;
      --fd-success-bg: #e9f7f1;
      --fd-warning: #b66c10;
      --fd-warning-bg: #fdf4e7;
      --fd-danger: #dc3535;
      --fd-danger-bg: #feecec;
      --fd-info: #245fcc;
      --fd-info-bg: #eaf2ff;
      --fd-sidebar: 240px;
      --fd-topbar: 64px;
      --fd-shadow: 0 10px 30px rgba(58, 53, 65, .12);
      --fd-shadow-sm: 0 1px 3px rgba(58, 53, 65, .08);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--fd-text);
      background: var(--fd-bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid var(--fd-primary-mid);
      outline-offset: 2px;
    }
    .hidden { display: none !important; }
    .app { width: 100%; height: 100dvh; display: grid; grid-template-columns: var(--fd-sidebar) minmax(0, 1fr); }
    .sidebar {
      position: relative;
      z-index: 40;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--fd-surface);
      border-right: 1px solid var(--fd-border);
    }
    .brand {
      min-height: var(--fd-topbar);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      border-bottom: 1px solid var(--fd-border);
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: white;
      background: var(--fd-primary);
      font-size: 15px;
      font-weight: 800;
    }
    .brand-name { font-size: 17px; font-weight: 600; letter-spacing: -.2px; }
    .pro-badge {
      padding: 2px 6px;
      color: var(--fd-primary);
      background: var(--fd-primary-soft);
      border-radius: 5px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .nav-scroll { min-height: 0; flex: 1; overflow-y: auto; padding: 12px 10px 20px; }
    .nav-section + .nav-section { margin-top: 20px; }
    .nav-label {
      margin: 0 10px 7px;
      color: var(--fd-muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .nav-label:empty { display: none; }
    .nav-link {
      width: 100%;
      height: 40px;
      margin: 2px 0;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 0;
      border-radius: 10px;
      color: var(--fd-text-2);
      background: transparent;
      font-size: 15px;
      line-height: 24px;
      text-align: left;
    }
    .nav-link:hover { color: var(--fd-primary); background: var(--fd-primary-soft); }
    .nav-link.active { color: var(--fd-primary); background: var(--fd-primary-mid); font-weight: 500; }
    .nav-icon { width: 22px; display: grid; place-items: center; color: inherit; }
    .nav-icon svg { display: block; }
    .nav-count {
      min-width: 22px;
      margin-left: auto;
      padding: 1px 7px;
      border-radius: 999px;
      color: white;
      background: var(--fd-primary);
      font-size: 11px;
      text-align: center;
    }
    .nav-off {
      margin-left: auto;
      padding: 2px 6px;
      border-radius: 5px;
      color: var(--fd-muted);
      background: var(--fd-surface-2);
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .sidebar-profile {
      margin: 10px;
      padding: 11px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--fd-primary);
    }
    .avatar {
      width: 36px;
      height: 36px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--fd-primary);
      background: var(--fd-primary-mid);
      font-size: 12px;
      font-weight: 800;
    }
    .profile-text { min-width: 0; flex: 1; }
    .profile-name, .profile-role { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile-name { color: white; font-size: 12px; font-weight: 600; }
    .profile-role { margin-top: 1px; color: rgba(255,255,255,.72); font-size: 10px; }
    .sidebar-profile .avatar { color: white; background: rgba(255,255,255,.22); }
    .shell { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .topbar {
      min-height: var(--fd-topbar);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      background: var(--fd-surface);
      border-bottom: 1px solid var(--fd-border);
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      flex: none;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--fd-text-2);
      background: transparent;
      font-size: 17px;
    }
    .icon-btn:hover { color: var(--fd-primary); background: var(--fd-primary-soft); }
    .menu-btn { display: none; }
    .search-box {
      width: min(420px, 36vw);
      height: 40px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--fd-bg);
    }
    .search-box:focus-within { border-color: var(--fd-primary); background: white; }
    .search-box span { color: var(--fd-muted); }
    .search-box input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--fd-text); background: transparent; }
    .search-box input { font-size: 15px; line-height: 24px; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .demo-select {
      height: 38px;
      max-width: 170px;
      padding: 0 31px 0 11px;
      border: 1px solid var(--fd-border);
      border-radius: 9px;
      color: var(--fd-text-2);
      background: white;
    }
    .btn {
      min-height: 40px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--fd-border);
      border-radius: 8px;
      color: var(--fd-text-2);
      background: white;
      font-size: 15px;
      line-height: 24px;
      font-weight: 500;
    }
    .btn:hover { border-color: var(--fd-primary-mid); color: var(--fd-primary); background: var(--fd-primary-soft); }
    .btn-primary { border-color: var(--fd-primary); color: white; background: var(--fd-primary); }
    .btn-primary:hover { border-color: var(--fd-primary-hover); color: white; background: var(--fd-primary-hover); }
    .btn-danger { border-color: var(--fd-danger); color: white; background: var(--fd-danger); }
    .btn-danger:hover { border-color: #bc2828; color: white; background: #bc2828; }
    .btn-soft { border-color: transparent; color: var(--fd-primary); background: var(--fd-primary-soft); }
    .btn-sm { min-height: 32px; padding: 4px 10px; border-radius: 8px; font-size: 13px; line-height: 20px; }
    .notification-wrap { position: relative; }
    .profile-top { width: 36px; height: 36px; border-radius: 50%; color: var(--fd-primary); background: var(--fd-primary-mid); font-size: 12px; font-weight: 600; }
    .notification-dot {
      position: absolute;
      top: 4px;
      right: 3px;
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border: 2px solid white;
      border-radius: 999px;
      color: white;
      background: var(--fd-danger);
      font-size: 8px;
      font-weight: 800;
    }
    .content { min-height: 0; flex: 1; overflow: auto; scroll-behavior: smooth; }
    .page { width: min(1440px, 100%); min-height: 100%; margin: 0 auto; padding: 24px 32px 40px; }
    .page-head {
      margin-bottom: 22px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
    }
    .breadcrumb { margin-bottom: 6px; color: var(--fd-muted); font-size: 12px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 4px; font-size: 28px; font-weight: 600; line-height: 36px; letter-spacing: -.3px; }
    h2 { margin-bottom: 4px; font-size: 16px; font-weight: 600; line-height: 24px; }
    h3 { margin-bottom: 4px; font-size: 14px; font-weight: 600; line-height: 20px; }
    .subtle { color: var(--fd-muted); }
    .page-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .grid { display: grid; gap: 18px; }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .split { grid-template-columns: minmax(0, 1.65fr) minmax(290px, .75fr); }
    .card {
      min-width: 0;
      padding: 20px 24px;
      border: 1px solid var(--fd-border);
      border-radius: 13px;
      background: var(--fd-surface);
      box-shadow: var(--fd-shadow-sm);
    }
    .card-head { margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stat { position: relative; overflow: hidden; padding: 16px; }
    .stat-icon {
      width: 38px;
      height: 38px;
      margin-bottom: 14px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--fd-primary);
      background: var(--fd-primary-soft);
      font-weight: 800;
    }
    .stat-value { font-size: 28px; font-weight: 700; line-height: 36px; letter-spacing: -.4px; }
    .stat-label { margin-top: 1px; color: var(--fd-muted); font-size: 13px; line-height: 20px; }
    .trend { margin-top: 10px; color: var(--fd-success); font-size: 11px; font-weight: 700; }
    .chart {
      height: 210px;
      display: flex;
      align-items: flex-end;
      gap: 11px;
      padding: 18px 5px 0;
      border-bottom: 1px solid var(--fd-border);
    }
    .bar-group { height: 100%; flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
    .bar { width: min(18px, 35%); min-height: 5px; border-radius: 5px 5px 0 0; background: var(--fd-primary); }
    .bar.alt { opacity: .32; }
    .chart-labels { display: flex; gap: 11px; padding: 8px 5px 0; }
    .chart-labels span { flex: 1; color: var(--fd-muted); font-size: 10px; text-align: center; }
    .activity-list { display: flex; flex-direction: column; }
    .activity {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 10px;
      padding: 12px 0;
      border-top: 1px solid var(--fd-border);
    }
    .activity:first-child { border-top: 0; padding-top: 0; }
    .activity-dot {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--fd-primary);
      background: var(--fd-primary-soft);
      font-size: 11px;
      font-weight: 800;
    }
    .activity-title { font-size: 12px; font-weight: 700; }
    .activity-copy, .activity-time { color: var(--fd-muted); font-size: 10px; }
    .table-card { padding: 0; overflow: hidden; }
    .table-toolbar { padding: 15px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--fd-border); }
    .filter {
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--fd-border);
      border-radius: 8px;
      color: var(--fd-text-2);
      background: white;
    }
    .table-scroll { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 16px; border-bottom: 1px solid var(--fd-border); text-align: left; white-space: nowrap; }
    th { color: var(--fd-muted); background: var(--fd-surface-2); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--fd-primary-soft); }
    td strong { color: var(--fd-text); font-size: 12px; }
    td small { display: block; margin-top: 2px; color: var(--fd-muted); }
    .pill {
      min-height: 24px;
      padding: 3px 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .015em;
    }
    .pill::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
    .pill.approved, .pill.closed { color: var(--fd-success); background: var(--fd-success-bg); }
    .pill.in_review, .pill.submitted, .pill.fulfilment, .pill.scheduled, .pill.active { color: var(--fd-info); background: var(--fd-info-bg); }
    .pill.sent_back, .pill.draft { color: var(--fd-warning); background: var(--fd-warning-bg); }
    .pill.rejected, .pill.cancelled { color: var(--fd-danger); background: var(--fd-danger-bg); }
    .module-pill { padding: 4px 8px; border-radius: 6px; color: var(--fd-primary); background: var(--fd-primary-soft); font-size: 10px; font-weight: 800; }
    .catalog-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .service-card {
      min-height: 170px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--fd-border);
      border-radius: 13px;
      background: white;
      box-shadow: var(--fd-shadow-sm);
    }
    .service-card:hover { border-color: var(--fd-primary-mid); transform: translateY(-1px); }
    .service-card.disabled { opacity: .56; }
    .service-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--fd-primary);
      background: var(--fd-primary-soft);
      font-size: 17px;
      font-weight: 800;
    }
    .service-title { margin-top: 14px; font-weight: 750; }
    .service-copy { margin-top: 4px; color: var(--fd-muted); font-size: 12px; }
    .service-foot { margin-top: auto; padding-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .board { display: grid; grid-template-columns: repeat(3, minmax(250px, 1fr)); gap: 15px; overflow-x: auto; }
    .board-col { min-width: 250px; padding: 12px; border-radius: 12px; background: #eceef4; }
    .board-title { margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; }
    .board-card { margin-top: 9px; padding: 13px; border: 1px solid var(--fd-border); border-radius: 10px; background: white; box-shadow: var(--fd-shadow-sm); }
    .board-card button { margin-top: 11px; }
    .segmented { padding: 3px; display: inline-flex; border-radius: 9px; background: var(--fd-surface-2); }
    .segmented button { height: 30px; padding: 0 10px; border: 0; border-radius: 7px; color: var(--fd-muted); background: transparent; font-size: 11px; font-weight: 700; }
    .segmented button.active { color: var(--fd-primary); background: white; box-shadow: var(--fd-shadow-sm); }
    .timeline { position: relative; display: flex; flex-direction: column; }
    .timeline::before { position: absolute; top: 14px; bottom: 14px; left: 13px; width: 2px; background: var(--fd-border); content: ""; }
    .timeline-item { position: relative; padding: 0 0 22px 40px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot { position: absolute; top: 2px; left: 4px; width: 20px; height: 20px; display: grid; place-items: center; border: 3px solid white; border-radius: 50%; color: white; background: var(--fd-success); box-shadow: 0 0 0 1px var(--fd-border); font-size: 8px; }
    .timeline-item.pending .timeline-dot { background: var(--fd-muted); }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
    .field-label { color: var(--fd-muted); font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .field-value { margin-top: 4px; font-weight: 650; }
    .balance { padding: 16px; border-radius: 12px; background: var(--fd-primary-soft); }
    .balance strong { display: block; font-size: 24px; color: var(--fd-primary); }
    .week-grid { display: grid; grid-template-columns: 1.4fr repeat(5, 1fr) .8fr; }
    .week-grid > div { min-height: 48px; padding: 12px; border-right: 1px solid var(--fd-border); border-bottom: 1px solid var(--fd-border); }
    .week-grid > div:nth-child(-n+7) { background: var(--fd-surface-2); color: var(--fd-muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .week-grid input { width: 100%; border: 0; outline: 0; background: transparent; text-align: center; }
    .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .cal-cell { min-height: 82px; padding: 9px; border-right: 1px solid var(--fd-border); border-bottom: 1px solid var(--fd-border); background: white; font-size: 11px; }
    .cal-cell:nth-child(7n) { border-right: 0; }
    .cal-cell.muted { color: #bcb9c0; background: var(--fd-surface-2); }
    .cal-event { margin-top: 7px; padding: 3px 5px; border-radius: 5px; color: var(--fd-primary); background: var(--fd-primary-soft); font-size: 9px; font-weight: 700; }
    .empty { padding: 46px 20px; text-align: center; }
    .empty-icon { width: 54px; height: 54px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 15px; color: var(--fd-primary); background: var(--fd-primary-soft); font-size: 22px; }
    .module-row { padding: 14px 0; display: flex; align-items: center; gap: 14px; border-top: 1px solid var(--fd-border); }
    .module-row:first-child { border-top: 0; padding-top: 0; }
    .module-meta { min-width: 0; flex: 1; }
    .switch { position: relative; width: 43px; height: 24px; flex: none; border: 0; border-radius: 999px; background: #cacbd2; }
    .switch::after { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.18); content: ""; transition: .18s; }
    .switch.on { background: var(--fd-success); }
    .switch.on::after { transform: translateX(19px); }
    .callout { padding: 14px 16px; display: flex; gap: 11px; border: 1px solid var(--fd-primary-mid); border-radius: 11px; color: var(--fd-text-2); background: var(--fd-primary-soft); }
    .callout.warning { border-color: #f1d4a9; background: var(--fd-warning-bg); }

    .messages { min-height: 0; flex: 1; overflow-y: auto; padding: 4px; }
    .message { max-width: min(680px, 86%); margin: 10px 0; padding: 12px 14px; border-radius: 12px 12px 12px 3px; background: var(--fd-surface-2); }
    .message.user { margin-left: auto; border-radius: 12px 12px 3px 12px; color: white; background: var(--fd-primary); }
    .chat-input { padding-top: 12px; display: flex; gap: 8px; border-top: 1px solid var(--fd-border); }
    .chat-input input { min-width: 0; flex: 1; height: 40px; padding: 0 12px; border: 1px solid var(--fd-border); border-radius: 9px; }
    .login {
      width: 100%;
      height: 100dvh;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow-y: auto;
      background: var(--fd-bg);
    }
    .login-card {
      width: min(900px, 100%);
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      overflow: hidden;
      border: 1px solid var(--fd-border);
      border-radius: 16px;
      background: white;
      box-shadow: var(--fd-shadow);
    }
    .login-brand { padding: 44px 36px; color: white; background: var(--fd-primary); }
    .login-brand h1 { margin-top: 55px; font-size: 30px; color: white; }
    .login-brand p { color: rgba(255,255,255,.78); }
    .login-form { padding: 44px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .form-field { min-width: 0; }
    .form-field.full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 6px; color: var(--fd-text-2); font-size: 12px; font-weight: 700; }
    .input, textarea.input, select.input {
      width: 100%;
      min-height: 40px;
      padding: 9px 11px;
      border: 1px solid var(--fd-border);
      border-radius: 8px;
      color: var(--fd-text);
      background: white;
    }
    textarea.input { min-height: 88px; resize: vertical; }
    .input:focus { border-color: var(--fd-primary); outline: 3px solid var(--fd-primary-soft); }
    .form-hint { margin-top: 5px; color: var(--fd-muted); font-size: 10px; }
    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 22px;
      display: grid;
      place-items: center;
      background: rgba(45, 41, 51, .46);
    }
    .modal {
      width: min(650px, 100%);
      max-height: min(780px, calc(100dvh - 44px));
      display: flex;

                </div>`).join("") : `<div class="empty"><div class="empty-icon">✓</div><h2>All caught up</h2><div class="subtle">No requests are waiting for your action.</div></div>`}
              </div>
            </section>
            <aside class="card status-card">
                <div class="card-head"><h2>Request Status Mix</h2></div>
                <div class="status-ring-wrap">
                  <svg width="150" height="150" viewBox="0 0 164 164" aria-label="Request status chart"><g transform="rotate(-90 82 82)"><circle cx="82" cy="82" r="60" fill="none" stroke="#22A06B" stroke-width="22" stroke-dasharray="152.4 377"></circle><circle cx="82" cy="82" r="60" fill="none" stroke="#E8A33D" stroke-width="22" stroke-dasharray="80.2 377" stroke-dashoffset="-152.4"></circle><circle cx="82" cy="82" r="60" fill="none" stroke="#2DCCFF" stroke-width="22" stroke-dasharray="64.1 377" stroke-dashoffset="-232.6"></circle><circle cx="82" cy="82" r="60" fill="none" stroke="#6E39CB" stroke-width="22" stroke-dasharray="48.1 377" stroke-dashoffset="-296.7"></circle><circle cx="82" cy="82" r="60" fill="none" stroke="#F93131" stroke-width="22" stroke-dasharray="32.2 377" stroke-dashoffset="-344.8"></circle></g></svg>
                  <div class="status-ring-label"><strong>${state.requests.length}</strong><span class="subtle">requests</span></div>
                </div>
                <div class="status-legend">
                  <div class="status-legend-row"><span class="legend-dot" style="background:#22A06B"></span>Approved<strong>${approved}</strong></div>
                  <div class="status-legend-row"><span class="legend-dot" style="background:#E8A33D"></span>In Review<strong>${state.requests.filter(r => r.status === "IN_REVIEW").length}</strong></div>
                  <div class="status-legend-row"><span class="legend-dot" style="background:#2DCCFF"></span>Submitted<strong>${state.requests.filter(r => r.status === "SUBMITTED").length}</strong></div>
                  <div class="status-legend-row"><span class="legend-dot" style="background:#6E39CB"></span>Fulfilment<strong>${state.requests.filter(r => r.status === "FULFILMENT").length}</strong></div>
                </div>
            </aside>
          </div>
          <div class="card trend-card">
            <div class="card-head"><h2>Requests Over Time</h2></div>
            <svg width="100%" height="180" viewBox="0 0 400 150" preserveAspectRatio="none" style="display:block"><line x1="0" y1="10" x2="400" y2="10" stroke="#EDEEF2"></line><line x1="0" y1="70" x2="400" y2="70" stroke="#EDEEF2"></line><line x1="0" y1="140" x2="400" y2="140" stroke="#E7E8EB"></line><path d="M0,110 C60,96 110,66 170,74 C230,82 290,44 400,40 L400,140 L0,140 Z" fill="#6E39CB" opacity="0.10"></path><path d="M0,110 C60,96 110,66 170,74 C230,82 290,44 400,40" fill="none" stroke="#6E39CB" stroke-width="2.5" vector-effect="non-scaling-stroke"></path></svg>
            <div style="display:flex;justify-content:space-between;margin-top:6px" class="subtle"><span>28 Jun</span><span>12 Jul</span><span>27 Jul</span></div>
          </div>
        </div>`;
      }

      function requestTable(requests, actionMode = false) {
        if (!requests.length) return `<div class="empty"><div class="empty-icon">✓</div><h2>Nothing to show</h2><div class="subtle">No requests match the current view.</div></div>`;
        return `<div class="table-scroll"><table class="responsive-table">
          <thead><tr><th>Request</th><th>Module</th><th>Requester</th><th>Submitted</th><th>Owner</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>${requests.map(r => `<tr data-action="open-request" data-id="${esc(r.id)}">
            <td data-label="Request"><strong>${esc(r.title)}</strong><small>${esc(r.id)}</small></td>
            <td data-label="Module"><span class="module-pill">${esc(moduleName(r.module).replace(" Management",""))}</span></td>
            <td data-label="Requester">${esc(r.requester)}</td><td data-label="Submitted">${esc(r.date)}</td><td data-label="Owner">${esc(r.owner)}</td><td data-label="Status">${pill(r.status)}</td>
            <td data-label="Action" class="request-action-cell">${actionMode && ["SUBMITTED","IN_REVIEW"].includes(r.status) ? `<button class="btn btn-sm btn-primary" data-action="request-action" data-id="${esc(r.id)}" data-request-action="approve">Approve</button><button class="btn btn-sm" style="color:var(--fd-danger)" data-action="request-action" data-id="${esc(r.id)}" data-request-action="reject">Reject</button>` : `<button class="btn btn-sm" data-action="open-request" data-id="${esc(r.id)}">View request</button>`}</td>
          </tr>`).join("")}</tbody>
        </table></div>`;
      }

      function renderRequests() {
        const current = state.requestTab || "ALL";
        const tabRows = current === "DRAFT" ? state.requests.filter(r => r.status === "DRAFT")
          : current === "AWAITING" ? state.requests.filter(r => ["SUBMITTED","IN_REVIEW","SENT_BACK","FULFILMENT"].includes(r.status))
          : current === "COMPLETED" ? state.requests.filter(r => ["APPROVED","CLOSED"].includes(r.status))
          : state.requests;
        const filters = state.requestFilters || { module:"", status:"" };
        const filtered = tabRows.filter(r =>
          (!filters.module || r.module === filters.module) &&
          (!filters.status || r.status === filters.status)
        );
        const tabs = [["ALL",`All ${state.requests.length}`],["DRAFT",`Drafts ${state.requests.filter(r => r.status === "DRAFT").length}`],["AWAITING",`Awaiting ${state.requests.filter(r => ["SUBMITTED","IN_REVIEW","SENT_BACK","FULFILMENT"].includes(r.status)).length}`],["COMPLETED",`Completed ${state.requests.filter(r => ["APPROVED","CLOSED"].includes(r.status)).length}`]];
        return `<div class="page">
          ${pageHead("requests", `<button class="btn" data-action="export" data-kind="requests">Export</button><button class="btn btn-primary" data-action="new-request">＋ New Request</button>`)}
          <div class="request-tabs">${tabs.map(tab => `<button class="request-tab ${current === tab[0] ? "active" : ""}" data-action="request-tab" data-tab="${tab[0]}">${tab[1]}</button>`).join("")}</div>
          <div class="card table-card request-table-card">
            <div class="table-toolbar">
              <select class="filter" id="requestModuleFilter" aria-label="Filter by module"><option value="">All modules</option>${Object.entries(MODULES).map(([k,m]) => `<option value="${k}" ${filters.module === k ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
              <select class="filter" id="requestStatusFilter" aria-label="Filter by status"><option value="">All statuses</option>${["DRAFT","SUBMITTED","IN_REVIEW","APPROVED","SENT_BACK","FULFILMENT","CLOSED","REJECTED","CANCELLED"].map(s => `<option value="${s}" ${filters.status === s ? "selected" : ""}>${statusLabel(s)}</option>`).join("")}</select>
              ${(filters.module || filters.status) ? `<button class="btn btn-sm" data-action="clear-request-filters">Clear filters</button>` : ""}
              <span class="subtle" style="margin-left:auto">${filtered.length} requests</span>
            </div>
            <div id="requestTable">${requestTable(filtered)}</div>
          </div>
        </div>`;
      }

      function renderCatalog() {
        return `<div class="page">
          ${pageHead("catalog", `<button class="btn btn-primary" data-action="new-request">＋ New Request</button>`)}
          <div class="callout" style="margin-bottom:18px"><b>i</b><span>Select a service to open a pre-filled request. Services from disabled modules are removed automatically.</span></div>
          <div class="catalog-grid">
            ${SERVICES.map((service, index) => ({ service, index })).filter(item => moduleEnabled(item.service.module)).map(({ service, index }) => {
              return `<article class="service-card">
                <div class="service-icon">${icon(service.module)}</div>
                <div class="service-title">${esc(service.title)}</div>
                <div class="service-copy">${esc(service.copy)}</div>
                <div class="service-foot"><span class="module-pill">${esc(MODULES[service.module].name)}</span><button class="btn btn-sm btn-soft" data-action="new-request" data-service="${index}">Request →</button></div>
              </article>`;
            }).join("")}
          </div>
        </div>`;
      }

      function renderApprovals() {
        const pending = state.requests.filter(r => ["SUBMITTED","IN_REVIEW"].includes(r.status) && requestInRoleScope(r));
        return `<div class="page">
          ${pageHead("approvals", `<div class="segmented"><button class="${state.inboxView === "table" ? "active" : ""}" data-action="inbox-view" data-view="table">Table</button><button class="${state.inboxView === "board" ? "active" : ""}" data-action="inbox-view" data-view="board">Board</button></div>`)}
          <div class="grid grid-2" style="margin-bottom:16px">
            <div class="card stat simple-stat"><div class="stat-value">${pending.length}</div><div class="stat-label">Pending my approval</div></div>
            <div class="card stat simple-stat"><div class="stat-value" style="color:var(--fd-danger)">${pending.filter(r => r.priority === "Urgent").length}</div><div class="stat-label">Overdue</div></div>
          </div>
          ${state.inboxView === "table"
            ? `<div class="card table-card request-table-card"><div class="table-toolbar"><span class="subtle">${pending.length} requests awaiting review · sorted by SLA</span></div>${requestTable(pending, true)}</div>`
            : `<div class="board">
                ${["SUBMITTED","IN_REVIEW","SENT_BACK"].map(status => {
                  const rows = state.requests.filter(r => r.status === status && requestInRoleScope(r));
                  return `<section class="board-col"><div class="board-title"><span>${statusLabel(status)}</span><span>${rows.length}</span></div>${rows.length ? rows.map(r => `<article class="board-card"><strong>${esc(r.title)}</strong><div class="subtle" style="margin-top:3px">${esc(r.id)} · ${esc(r.requester)}</div><button class="btn btn-sm btn-soft" data-action="open-request" data-id="${esc(r.id)}">Review</button></article>`).join("") : `<div class="subtle" style="padding:20px 4px">No requests</div>`}</section>`;
                }).join("")}
              </div>`}
        </div>`;
      }

      function requestDetailRows(req) {
        const d = req.details || {};
        const common = [
          ["Requester", req.requester],
          ["Module", moduleName(req.module)],
          [req.status === "DRAFT" ? "Created" : "Submitted", req.date],
          ["Current owner", req.owner || "Not assigned"]
        ];
        const specific = {
          leave:[
            ["Leave type", d.leaveType || "Annual leave"],
            ["Date range", d.start && d.end ? `${formatDate(d.start)} – ${formatDate(d.end)}` : "3 days"],
            ["Day option", d.dayOption || "Full day"],
            ["Handover contact", d.handover || "Not provided"]
          ],
          helpdesk:[
            ["Category", d.category || "Access & connectivity"],
            ["Impact", d.impact || "Individual user"],
            ["Urgency", d.urgency || req.priority || "Normal"],
            ["Affected item", d.device || d.service || "Not provided"]
          ],
          timesheets:[
            ["Week", d.week || state.timesheet.week],
            ["Project", d.project || "Multiple projects"],
            ["Total hours", d.total ? `${d.total} hours` : "38.5 hours"],
            ["Billable", d.billable || "32 hours"]
          ],
          assets:[
            ["Asset type", d.assetType || "Monitor"],
            ["Quantity", d.quantity || "1"],
            ["Required by", formatDate(d.requiredDate)],
            ["Delivery location", d.location || "Delhi office"]
          ],
          expenses:[
            ["Claim type", d.claimType || "Reimbursement"],
            ["Category", d.category || "Business travel"],
            ["Expense date", formatDate(d.expenseDate)],
            ["Merchant", d.merchant || "Not provided"],
            ["Amount", req.amount || "Not provided"],
            ["Receipt", d.receipt || "No receipt attached"]
          ]
        }[req.module] || [];
        return [...common, ...specific].map(([label,value]) => `<div><div class="field-label">${esc(label)}</div><div class="field-value">${esc(value || "Not provided")}</div></div>`).join("");
      }

      function requestActionButtons(req) {
        const buttons = [`<button class="btn" data-action="nav" data-route="requests">← Back</button>`];
        const approver = ["MGR","HOD","HR","FIN","IT","AST","SYS"].includes(user().code) && requestInRoleScope(req);
        const fulfiller = ["FIN","IT","AST","SYS"].includes(user().code);
        const requester = req.requester === user().name;
        if (requester && ["DRAFT","SENT_BACK"].includes(req.status)) {
          buttons.push(`<button class="btn" data-action="edit-request" data-id="${esc(req.id)}">Edit</button>`);
          buttons.push(`<button class="btn btn-primary" data-action="request-action" data-id="${esc(req.id)}" data-request-action="submit">Submit</button>`);
        }
        if (requester && ["DRAFT","SUBMITTED","IN_REVIEW","SENT_BACK"].includes(req.status)) {
          buttons.push(`<button class="btn btn-danger" data-action="request-action" data-id="${esc(req.id)}" data-request-action="cancel">Cancel request</button>`);
        }
        if (approver && ["SUBMITTED","IN_REVIEW"].includes(req.status)) {
          buttons.push(`<button class="btn" data-action="request-action" data-id="${esc(req.id)}" data-request-action="send_back">Send Back</button>`);
          buttons.push(`<button class="btn btn-danger" data-action="request-action" data-id="${esc(req.id)}" data-request-action="reject">Reject</button>`);
          buttons.push(`<button class="btn btn-primary" data-action="request-action" data-id="${esc(req.id)}" data-request-action="approve">Approve</button>`);
        }
        if (fulfiller && req.status === "APPROVED") {
          buttons.push(`<button class="btn btn-primary" data-action="request-action" data-id="${esc(req.id)}" data-request-action="fulfil">Start fulfilment</button>`);
        }
        if (fulfiller && req.status === "FULFILMENT") {
          buttons.push(`<button class="btn btn-danger" data-action="request-action" data-id="${esc(req.id)}" data-request-action="reject">Reject</button>`);
          buttons.push(`<button class="btn btn-primary" data-action="request-action" data-id="${esc(req.id)}" data-request-action="close">Close request</button>`);
        }
        return buttons.join("");
      }

      function requestTimeline(req) {
        const savedHistory = req.history || [];
        const base = [
          { label:"Request created", note:`${req.date} · ${req.requester}`, done:true },
          { label:req.status === "DRAFT" ? "Draft saved" : "Submitted", note:req.status === "DRAFT" ? "Waiting for submission" : "Policy validation completed", done:req.status !== "DRAFT" },
          { label:"Approval review", note:["SUBMITTED","IN_REVIEW"].includes(req.status) ? `Waiting for ${req.owner}` : statusLabel(req.status), done:["APPROVED","FULFILMENT","CLOSED"].includes(req.status) },
          { label:"Completion", note:req.status === "CLOSED" ? "Request completed" : "Pending previous stage", done:req.status === "CLOSED" }
        ];
        const items = savedHistory.length ? savedHistory.map(item => ({ label:item.action, note:`${item.time} · ${item.actor}`, done:true })) : base;
        return items.map(item => `<div class="timeline-item ${item.done ? "" : "pending"}"><span class="timeline-dot">${item.done ? "✓" : "•"}</span><strong>${esc(item.label)}</strong><div class="subtle">${esc(item.note)}</div></div>`).join("");
      }

      function renderRequestDetail() {
        const req = state.requests.find(item => item.id === state.selectedRequest) || state.requests[0];
        if (!req) return renderRequests();
        const comments = commentsFor(req.id);
        const attachments = attachmentsFor(req.id);
        return `<div class="page">
          ${pageHead("request", requestActionButtons(req))}
          <div class="grid split">
            <div class="grid">
              <section class="card">
                <div class="card-head"><div><h2>${esc(req.title)}</h2><div class="subtle">${esc(req.id)}</div></div>${pill(req.status)}</div>
                <div class="detail-grid">${requestDetailRows(req)}</div>
                <div style="margin-top:22px"><div class="field-label">${req.module === "helpdesk" ? "Issue description" : req.module === "expenses" ? "Business purpose" : "Reason / notes"}</div><p style="margin:7px 0 0">${esc(req.reason || req.details?.description || "No additional information was provided.")}</p></div>
              </section>
              <section class="card">
                <div class="card-head"><h2>Comments & attachments</h2><div class="btn-row"><button class="btn btn-sm" data-action="attach-file" data-id="${esc(req.id)}">Add attachment</button><button class="btn btn-sm btn-soft" data-action="add-comment" data-id="${esc(req.id)}">Add comment</button></div></div>
                <div class="comment-list">${comments.length ? comments.map(item => `<div class="comment-item"><div class="comment-meta"><strong>${esc(item.author)}</strong><span>${esc(item.time)}</span></div><div>${esc(item.text)}</div></div>`).join("") : `<div class="empty-inline">No comments yet.</div>`}</div>
                <div class="attachment-list">${attachments.length ? attachments.map(item => `<div class="attachment-item">${icon("document",16)}<strong>${esc(item.name)}</strong><span class="subtle" style="margin-left:auto">${esc(item.addedBy)}</span></div>`).join("") : `<div class="callout"><b>i</b><span>No attachments have been added. Files are represented by name in this standalone prototype.</span></div>`}</div>
              </section>
            </div>
            <aside class="card">
              <div class="card-head"><h2>Workflow timeline</h2></div>
              <div class="timeline">${requestTimeline(req)}</div>
            </aside>
          </div>
        </div>`;
      }

      function moduleDisabledPage(key) {
        return `<div class="page">${pageHead(key)}<div class="card empty"><div class="empty-icon">!</div><h2>${esc(MODULES[key].name)} is disabled</h2><p class="subtle">New entry points are blocked. Historical requests remain visible and auditable.</p>${user().code === "SYS" ? `<button class="btn btn-primary" data-action="nav" data-route="modules">Open Module Manager</button>` : `<button class="btn" data-action="nav" data-route="dashboard">Return to Dashboard</button>`}</div></div>`;
      }

      function renderLeave() {
        if (!moduleEnabled("leave")) return moduleDisabledPage("leave");
        return `<div class="page">
          ${pageHead("leave", `<button class="btn btn-primary" data-action="new-request" data-module="leave">Apply for Leave</button>`)}
          <div class="grid grid-4">
            ${[["Annual",12,"of 18 days"],["Sick",6,"of 8 days"],["Casual",3,"of 6 days"],["Comp-Off",1,"expires 31 Aug"]].map(x => `<div class="balance"><span class="subtle">${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join("")}
          </div>
          <div class="grid split" style="margin-top:18px">
            <div class="card table-card"><div class="table-toolbar"><h2 style="margin:0">Leave requests</h2></div>${requestTable(state.requests.filter(r => r.module === "leave"))}</div>
            <div class="card"><div class="card-head"><h2>Policy summary</h2></div><div class="activity-list"><div class="activity"><span class="activity-dot">1</span><div><div class="activity-title">Annual leave</div><div class="activity-copy">Apply at least 3 days in advance</div></div></div><div class="activity"><span class="activity-dot">2</span><div><div class="activity-title">Sick leave</div><div class="activity-copy">Medical document required after 2 days</div></div></div><div class="activity"><span class="activity-dot">3</span><div><div class="activity-title">Approval SLA</div><div class="activity-copy">2 working days</div></div></div></div></div>
          </div>
        </div>`;
      }

      function renderHelpdesk() {
        if (!moduleEnabled("helpdesk")) return moduleDisabledPage("helpdesk");
        return `<div class="page">
          ${pageHead("helpdesk", `<button class="btn btn-primary" data-action="new-request" data-module="helpdesk">Report IT Issue</button>`)}
          <div class="grid grid-4">${[["Open tickets",3],["Due today",2],["Within SLA","94%"],["Avg. resolution","6.2h"]].map(x => `<div class="card stat"><div class="stat-icon">${icon("helpdesk")}</div><div class="stat-value">${x[1]}</div><div class="stat-label">${x[0]}</div></div>`).join("")}</div>
          <div class="card table-card" style="margin-top:18px"><div class="table-toolbar"><h2 style="margin:0">Support tickets</h2></div>${requestTable(state.requests.filter(r => r.module === "helpdesk"), user().code === "IT")}</div>
        </div>`;
      }

      function timesheetTotals() {
        const rows = state.timesheet.rows || [];
        const total = rows.reduce((sum,row) => sum + row.hours.reduce((a,b) => a + Number(b || 0), 0), 0);
        const billable = rows.filter(row => row.billable).reduce((sum,row) => sum + row.hours.reduce((a,b) => a + Number(b || 0), 0), 0);
        return { total, billable, nonBillable:total - billable, missing:Math.max(0, 40 - total) };
      }

      function renderTimesheets() {
        if (!moduleEnabled("timesheets")) return moduleDisabledPage("timesheets");
        const totals = timesheetTotals();
        const submitted = state.timesheet.status === "SUBMITTED";
        return `<div class="page">
          ${pageHead("timesheets", `<button class="btn" data-action="save-timesheet" ${submitted ? "disabled" : ""}>Save Draft</button><button class="btn btn-primary" data-action="submit-timesheet" ${submitted ? "disabled" : ""}>${submitted ? "Submitted" : "Submit Week"}</button>`)}
          <div class="grid grid-4">
            ${[["Week total",`${totals.total.toFixed(1)}h`,"ts-total"],["Billable",`${totals.billable.toFixed(1)}h`,"ts-billable"],["Non-billable",`${totals.nonBillable.toFixed(1)}h`,"ts-nonbillable"],["Missing",`${totals.missing.toFixed(1)}h`,"ts-missing"]].map(x => `<div class="card stat"><div class="stat-icon">${icon("timesheets")}</div><div class="stat-value" id="${x[2]}">${x[1]}</div><div class="stat-label">${x[0]}</div></div>`).join("")}
          </div>
          <div class="card table-card" style="margin-top:18px">
            <div class="table-toolbar"><div><h2 style="margin:0">${esc(state.timesheet.week)}</h2><div class="subtle">${submitted ? "Submitted to Maya Sharma" : state.timesheet.savedAt ? `Draft saved ${esc(state.timesheet.savedAt)}` : "Enter hours for each project"}</div></div><span class="module-pill" style="margin-left:auto">${esc(state.timesheet.status)}</span></div>
            <div class="table-scroll"><div class="week-grid">
              ${["Project / Activity","Mon","Tue","Wed","Thu","Fri","Total"].map(x => `<div>${x}</div>`).join("")}
              ${state.timesheet.rows.map((row,i) => `<div><strong>${esc(row.project)}</strong><small style="display:block;color:var(--fd-muted)">${row.billable ? "Billable" : "Non-billable"}</small></div>${row.hours.map((value,day) => `<div><input class="timesheet-hour" type="number" value="${Number(value)}" min="0" max="24" step=".5" data-row="${i}" data-day="${day}" aria-label="${esc(row.project)} ${["Monday","Tuesday","Wednesday","Thursday","Friday"][day]} hours" ${submitted ? "disabled" : ""}></div>`).join("")}<div><strong id="ts-row-${i}">${row.hours.reduce((a,b) => a + Number(b || 0),0).toFixed(1)}</strong></div>`).join("")}
            </div></div>
          </div>
        </div>`;
      }

      function renderAssets() {
        if (!moduleEnabled("assets")) return moduleDisabledPage("assets");
        return `<div class="page">${pageHead("assets", `<button class="btn btn-primary" data-action="new-request" data-module="assets">Request Asset</button>`)}
          <div class="grid grid-3">${[["Assigned to me",state.assets.filter(a => a.status === "Assigned").length],["Open requests",state.requests.filter(r => r.module === "assets" && !["CLOSED","CANCELLED","REJECTED"].includes(r.status)).length],["Warranty alerts",state.assets.filter(a => /2027/.test(a.warranty)).length]].map(x => `<div class="card stat"><div class="stat-icon">${icon("assets")}</div><div class="stat-value">${x[1]}</div><div class="stat-label">${x[0]}</div></div>`).join("")}</div>

      function renderCalendar() {
        const month = Number.isFinite(state.calendarMonth) ? state.calendarMonth : 6;
        const first = new Date(2026, month, 1);
        const daysInMonth = new Date(2026, month + 1, 0).getDate();
        const offset = (first.getDay() + 6) % 7;
        const previousDays = new Date(2026, month, 0).getDate();
        const cells = Array.from({length:42}, (_,index) => {
          if (index < offset) return { day:previousDays - offset + index + 1, muted:true, month:month - 1 };
          if (index >= offset + daysInMonth) return { day:index - offset - daysInMonth + 1, muted:true, month:month + 1 };
          return { day:index - offset + 1, muted:false, month };
        });
        const events = month === 6 ? { 15:"Company town hall", 27:"Team leave · 2" } : month === 7 ? { 15:"Independence Day", 21:"Payroll cutoff" } : {};
        const monthLabel = new Date(2026, month, 1).toLocaleDateString("en-GB", { month:"long", year:"numeric" });
        return `<div class="page">${pageHead("calendar", `<button class="btn" data-action="calendar-prev" aria-label="Previous month">←</button><button class="btn" data-action="calendar-today">Today</button><button class="btn" data-action="calendar-next" aria-label="Next month">→</button>`)}
          <div class="card table-card"><div class="table-toolbar"><h2 style="margin:0">${esc(monthLabel)}</h2><span class="subtle" style="margin-left:auto">Select an event for details</span></div><div class="table-toolbar">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<strong style="flex:1;text-align:center;font-size:11px">${d}</strong>`).join("")}</div><div class="table-scroll"><div class="calendar">${cells.map(cell => `<div class="cal-cell ${cell.muted ? "muted" : ""}" ${!cell.muted && events[cell.day] ? `data-action="calendar-event" data-day="${cell.day}" data-title="${esc(events[cell.day])}"` : ""}><strong>${cell.day}</strong>${!cell.muted && events[cell.day] ? `<div class="cal-event">${esc(events[cell.day])}</div>` : ""}</div>`).join("")}</div></div></div>

      function renderRoute() {
        if (!state.loggedIn) return renderLogin();
        const current = route();
        const navItem = NAV.flatMap(s => s.items).find(i => i.route === current);
        if (navItem && !allowed(navItem)) return renderShell(permissionDenied());
        const renderers = {
          dashboard: renderDashboard, catalog: renderCatalog, requests: renderRequests, approvals: renderApprovals,
          request: renderRequestDetail, leave: renderLeave, helpdesk: renderHelpdesk, timesheets: renderTimesheets,
          assets: renderAssets, expenses: renderExpenses, directory: renderDirectory, reports: renderReports,
          notifications: renderNotifications, audit: renderAudit, modules: renderModules, ai: renderAI,

          workflow: () => renderAdminPage("workflow"), admin: () => renderAdminPage("admin"),
          lookups: () => renderAdminPage("lookups"), roles: () => renderAdminPage("roles"),
          users: () => renderAdminPage("users"), config: () => renderAdminPage("config")
        };
        renderShell((renderers[current] || renderDashboard)());
        requestAnimationFrame(() => {
          const messages = document.getElementById("messages");
          if (messages) messages.scrollTop = messages.scrollHeight;

            <div class="form-field"><label for="dayOption">Day option${required}</label><select class="input" id="dayOption" name="dayOption" required>${["Full day","First half","Second half"].map(value => `<option ${value === values.dayOption ? "selected" : ""}>${value}</option>`).join("")}</select></div>

            <div class="form-field"><label for="leaveEnd">End date${required}</label><input class="input" id="leaveEnd" name="end" type="date" value="${esc(values.end || "2026-07-31")}" required></div>

      function validateRequestForm(form, isDraft) {
        if (isDraft) return true;
        if (!form.reportValidity()) return false;
        const data = new FormData(form);
        const moduleKey = String(data.get("module"));
        if (moduleKey === "leave" && String(data.get("end")) < String(data.get("start"))) {
          toast("End date cannot be before the start date.", "error");
          form.elements.end?.focus();
          return false;
        }
        if (moduleKey === "expenses") {
          const amount = Number(data.get("amount"));
          const claimType = String(data.get("claimType"));
          if (claimType === "Reimbursement" && amount > 25 && !String(data.get("receipt") || "").trim()) {
            toast("Add a receipt reference for reimbursement claims above 25.", "error");
            form.elements.receipt?.focus();
            return false;
          }
        }
        return true;
      }

      function requestTitle(moduleKey, data) {
        if (moduleKey === "leave") {
          const start = new Date(`${data.start}T12:00:00`);
          const end = new Date(`${data.end}T12:00:00`);
          const days = Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) ? 1 : Math.max(1, Math.round((end - start) / 86400000) + 1);
          return `${data.leaveType || "Leave"} — ${days} ${days === 1 ? "day" : "days"}`;
        }
        if (moduleKey === "helpdesk") return data.issueSummary || "IT support request";
        if (moduleKey === "timesheets") return `Timesheet ${data.correctionType || "correction"} — ${formatDate(data.weekStart)}`;
        if (moduleKey === "assets") return `${data.assetType || "Asset"} request`;
        return `${data.claimType || "Expense"}: ${data.category || "Business expense"} — ${data.currency || "USD"} ${Number(data.amount || 0).toFixed(2)}`;
      }

      function submitNewRequest(form, isDraft = false) {
        if (!validateRequestForm(form, isDraft)) return;
        const data = new FormData(form);
        const moduleKey = String(data.get("module"));
        if (!moduleEnabled(moduleKey)) return toast(`${moduleName(moduleKey)} is disabled.`, "error");
        const values = Object.fromEntries(data.entries());
        const existingId = form.dataset.requestId;
        const existing = existingId ? state.requests.find(request => request.id === existingId) : null;
        const id = existing?.id || nextRequestId(moduleKey);
        const owner = moduleKey === "helpdesk" ? USERS.itagent.name : moduleKey === "expenses" ? USERS.finance.name : moduleKey === "assets" ? USERS.assetadmin.name : USERS.manager.name;
        const req = existing || { id, module:moduleKey, requester:user().name, history:[] };
        req.title = requestTitle(moduleKey, values);
        req.date = req.date || todayLabel();
        req.owner = owner;
        req.status = isDraft ? "DRAFT" : "SUBMITTED";
        req.amount = moduleKey === "expenses" ? `${values.currency || "USD"} ${Number(values.amount || 0).toFixed(2)}` : "";
        req.priority = moduleKey === "helpdesk" ? (values.urgency === "Critical" ? "Urgent" : values.urgency || "Normal") : "Normal";
        req.reason = String(values.reason || values.description || "");
        req.details = values;
        req.history = req.history || [];
        req.history.unshift({ action:isDraft ? "Draft saved" : existing ? "Request resubmitted" : "Request submitted", time:"Just now", actor:user().name });
        if (!existing) state.requests.unshift(req);
        state.selectedRequest = id;
        if (!isDraft) state.notifications.unshift({ id: Date.now(), title:"Request submitted", copy:`${req.title} was routed to ${req.owner}.`, time:"Just now", read:false, route:"request" });
        addAudit(isDraft ? "SAVE DRAFT" : existing ? "RESUBMIT" : "SUBMIT", id, `${req.title} ${isDraft ? "saved as draft" : "submitted and routed"}`);
        saveState();
        closeModal();
        navigate("request");
        toast(isDraft ? "Draft saved successfully." : "Request submitted successfully.", "success");
      }

      function performRequestAction(id, action) {
        const req = state.requests.find(r => r.id === id);
        if (!req) return;
        const requesterAction = ["submit","cancel"].includes(action);
        const approvalAction = ["approve","reject","send_back"].includes(action);
        const fulfilmentAction = ["fulfil","close"].includes(action);
        if (requesterAction && req.requester !== user().name) {
          closeModal();
          return toast("Only the requester can submit or cancel this request.", "error");
        }
        if (approvalAction && !(["MGR","HOD","HR","FIN","IT","AST","SYS"].includes(user().code) && requestInRoleScope(req))) {
          closeModal();
          return toast("Your current role cannot take this approval action.", "error");
        }
        if (fulfilmentAction && !["FIN","IT","AST","SYS"].includes(user().code)) {
          closeModal();
          return toast("Your current role cannot complete fulfilment.", "error");
        }
        const allowedTransitions = {
          DRAFT:{ submit:"SUBMITTED", cancel:"CANCELLED" },
          SUBMITTED:{ approve:"APPROVED", reject:"REJECTED", send_back:"SENT_BACK", cancel:"CANCELLED" },
          IN_REVIEW:{ approve:"APPROVED", reject:"REJECTED", send_back:"SENT_BACK", cancel:"CANCELLED" },
          SENT_BACK:{ submit:"SUBMITTED", cancel:"CANCELLED" },
          APPROVED:{ fulfil:"FULFILMENT", close:"CLOSED" },
          FULFILMENT:{ close:"CLOSED", reject:"REJECTED" }
        };
        const status = allowedTransitions[req.status]?.[action];
        if (!status) {
          closeModal();
          return toast(`This action is not available while the request is ${statusLabel(req.status).toLowerCase()}.`, "error");
        }
        const comment = document.getElementById("actionComment")?.value.trim() || "";
        if (["reject","send_back","cancel"].includes(action) && !comment) {
          document.getElementById("actionComment")?.focus();
          return toast("Add a reason before confirming this action.", "error");
        }
        req.status = status;
        req.history = req.history || [];
        req.history.unshift({ action:statusLabel(status), time:"Just now", actor:user().name });
        if (comment) {
          state.comments[id] = state.comments[id] || [];
          state.comments[id].unshift({ author:user().name, time:"Just now", text:comment });
        }
        addAudit(action.toUpperCase().replace("_"," "), id, `${req.title} changed to ${statusLabel(status)}`);
        state.notifications.unshift({ id:Date.now(), title:`Request ${statusLabel(status).toLowerCase()}`, copy:`${req.id} was updated by ${user().name}.`, time:"Just now", read:false, route:"request" });
        saveState();
        closeModal();
        render();
        toast(`Request ${statusLabel(status).toLowerCase()}.`, action === "reject" ? "error" : "success");
      }

      function toggleModule(key) {
        const m = MODULES[key];
        const enabling = !moduleEnabled(key);
        openModal(`
          ${modalHeader(`${enabling ? "Enable" : "Disable"} ${m.name}`, "Module Manager impact preview")}
          <div class="modal-body">
            <div class="callout ${enabling ? "" : "warning"}"><b>${enabling ? "i" : "!"}</b><span>${enabling ? "Navigation and new request entry points will be restored." : "Navigation and new request entry points will be removed. Historical and in-flight requests will remain visible."}</span></div>
            <div class="detail-grid" style="margin-top:18px"><div><div class="field-label">Affected services</div><div class="field-value">${SERVICES.filter(s => s.module === key).length}</div></div><div><div class="field-label">Existing requests</div><div class="field-value">${state.requests.filter(r => r.module === key).length}</div></div></div>
          </div><footer class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn ${enabling ? "btn-primary" : "btn-danger"}" data-action="confirm-module-toggle" data-module="${key}">${enabling ? "Enable" : "Disable"} module</button></footer>`, true);
      }

      function downloadExport(kind) {
        const csv = value => `"${String(value ?? "").replaceAll('"','""')}"`;
        const reportRows = kind === "analytics" && state.reportFilter?.module ? state.requests.filter(r => r.module === state.reportFilter.module) : state.requests;
        const content = kind === "audit"
          ? [["Time","Actor","Action","Target","Detail"], ...state.audit.map(a => [a.time,a.actor,a.action,a.target,a.detail])].map(row => row.map(csv).join(",")).join("\n")
          : [["Request ID","Title","Module","Requester","Status","Owner","Amount"], ...reportRows.map(r => [r.id,r.title,moduleName(r.module),r.requester,statusLabel(r.status),r.owner,r.amount])].map(row => row.map(csv).join(",")).join("\n");
        const blob = new Blob([content], { type:"text/csv" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `FlowDesk_PRO_${kind}_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
        toast("Export downloaded.", "success");
      }

      document.addEventListener("click", event => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        if (action === "modal-backdrop" && event.target === target) return closeModal();
        if (action === "close-modal") return closeModal();
        if (action === "toggle-sidebar") { sidebarOpen = !sidebarOpen; return render(); }
        if (action === "close-sidebar") { sidebarOpen = false; return render(); }
        if (action === "nav") return navigate(target.dataset.route);
        if (action === "profile-menu") return profileMenu();
        if (action === "search-mobile") return searchModal();
        if (action === "dashboard-range") return dashboardRangeModal();
        if (action === "set-dashboard-range") {
          state.dashboardRange = target.dataset.value;
          saveState();
          closeModal();
          render();
          return toast(`Dashboard updated to ${state.dashboardRange.toLowerCase()}.`, "success");
        }
        if (action === "new-request") {
          const service = target.dataset.service === undefined ? undefined : Number(target.dataset.service);
          return newRequestModal({ service, module: target.dataset.module });
        }
        if (action === "edit-request") return newRequestModal({ requestId:target.dataset.id });
        if (action === "open-request") {
          event.stopPropagation();
          state.selectedRequest = target.dataset.id;
          saveState();
          return navigate("request");
        }
        if (action === "request-action") return confirmRequestAction(target.dataset.id, target.dataset.requestAction);
        if (action === "confirm-request-action") return performRequestAction(target.dataset.id, target.dataset.requestAction);
        if (action === "inbox-view") { state.inboxView = target.dataset.view; saveState(); return render(); }
        if (action === "request-tab") { state.requestTab = target.dataset.tab; saveState(); return render(); }
        if (action === "clear-request-filters") { state.requestFilters = { module:"", status:"" }; saveState(); return render(); }
        if (action === "mark-all-read") { state.notifications.forEach(n => n.read = true); saveState(); render(); return toast("All notifications marked as read.", "success"); }
        if (action === "open-notification") {
          const n = state.notifications.find(x => String(x.id) === target.dataset.id);
          if (n) n.read = true;
          saveState();
          return navigate(target.dataset.route);
        }
        if (action === "toggle-module") return toggleModule(target.dataset.module);
        if (action === "confirm-module-toggle") {
          const key = target.dataset.module;
          state.modules[key] = !moduleEnabled(key);
          addAudit(state.modules[key] ? "MODULE ENABLE" : "MODULE DISABLE", moduleName(key), "Module availability changed");
          saveState();
          closeModal();
          render();
          return toast(`${moduleName(key)} ${state.modules[key] ? "enabled" : "disabled"}.`, "success");
        }
        if (action === "reset-demo") {
          state = clone(DEFAULT_STATE);
          saveState();
          closeModal();
          navigate("dashboard");
          return toast("Demo data reset.", "success");
        }
        if (action === "logout") { state.loggedIn = false; saveState(); closeModal(); return renderLogin(); }
        if (action === "export") return downloadExport(target.dataset.kind || "requests");
        if (action === "save-draft") {
          const form = target.closest("form");
          return form ? submitNewRequest(form, true) : toast("No request form is open.", "error");
        }
        if (action === "save-timesheet") {
          state.timesheet.status = "DRAFT";
          state.timesheet.savedAt = new Date().toLocaleTimeString("en-IN", { hour:"2-digit", minute:"2-digit" });
          addAudit("SAVE DRAFT", "Timesheet", `${state.timesheet.week} saved`);
          saveState();
          render();
          return toast("Timesheet draft saved.", "success");
        }
        if (action === "submit-timesheet") return timesheetSubmitModal();
        if (action === "confirm-timesheet-submit") return submitTimesheet();
        if (action === "add-comment") return commentModal(target.dataset.id);
        if (action === "attach-file") return attachmentModal(target.dataset.id);
        if (action === "asset-action") return assetDetailsModal(target.dataset.id);
        if (action === "asset-issue") {
          const asset = state.assets.find(item => item.id === target.dataset.id);
          return newRequestModal({ module:"helpdesk", preset:`Issue with ${asset?.name || target.dataset.id}` });
        }
        if (action === "asset-return") {
          const asset = state.assets.find(item => item.id === target.dataset.id);
          if (!asset) return toast("Asset record was not found.", "error");
          asset.status = "Return requested";
          const req = { id:nextRequestId("assets"), title:`Return ${asset.name}`, module:"assets", requester:user().name, date:todayLabel(), owner:USERS.assetadmin.name, status:"SUBMITTED", amount:"", priority:"Normal", reason:"Asset return requested from the assigned asset record.", details:{ assetType:asset.type, assetId:asset.id, quantity:"1", location:user().location || "Delhi office" }, history:[{ action:"Return requested", time:"Just now", actor:user().name }] };
          state.requests.unshift(req);
          addAudit("ASSET RETURN", asset.id, `${asset.name} return requested`);
          saveState();
          closeModal();
          render();
          return toast("Asset return request created.", "success");
        }
        if (action === "view-person") return personModal(target.dataset.person);
        if (action === "contact-person") {
          const person = DIRECTORY_PEOPLE.find(item => item.name === target.dataset.person);
          if (navigator.clipboard && person) navigator.clipboard.writeText(person.email).catch(() => {});
          closeModal();
          return toast(person ? `${person.email} copied.` : "Contact not found.", person ? "success" : "error");
        }
        if (action === "read-article") return articleModal(target.dataset.index);
        if (action === "new-delegation") return delegationModal();
        if (action === "cancel-delegation") {
          const item = state.delegations.find(row => String(row.id) === target.dataset.id);
          if (item) {
            item.status = "CANCELLED";
            addAudit("DELEGATION CANCEL", String(item.id), `${item.delegate} delegation cancelled`);
            saveState();
            render();
            return toast("Delegation cancelled.", "success");
          }
        }
        if (action === "toggle-ooo") {
          state.outOfOffice = !state.outOfOffice;
          addAudit("OUT OF OFFICE", user().name, state.outOfOffice ? "Enabled" : "Disabled");
          saveState();
          render();
          return toast(`Out of office ${state.outOfOffice ? "enabled" : "disabled"}.`, "success");
        }
        if (action === "calendar-prev") { state.calendarMonth = Math.max(0, state.calendarMonth - 1); saveState(); return render(); }
        if (action === "calendar-next") { state.calendarMonth = Math.min(11, state.calendarMonth + 1); saveState(); return render(); }
        if (action === "calendar-today") { state.calendarMonth = 6; saveState(); return render(); }
        if (action === "calendar-event") return simpleModal(target.dataset.title, `${target.dataset.day} ${new Date(2026, state.calendarMonth, 1).toLocaleDateString("en-GB", { month:"long", year:"numeric" })}. This calendar event is visible to your current role.`);
        if (action === "admin-add") return adminEditor(target.dataset.kind);
        if (action === "admin-edit") return adminEditor(target.dataset.kind, Number(target.dataset.index));
        if (action === "profile-toggle") {
          state.preferences[state.user] = state.preferences[state.user] || { email:true, compact:false };
          const pref = target.dataset.pref;
          state.preferences[state.user][pref] = !state.preferences[state.user][pref];
          saveState();
          render();
          return toast(`${pref === "compact" ? "Compact tables" : "Email notifications"} ${state.preferences[state.user][pref] ? "enabled" : "disabled"}.`, "success");
        }
        if (action === "save-profile") {
          const form = document.getElementById("profileForm");
          if (!form?.reportValidity()) return;
          const data = new FormData(form);
          state.profiles[state.user] = Object.assign({}, state.profiles[state.user] || {}, { name:String(data.get("name")).trim(), department:String(data.get("department") || ""), location:String(data.get("location") || ""), phone:String(data.get("phone") || "") });
          addAudit("PROFILE UPDATE", user().code, "Profile details saved");
          saveState();
          render();
          return toast("Profile changes saved.", "success");
        }
      });

      document.addEventListener("change", event => {
        const target = event.target.closest('[data-action="switch-user"]');
        if (target) {
          state.user = target.value;
          state.loggedIn = true;
          addAudit("USER SWITCH", "Prototype session", `Demo role switched to ${user().code}`);
          saveState();
          closeModal();
          navigate("dashboard");
          toast(`Switched to ${user().name}.`, "success");
        }
        if (event.target.id === "newModule") {
          return newRequestModal({ module:event.target.value });
        }
        if (event.target.id === "requestModuleFilter" || event.target.id === "requestStatusFilter") {
          state.requestFilters = {
            module:document.getElementById("requestModuleFilter")?.value || "",
            status:document.getElementById("requestStatusFilter")?.value || ""
          };
          saveState();
          return render();
        }
        if (event.target.id === "reportModule" || event.target.id === "reportPeriod") {
          state.reportFilter = {
            module:document.getElementById("reportModule")?.value || "",
            period:document.getElementById("reportPeriod")?.value || "30"
          };
          saveState();
          return render();
        }
        if (event.target.id === "directoryLocation") {
          const search = document.getElementById("directorySearch")?.value.toLowerCase().trim() || "";
          const location = event.target.value;
          const filtered = DIRECTORY_PEOPLE.filter(person => (!location || person.location === location) && (!search || `${person.name} ${person.role} ${person.department}`.toLowerCase().includes(search)));
          const grid = document.getElementById("directoryGrid");
          const count = document.getElementById("directoryCount");
          if (grid) grid.innerHTML = directoryCards(filtered);
          if (count) count.textContent = `${filtered.length} people`;
        }
        if (event.target.id === "knowledgeCategory") {
          const search = document.getElementById("knowledgeSearch")?.value.toLowerCase().trim() || "";
          const category = event.target.value;
          const filtered = KNOWLEDGE_ARTICLES.filter(article => (!category || article.category === category) && (!search || `${article.title} ${article.summary}`.toLowerCase().includes(search)));
          const grid = document.getElementById("knowledgeGrid");
          if (grid) grid.innerHTML = knowledgeCards(filtered);
        }
        if (event.target.id === "auditAction") updateAuditView();
      });

      document.addEventListener("submit", event => {
        if (event.target.id === "loginForm") {
          event.preventDefault();
          state.user = new FormData(event.target).get("user");
          state.loggedIn = true;
          saveState();
          navigate("dashboard");
          return toast(`Welcome, ${user().name}.`, "success");
        }
        if (event.target.id === "requestForm") {
          event.preventDefault();
          return submitNewRequest(event.target);
        }
        if (event.target.id === "globalSearchForm") {
          event.preventDefault();
          return searchModal(String(new FormData(event.target).get("query") || ""));
        }
        if (event.target.id === "commentForm") {
          event.preventDefault();
          const form = event.target;
          if (!form.reportValidity()) return;
          const id = form.dataset.id;
          const text = String(new FormData(form).get("comment") || "").trim();
          if (!text) return;
          state.comments[id] = state.comments[id] || [];
          state.comments[id].unshift({ author:user().name, time:"Just now", text });
          const req = state.requests.find(item => item.id === id);
          if (req) {
            req.history = req.history || [];
            req.history.unshift({ action:"Comment added", time:"Just now", actor:user().name });
          }
          addAudit("COMMENT", id, text.slice(0,100));
          saveState();
          closeModal();
          render();
          return toast("Comment added.", "success");
        }
        if (event.target.id === "attachmentForm") {
          event.preventDefault();
          const form = event.target;
          if (!form.reportValidity()) return;
          const id = form.dataset.id;
          const name = String(new FormData(form).get("name") || "").trim();
          if (!/\.[a-z0-9]{2,5}$/i.test(name)) return toast("Enter a filename with an extension, such as receipt.pdf.", "error");
          state.attachments[id] = state.attachments[id] || [];
          state.attachments[id].unshift({ name, addedBy:user().name, time:"Just now" });
          addAudit("ATTACH", id, name);
          saveState();
          closeModal();
          render();
          return toast("Attachment added.", "success");
        }
        if (event.target.id === "delegationForm") {
          event.preventDefault();
          const form = event.target;
          if (!form.reportValidity()) return;
          const data = Object.fromEntries(new FormData(form).entries());
          if (data.end < data.start) {
            form.elements.end.focus();
            return toast("Delegation end date cannot be before the start date.", "error");
          }
          if (data.delegate === user().name) return toast("Choose another employee as the delegate.", "error");
          state.delegations.unshift({ id:Date.now(), delegate:data.delegate, start:data.start, end:data.end, scope:data.scope, reason:data.reason, status:"SCHEDULED" });
          addAudit("DELEGATION CREATE", data.delegate, `${data.scope}, ${formatDate(data.start)} to ${formatDate(data.end)}`);
          saveState();
          closeModal();
          render();
          return toast("Delegation created.", "success");
        }
        if (event.target.id === "adminForm") {
          event.preventDefault();
          const form = event.target;
          if (!form.reportValidity()) return;
          const data = new FormData(form);
          const row = [String(data.get("field0")).trim(), String(data.get("field1")).trim(), String(data.get("field2")).trim(), String(data.get("status"))];
          const kind = form.dataset.kind;
          const index = Number(form.dataset.index);
          if (index >= 0) state.adminData[kind][index] = row;
          else state.adminData[kind].unshift(row);
          addAudit(index >= 0 ? "ADMIN UPDATE" : "ADMIN CREATE", kind, row[0]);
          saveState();
          closeModal();
          render();
          return toast("Administration record saved.", "success");
        }
        if (event.target.id === "aiForm") {
          event.preventDefault();
          const input = event.target.elements.prompt;
          const prompt = input.value.trim();
          if (!prompt) return;
          state.aiMessages.push({ from:"user", text:prompt });
          const answer = /approve|reject|pay/i.test(prompt)
            ? "I cannot approve, reject, or make a payment. I can show the request and explain the required process."
            : /leave/i.test(prompt)
              ? `You have ${state.requests.filter(r => r.module === "leave").length} leave request(s). Your current annual leave balance is 12 days.`
              : `I found ${state.requests.length} requests in the shared prototype. ${pendingCount()} currently need review.`;
          state.aiMessages.push({ from:"assistant", text:answer });
          addAudit("AI QUERY", "AI Assistant", prompt.slice(0,80));
          saveState();
          render();
        }
      });

      document.addEventListener("input", event => {
        if (event.target.classList.contains("timesheet-hour")) {
          const input = event.target;
          const row = Number(input.dataset.row);
          const day = Number(input.dataset.day);
          const value = Math.min(24, Math.max(0, Number(input.value || 0)));
          state.timesheet.rows[row].hours[day] = value;
          state.timesheet.status = "DRAFT";
          saveState();
          const rowTotal = state.timesheet.rows[row].hours.reduce((a,b) => a + Number(b || 0), 0);
          const totals = timesheetTotals();
          const updates = {
            [`ts-row-${row}`]:rowTotal.toFixed(1),
            "ts-total":`${totals.total.toFixed(1)}h`,
            "ts-billable":`${totals.billable.toFixed(1)}h`,
            "ts-nonbillable":`${totals.nonBillable.toFixed(1)}h`,
            "ts-missing":`${totals.missing.toFixed(1)}h`
          };
          Object.entries(updates).forEach(([id,value]) => { const node=document.getElementById(id); if (node) node.textContent=value; });
        }
        if (event.target.id === "directorySearch") {
          const search = event.target.value.toLowerCase().trim();
          const location = document.getElementById("directoryLocation")?.value || "";
          const filtered = DIRECTORY_PEOPLE.filter(person => (!location || person.location === location) && (!search || `${person.name} ${person.role} ${person.department}`.toLowerCase().includes(search)));
          const grid = document.getElementById("directoryGrid");
          const count = document.getElementById("directoryCount");
          if (grid) grid.innerHTML = directoryCards(filtered);
          if (count) count.textContent = `${filtered.length} people`;
        }
        if (event.target.id === "knowledgeSearch") {
          const search = event.target.value.toLowerCase().trim();
          const category = document.getElementById("knowledgeCategory")?.value || "";
          const filtered = KNOWLEDGE_ARTICLES.filter(article => (!category || article.category === category) && (!search || `${article.title} ${article.summary}`.toLowerCase().includes(search)));
          const grid = document.getElementById("knowledgeGrid");
          if (grid) grid.innerHTML = knowledgeCards(filtered);
        }
        if (event.target.id === "auditSearch") updateAuditView();
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Enter" && event.target.id === "globalSearch") {
          event.preventDefault();
          return searchModal(event.target.value);
        }
        if (event.key === "Escape") {
          if (currentModal) closeModal();
          else if (sidebarOpen) { sidebarOpen = false; render(); }
        }
      });
      window.addEventListener("hashchange", render);
      render();
    })();
  </script>
</body>
</html>
